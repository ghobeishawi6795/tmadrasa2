<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرونده و خدمات | مدرسه</title><link rel="stylesheet" href="../assets/css/core.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/responsive.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{padding:20px}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:10px;background:var(--surface2);border-radius:10px}.mini{font-size:12px;color:var(--muted)}@media(max-width:480px){.profile-grid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileNav()"></div><aside class="sidebar" id="sidebar"><div class="logo"><div class="logo-icon">م</div><div><strong>مدرسه</strong><span>پرونده دانش‌آموز</span></div></div><nav class="nav"><button onclick="location.href='/student/index.html'"><span class="nav-icon">←</span>بازگشت</button></nav><div class="role-box"><div class="role-label">محیط فعلی</div><div class="role-name" id="roleName">دانش‌آموز</div></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="mobile-menu" onclick="toggleMobileNav()">☰</button></div><div class="top-right"><div class="profile"><div class="avatar" id="avatar">د</div><div><div class="profile-name" id="profileName">—</div><div class="profile-role">دانش‌آموز</div></div></div></div></header><section class="content"><h1>پرونده و خدمات</h1><div class="grid"><div class="card"><h3>👤 پرونده</h3><div id="profile"></div></div><div class="card"><h3>💰 وضعیت مالی</h3><div id="finance"></div></div><div class="card"><h3>📝 برنامه امتحان</h3><div id="exams"></div></div><div class="card"><h3>⚖️ انضباط</h3><div id="discipline"></div></div><div class="card"><h3>📚 کتابخانه</h3><div id="library"></div></div><div class="card full"><h3>👤 حساب کاربری من</h3><div id="accountPanel"></div></div></div></section></main></div><script src="../assets/js/api.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/account-switcher.js"></script><script src="../assets/js/navigation.js"></script><script src="../assets/js/account-panel.js"></script><script>initShell('student');mountAccountPanel('accountPanel');const esc=escapeHtml;async function load(){const [p,f,e,d,l]=await Promise.all([api.get('/api/student/profile'),api.get('/api/student/finance'),api.get('/api/student/exam-schedule'),api.get('/api/student/discipline'),api.get('/api/student/library')]);document.getElementById('profile').innerHTML=`<div class="profile-grid"><div class="field"><span class="mini">نام</span><br>${esc(p.full_name)}</div><div class="field"><span class="mini">نام کاربری</span><br>${esc(p.username)}</div><div class="field"><span class="mini">کلاس</span><br>${esc(p.class_name||'—')}</div><div class="field"><span class="mini">پایه</span><br>${esc(p.grade||'—')}</div><div class="field"><span class="mini">تولد</span><br>${esc(p.birth_date||'—')}</div><div class="field"><span class="mini">شناسه دانش‌آموز</span><br>${esc(p.student_code||'—')}</div></div>`;document.getElementById('finance').innerHTML=f.map(x=>`<div class="field" style="margin-bottom:8px">${esc(x.fee_name)} — ${Number(x.amount-x.discount).toLocaleString('fa-IR')} — پرداخت ${Number(x.paid).toLocaleString('fa-IR')}</div>`).join('')||'<span class="mini">موردی ثبت نشده</span>';document.getElementById('exams').innerHTML=e.map(x=>`<div class="field" style="margin-bottom:8px">${esc(x.subject_name)} — ${esc(x.scheduled_date)} ${esc(x.start_time)} — ${esc(x.room||'')}</div>`).join('')||'<span class="mini">برنامه‌ای نیست</span>';document.getElementById('discipline').innerHTML=d.map(x=>`<div class="field" style="margin-bottom:8px">${esc(x.title)} — ${esc(x.type)} — ${esc(x.occurred_at)}</div>`).join('')||'<span class="mini">سابقه‌ای نیست</span>';document.getElementById('library').innerHTML=`<p class="mini">${l.books.length} عنوان کتاب، ${l.loans.filter(x=>x.status==='borrowed').length} امانت فعال</p>`+l.loans.map(x=>`<div class="field" style="margin-bottom:8px">${esc(x.title)} — ${esc(x.status)} — سررسید: ${esc(x.due_at||'—')}</div>`).join('')}load().catch(e=>toast(e.message,true));</script></body></html>
