<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><title>مدرسه</title></head>
<body>
<script src="assets/js/api.js"></script>
<script>
    const session = getSession();
    if (!session || !session.token) {
        window.location.href = "/login.html";
    } else {
        const folders = { admin: "admin", teacher: "teacher", student: "student", parent: "parent", super_admin: "superadmin" };
        const role = (session.roles || []).find(r => Object.keys(folders).includes(r)) || "student";
        window.location.href = `/${folders[role]}/index.html`;
    }
</script>
</body>
</html>
