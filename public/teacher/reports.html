<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش عملکرد | مدرسه</title><link rel="stylesheet" href="../assets/css/core.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/responsive.css"></head><body><div class="app"><div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileNav()"></div><aside class="sidebar" id="sidebar"><div class="logo"><div class="logo-icon">م</div><div><strong>مدرسه</strong><span>گزارش معلم</span></div></div><nav class="nav"><button onclick="location.href='/teacher/index.html'"><span class="nav-icon">←</span>بازگشت</button></nav><div class="role-box"><div class="role-label">محیط فعلی</div><div class="role-name" id="roleName">معلم</div></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="mobile-menu" onclick="toggleMobileNav()">☰</button></div><div class="top-right"><div class="profile"><div class="avatar" id="avatar">م</div><div><div class="profile-name" id="profileName">—</div><div class="profile-role" id="profileRole">—</div></div></div></div></header><section class="content"><h1>گزارش عملکرد</h1><div id="cards" class="stats"></div><div class="card" style="margin-top:18px"><h3>کلاس‌های شما</h3><div id="classes"></div></div><div class="card" style="margin-top:18px"><h3>جلسات اولیا</h3><div id="meetings"></div></div></section></main></div><script src="../assets/js/api.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/account-switcher.js"></script><script src="../assets/js/navigation.js"></script><script>initShell('teacher');async function load(){const [r,m]=await Promise.all([api.get('/api/teacher/reports'),api.get('/api/teacher/meetings')]);document.getElementById('cards').innerHTML=`<div class="stat-card"><div class="stat-value">${r.students||0}</div><div class="stat-label">دانش‌آموز</div></div><div class="stat-card"><div class="stat-value">${r.classes.length}</div><div class="stat-label">کلاس</div></div><div class="stat-card"><div class="stat-value">${r.grades?.avg_percent??'—'}%</div><div class="stat-label">میانگین نمرات</div></div><div class="stat-card"><div class="stat-value">${r.attendance?.total?Math.round((r.attendance.present/r.attendance.total)*100):0}%</div><div class="stat-label">حضور ۳۰ روز اخیر</div></div>`;document.getElementById('classes').innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr><th>کلاس</th><th>پایه</th><th>دانش‌آموز</th></tr></thead><tbody>${r.classes.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.grade||'—')}</td><td>${x.student_count}</td></tr>`).join('')||'<tr><td colspan="3">کلاسی ثبت نشده</td></tr>'}</tbody></table></div>`;document.getElementById('meetings').innerHTML=m.map(x=>`<div style="padding:10px;border-bottom:1px solid var(--line)">${escapeHtml(x.student_name)} — ${escapeHtml(x.parent_name)} — ${escapeHtml(x.scheduled_at)} <span class="pill">${escapeHtml(x.status)}</span></div>`).join('')||'<div class="page-subtitle">جلسه‌ای ندارید.</div>'}load().catch(e=>toast(e.message,true));</script></body></html>
