<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جلسات اولیا | مدرسه</title><link rel="stylesheet" href="../assets/css/core.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/responsive.css"></head><body><div class="app"><aside class="sidebar"><div class="logo"><div class="logo-icon">م</div><div><strong>مدرسه</strong><span>جلسات اولیا</span></div></div><nav class="nav"><button onclick="location.href='/teacher/index.html'">← بازگشت</button></nav><div class="role-box"><div class="role-label">محیط فعلی</div><div class="role-name" id="roleName">معلم</div></div></aside><main class="main"><header class="topbar"><div></div><div class="profile"><div class="avatar" id="avatar">م</div><div><div id="profileName">—</div><div id="profileRole">معلم</div></div></div></header><section class="content"><h1>جلسات اولیا</h1><div class="card"><table class="data-table"><thead><tr><th>دانش‌آموز</th><th>والد</th><th>زمان</th><th>موضوع</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script src="../assets/js/api.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/account-switcher.js"></script><script>initShell('teacher');async function load(){const r=await api.get('/api/teacher/meetings');document.getElementById('rows').innerHTML=r.map(x=>`<tr><td>${escapeHtml(x.student_name)}</td><td>${escapeHtml(x.parent_name)}</td><td>${escapeHtml(x.scheduled_at)}</td><td>${escapeHtml(x.topic||'—')}</td><td>${escapeHtml(x.status)}</td><td><select onchange="changeStatus(${x.id},this.value)"><option value="requested">درخواست</option><option value="confirmed">تأیید</option><option value="completed">انجام شد</option><option value="cancelled">لغو</option></select></td></tr>`).join('')||'<tr><td colspan="6">جلسه‌ای نیست</td></tr>'}async function changeStatus(id,status){await api.patch('/api/teacher/meetings',{id,status});toast('بروزرسانی شد');load()}load().catch(e=>toast(e.message,true));</script></body></html>
