<head>
<meta charset="UTF-8">

<title>پنل معلم | مدرسه</title>
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div class="app">

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileNav()"></div>
<aside class="sidebar" id="sidebar">
    <div class="logo">
        <div class="logo-icon">م</div>
        <div><strong>مدرسه</strong><span>School Platform</span></div>
    </div>

    <div class="role-box">
        <div class="role-label">محیط فعلی</div>
        <div class="role-name" id="roleName">معلم</div>
    </div>

    <nav class="nav" id="nav"></nav>

</aside>

<main class="main">
    <header class="topbar">
        <div class="top-left">
            <button class="mobile-menu" onclick="toggleMobileNav()">☰</button>
        </div>

</main>

        <div class="modal-head">

            <button class="close" onclick="closeModal()">×</button>
        </div>

    </div>
</div>

<div class="modal-overlay" id="previewModalOverlay" style="z-index:400" onclick="closePreviewModal(event)">
    <div class="modal" style="max-width:560px">
        <div class="modal-head">
            <div class="modal-title" id="previewModalTitle">پیش‌نمایش</div>
            <button class="close" onclick="closePreviewModal()">×</button>
        </div>
        <div id="previewModalContent"></div>
    </div>
</div>

<script src="../assets/js/jalali.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/modal.js"></script>

<script>

/* =========================================================
   NAV CONFIG
   `available:false` = real product feature with no backend API yet.
   Shown-but-disabled so nothing is hidden.
========================================================= */

const NAV_ITEMS = [
    { key: "dashboard",   icon: "🏠", label: "داشبورد" },
    { key: "classes",     icon: "🏫", label: "کلاس‌ها" },
    { key: "assignments", icon: "📚", label: "تکالیف" },
    { key: "exams",       icon: "📝", label: "آزمون‌ها" },
    { key: "questions",   icon: "🗂️", label: "بانک سؤال" },
    { key: "grading",     icon: "✅", label: "تصحیح دستی" },
    { key: "attendance",  icon: "📋", label: "حضور و غیاب" },
    { key: "grades",      icon: "🎯", label: "نمرات" },
    { key: "messages",    icon: "💬", label: "پیام‌ها" },
    { key: "reports",     icon: "📊", label: "گزارش عملکرد", available: false, note: "API گزارش عملکرد هنوز ساخته نشده" },
    { key: "settings",    icon: "⚙️", label: "تنظیمات", available: false, note: "API تنظیمات هنوز ساخته نشده" },
    { key: "help",        icon: "❓", label: "راهنما" },
];

let cache = { classes: null, students: null, exams: null, questions: null, conversations: null, teachingAssignments: null, assignments: null };
let selectedQuestionIds = new Set();

function navigate(key) {
    setActiveNav(key);
    render(key);
}

async function render(key) {
    const content = document.getElementById("content");
    content.innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted)">در حال بارگذاری...</div>`;
    try {
        if (key === "dashboard") await renderDashboard();
        else if (key === "classes") await renderClasses();
        else if (key === "assignments") await renderAssignments();
        else if (key === "exams") await renderExams();
        else if (key === "questions") await renderQuestions();
        else if (key === "grading") await renderGrading();
        else if (key === "attendance") await renderAttendance();
        else if (key === "grades") await renderGrades();
        else if (key === "messages") await renderMessages();
        else if (key === "help") renderHelp();
    } catch (e) {
        content.innerHTML = `<div class="card"><div style="color:var(--red)">خطا در بارگذاری: ${escapeHtml(e.message)}</div></div>`;
    }
}

async function loadTeachingAssignments() {
    if (!cache.teachingAssignments) cache.teachingAssignments = await api.get("/api/teacher/classes");
    return cache.teachingAssignments;
}
function uniqueClasses(assignments) {
    const seen = new Map();
    for (const a of assignments) if (!seen.has(a.class_id)) seen.set(a.class_id, { id: a.class_id, name: a.class_name, grade: a.grade });
    return [...seen.values()];
}
async function loadClasses() {
    return uniqueClasses(await loadTeachingAssignments());
}
async function loadStudents() {
    if (!cache.students) cache.students = await api.get("/api/admin/students");
    return cache.students;
}

/* =========================================================
   DASHBOARD
========================================================= */

async function renderDashboard() {
    const exams = await api.get("/api/teacher/exams");
    cache.exams = exams;

    const published = exams.filter(e => e.status === "published").length;
    const drafts = exams.filter(e => e.status === "draft").length;
    const closed = exams.filter(e => e.status === "closed").length;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div>
                <div class="page-title">داشبورد معلم</div>
                <div class="page-subtitle">نمای کلی آزمون‌های شما</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">📝</div></div><div class="stat-value">${exams.length}</div><div class="stat-label">کل آزمون‌ها</div></div>
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">📤</div></div><div class="stat-value">${published}</div><div class="stat-label">منتشرشده</div></div>
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">✏️</div></div><div class="stat-value">${drafts}</div><div class="stat-label">پیش‌نویس</div></div>
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">🔒</div></div><div class="stat-value">${closed}</div><div class="stat-label">بسته‌شده</div></div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-title">آخرین آزمون‌ها</div>
                <button class="card-action" onclick="navigate('exams')">مشاهده همه</button>
            </div>
            ${exams.slice(0, 5).map(e => `
                <div class="activity">
                    <div class="activity-icon">📝</div>
                    <div>
                        <div class="activity-text"><b>${escapeHtml(e.title)}</b> — ${escapeHtml(e.class_name)} / ${escapeHtml(e.subject_name)}</div>
                        <div class="activity-time">${examStatusLabel(e.status)}</div>
                    </div>
                </div>
            `).join("") || `<div class="page-subtitle">آزمونی ثبت نشده</div>`}
        </div>
    `;
}

function examStatusLabel(s) {
    return { draft: "پیش‌نویس", published: "منتشرشده", closed: "بسته‌شده", archived: "بایگانی" }[s] || s;
}
function examStatusColor(s) {
    return { draft: "orange", published: "green", closed: "red", archived: "red" }[s] || "orange";
}

/* =========================================================
   CLASSES (real -- via teaching_assignments, only what this teacher teaches)
========================================================= */

async function renderClasses() {
    const assignments = await loadTeachingAssignments();
    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div>
                <div class="page-title">کلاس‌های من</div>
                <div class="page-subtitle">${assignments.length} تخصیص کلاس/درس</div>
            </div>
        </div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>کلاس</th><th>پایه</th><th>درس</th></tr></thead>
                <tbody>
                    ${assignments.map(a => `<tr><td>${escapeHtml(a.class_name)}</td><td>${escapeHtml(a.grade || "—")}</td><td>${escapeHtml(a.subject_name)}</td></tr>`).join("") || `<tr><td colspan="3" style="text-align:center;color:var(--muted)">هنوز به کلاس/درسی متصل نشده‌اید — از مدیر مدرسه بخواهید شما را تخصیص دهد</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

/* =========================================================
   ASSIGNMENTS
========================================================= */

const SUBMISSION_TYPE_LABELS = { text: "متنی", photo: "عکس", audio: "صوتی", draw: "نقاشی", match: "تطبیق (خودکار)", drag_drop: "دسته‌بندی (خودکار)" };

async function renderAssignments() {
    const filters = cache.assignmentFilters || (cache.assignmentFilters = {});
    const subjects = cache.subjects || (cache.subjects = await api.get("/api/admin/subjects"));
    const assignments = await api.get("/api/teacher/assignments");
    cache.assignments = assignments;

    const subjectFiltered = filters.subject_id ? assignments.filter(a => a.subject_id === Number(filters.subject_id)) : assignments;
    const chapterTabs = [...new Map(
        subjectFiltered.filter(a => a.chapter_id).map(a => [a.chapter_id, { id: a.chapter_id, name: a.chapter_name }])
    ).values()];
    const hasNoChapterItem = subjectFiltered.some(a => !a.chapter_id);
    const visible = filters.subject_id
        ? subjectFiltered.filter(a => {
            if (!filters.chapterKey) return true;
            if (filters.chapterKey === "none") return !a.chapter_id;
            return a.chapter_id === Number(filters.chapterKey);
        })
        : subjectFiltered;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div><div class="page-title">تکالیف</div><div class="page-subtitle">${visible.length} تکلیف</div></div>
            <button class="primary-btn" onclick="openAssignmentForm()">+ تکلیف جدید</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
            <button class="${!filters.subject_id ? "primary-btn" : "secondary-btn"}" style="padding:6px 12px" onclick="cache.assignmentFilters={}; renderAssignments()">همه‌ی درس‌ها</button>
            ${subjects.map(s => `
                <button class="${Number(filters.subject_id) === s.id ? "primary-btn" : "secondary-btn"}" style="padding:6px 12px" onclick="cache.assignmentFilters={subject_id:${s.id}}; renderAssignments()">${escapeHtml(s.name)}</button>
            `).join("")}
        </div>
        ${filters.subject_id && (chapterTabs.length || hasNoChapterItem) ? `
            <div class="module" style="margin-bottom:10px">
                <div class="module-body" style="display:flex;flex-direction:column;gap:6px;max-width:420px">
                    <span class="page-subtitle" style="margin:0 0 2px">فصل:</span>
                    <button class="${!filters.chapterKey ? "primary-btn" : "secondary-btn"}" style="text-align:right;padding:8px 12px" onclick="cache.assignmentFilters.chapterKey=null; renderAssignments()">همه</button>
                    ${chapterTabs.map(c => `
                        <button class="${filters.chapterKey === String(c.id) ? "primary-btn" : "secondary-btn"}" style="text-align:right;padding:8px 12px" onclick="cache.assignmentFilters.chapterKey='${c.id}'; renderAssignments()">${escapeHtml(c.name)}</button>
                    `).join("")}
                    ${hasNoChapterItem ? `<button class="${filters.chapterKey === "none" ? "primary-btn" : "secondary-btn"}" style="text-align:right;padding:8px 12px" onclick="cache.assignmentFilters.chapterKey='none'; renderAssignments()">بدون فصل</button>` : ""}
                </div>
            </div>
        ` : ""}
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>عنوان</th><th>کلاس / درس</th><th>فصل</th><th>نوع پاسخ</th><th>مهلت</th><th>پاسخ‌ها</th><th></th></tr></thead>
                <tbody>
                    ${visible.map(a => `
                        <tr>
                            <td>${escapeHtml(a.title)}</td>
                            <td>${escapeHtml(a.class_name)} / ${escapeHtml(a.subject_name)}</td>
                            <td>${a.chapter_name ? escapeHtml(a.chapter_name) : `<span style="color:var(--muted)">—</span>`}</td>
                            <td>${a.is_multi_question ? `چندسؤالی (${a.question_count} سؤال)` : (SUBMISSION_TYPE_LABELS[a.submission_type] || escapeHtml(a.submission_type))}</td>
                            <td>${formatJalaliDateTime(a.due_at)}</td>
                            <td>${a.submission_count}</td>
                            <td style="display:flex;gap:6px">
                                <button class="secondary-btn" onclick="${a.is_multi_question ? `openMultiSubmissionsList(${a.id}, ${escapeAttr(a.title)})` : `openSubmissionsList(${a.id}, ${escapeAttr(a.title)}, ${escapeAttr(a.submission_type)})`}">مشاهده پاسخ‌ها</button>
                                <button class="secondary-btn" onclick="previewAssignment(${a.id})">👁️ پیش‌نمایش</button>
                                <button class="secondary-btn" onclick="deleteAssignment(${a.id})">حذف</button>
                            </td>
                        </tr>
                    `).join("") || `<tr><td colspan="7" style="text-align:center;color:var(--muted)">تکلیفی ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

async function openAssignmentForm() {
    const assignments = await loadTeachingAssignments();
    if (assignments.length === 0) {
        toast("هنوز به هیچ کلاس/درسی متصل نیستید — از مدیر بخواهید شما را تخصیص دهد", true);
        return;
    }
    openModal("تکلیف جدید", `
        <form id="assignmentForm">
            <div class="form-group"><label>عنوان</label><input class="form-input" name="title" required></div>
            <div class="form-group"><label>کلاس / درس</label>
                <select class="form-input" name="combo" id="assignmentCombo" onchange="loadChapterOptionsFor('assignmentChapterSelect', this.value.split(':')[1])" required>
                    ${assignments.map(a => `<option value="${a.class_id}:${a.subject_id}">${escapeHtml(a.class_name)} — ${escapeHtml(a.subject_name)}</option>`).join("")}
                </select>
            </div>
            <div class="form-group"><label>فصل اصلی (اختیاری)</label>
                <select class="form-input" name="chapter_id" id="assignmentChapterSelect"><option value="">— بدون فصل —</option></select>
            </div>
            <div class="form-group"><label>توضیحات (اختیاری)</label><textarea class="form-input" name="description" rows="2" style="height:auto;padding:10px 12px"></textarea></div>
            <div class="form-group"><label>نوع پاسخ دانش‌آموز</label>
                <select class="form-input" name="submission_type" id="submissionTypeSelect" onchange="onSubmissionTypeChange()">
                    <option value="text">متنی</option>
                    <option value="photo">عکس (مثلاً از دفتر مشق)</option>
                    <option value="audio">صوتی (مثلاً روخوانی)</option>
                    <option value="draw">نقاشی (کشیدن با انگشت/ماوس)</option>
                    <option value="match">تطبیق — خودکار تصحیح می‌شود</option>
                    <option value="drag_drop">دسته‌بندی — خودکار تصحیح می‌شود</option>
                </select>
            </div>
            <div id="interactiveBuilder"></div>
            <div class="form-group"><label>مهلت ارسال</label>${renderJalaliDatePicker("dueAt", { withTime: true, defaultTime: "23:59" })}</div>
            <div class="form-group" style="display:flex;align-items:center;gap:8px">
                <input type="checkbox" name="allow_late" id="allowLate" style="width:auto">
                <label for="allowLate" style="margin:0">ارسال با تأخیر مجاز باشد</label>
            </div>
            <div class="form-group"><label>حداکثر تعداد ارسال</label><input class="form-input" name="max_attempts" type="number" min="1" value="1"></div>
            <div class="form-group"><label>نمره کامل</label><input class="form-input" name="max_score" type="number" min="1" value="20"></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ثبت تکلیف</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);
    onSubmissionTypeChange();
    loadChapterOptionsFor("assignmentChapterSelect", document.getElementById("assignmentCombo").value.split(":")[1]);

    document.getElementById("assignmentForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        const [classId, subjectId] = body.combo.split(":");
        delete body.combo;
        body.class_id = classId; body.subject_id = subjectId;
        if (!body.chapter_id) delete body.chapter_id;
        body.allow_late = fd.get("allow_late") ? true : false;
        const dueAtLocal = readJalaliDatePicker("dueAt", { withTime: true });
        if (!dueAtLocal) { toast("مهلت ارسال را کامل مشخص کنید", true); return; }
        body.due_at = new Date(dueAtLocal).toISOString();

        if (body.submission_type === "match" || body.submission_type === "drag_drop") {
            try {
                body.question_payload = collectInteractivePayload(body.submission_type);
            } catch (err) {
                toast(err.message, true);
                return;
            }
        }

        await withToast(() => api.post("/api/teacher/assignments", body), "تکلیف ثبت شد");
        closeModal();
        renderAssignments();
    });
}

// -- interactive assignment payload builder (match / drag_drop) --
// Renders inline inside the assignment form; only shown for those two types.
function onSubmissionTypeChange() {
    const type = document.getElementById("submissionTypeSelect").value;
    const box = document.getElementById("interactiveBuilder");
    if (type === "match") {
        box.innerHTML = `
            <div class="form-group">
                <label>جفت‌های تطبیق (حداقل ۲، حداکثر ۱۰)</label>
                <div id="matchPairs"></div>
                <button type="button" class="secondary-btn" onclick="addMatchPairRow()">+ افزودن جفت</button>
            </div>
        `;
        addMatchPairRow(); addMatchPairRow();
    } else if (type === "drag_drop") {
        box.innerHTML = `
            <div class="form-group">
                <label>نام دسته‌ها (با ویرگول جدا کنید)</label>
                <input class="form-input" id="bucketNames" placeholder="مثلاً: حیوانات، میوه‌ها">
            </div>
            <div class="form-group">
                <label>آیتم‌ها (هر کدام + دسته‌ی درست، حداقل ۲، حداکثر ۱۵)</label>
                <div id="dragItems"></div>
                <button type="button" class="secondary-btn" onclick="addDragItemRow()">+ افزودن آیتم</button>
            </div>
        `;
        addDragItemRow(); addDragItemRow();
    } else {
        box.innerHTML = "";
    }
}

function addMatchPairRow() {
    const container = document.getElementById("matchPairs");
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;margin-bottom:6px";
    row.innerHTML = `
        <input class="form-input match-left" placeholder="سمت چپ (مثلاً: سلام)">
        <input class="form-input match-right" placeholder="سمت راست (مثلاً: Hello)">
        <button type="button" class="secondary-btn" onclick="this.parentElement.remove()">حذف</button>
    `;
    container.appendChild(row);
}

function addDragItemRow() {
    const container = document.getElementById("dragItems");
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;margin-bottom:6px";
    row.innerHTML = `
        <input class="form-input drag-item-text" placeholder="متن آیتم (مثلاً: سیب)">
        <input class="form-input drag-item-bucket" type="number" min="0" placeholder="شماره دسته (۰ برای اولی)" style="max-width:150px">
        <button type="button" class="secondary-btn" onclick="this.parentElement.remove()">حذف</button>
    `;
    container.appendChild(row);
}

function collectInteractivePayload(type) {
    if (type === "match") {
        const pairs = [...document.querySelectorAll("#matchPairs > div")].map(row => ({
            left: row.querySelector(".match-left").value,
            right: row.querySelector(".match-right").value,
        })).filter(p => p.left.trim() && p.right.trim());
        if (pairs.length < 2) throw new Error("حداقل ۲ جفت کامل لازم است");
        return { pairs };
    }
    if (type === "drag_drop") {
        const buckets = document.getElementById("bucketNames").value.split("،").join(",").split(",").map(b => b.trim()).filter(Boolean);
        if (buckets.length < 2) throw new Error("حداقل ۲ دسته لازم است");
        const items = [...document.querySelectorAll("#dragItems > div")].map(row => ({
            text: row.querySelector(".drag-item-text").value,
            bucket_index: Number(row.querySelector(".drag-item-bucket").value),
        })).filter(it => it.text.trim());
        if (items.length < 2) throw new Error("حداقل ۲ آیتم لازم است");
        for (const it of items) {
            if (!Number.isInteger(it.bucket_index) || it.bucket_index < 0 || it.bucket_index >= buckets.length) {
                throw new Error(`شماره دسته برای «${it.text}» نامعتبر است (باید بین ۰ و ${buckets.length - 1} باشد)`);
            }
        }
        return { buckets, items };
    }
}

async function deleteAssignment(id) {
    if (!confirm("از حذف این تکلیف مطمئن هستید؟")) return;
    await withToast(() => api.del("/api/teacher/assignments", { id }), "تکلیف حذف شد");
    renderAssignments();
}

async function openSubmissionsList(assignmentId, title, submissionType) {
    const submissions = await api.get(`/api/teacher/submissions?assignment_id=${assignmentId}`);
    const isAutoGraded = submissionType === "match" || submissionType === "drag_drop";
    openModal(`پاسخ‌های: ${title}`, `
        <div style="max-height:420px;overflow:auto">
            ${submissions.map(s => `
                <div class="card" style="margin-bottom:10px">
                    <div class="card-head"><div class="card-title">${escapeHtml(s.student_name)}</div>
                        <span class="status ${s.status === "graded" ? "green" : s.status === "late" ? "orange" : "orange"}">${submissionStatusLabel(s.status)}</span>
                    </div>
                    ${s.body ? `<div style="font-size:12px;background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:8px">${escapeHtml(s.body)}</div>` : ""}
                    ${!isAutoGraded && s.answer_data ? renderAnswerPreview(s) : ""}
                    ${isAutoGraded
                        ? `<div class="page-subtitle">نمره‌ی خودکار: ${s.score ?? "—"}</div>`
                        : `<form onsubmit="return submitAssignmentGrade(event, ${s.id}, ${assignmentId}, ${escapeAttr(title)}, ${escapeAttr(submissionType)})">
                        <div class="form-group" style="display:flex;gap:8px">
                            <input class="form-input" name="score" type="number" min="0" placeholder="نمره" value="${s.score ?? ""}" required style="max-width:110px">
                            <input class="form-input" name="feedback" placeholder="بازخورد" value="${escapeHtml(s.feedback || "")}">
                            <button type="submit" class="secondary-btn">ثبت</button>
                        </div>
                    </form>`}
                </div>
            `).join("") || `<div class="page-subtitle">هنوز پاسخی ارسال نشده</div>`}
        </div>
        <div class="modal-footer"><button class="secondary-btn" onclick="closeModal()">بستن</button></div>
    `);
}

function submissionStatusLabel(s) { return { submitted: "ارسال‌شده", late: "با تأخیر", graded: "تصحیح‌شده" }[s] || s; }

function renderAnswerPreview(s) {
    // answer_data is a data: URI (image or audio) captured client-side -- see student panel
    if (s.answer_data.startsWith("data:image")) return `<img src="${s.answer_data}" style="max-width:200px;border-radius:8px;margin-bottom:8px">`;
    if (s.answer_data.startsWith("data:audio")) return `<audio controls src="${s.answer_data}" style="width:100%;margin-bottom:8px"></audio>`;
    return "";
}

async function submitAssignmentGrade(event, submissionId, assignmentId, title) {
    event.preventDefault();
    const fd = new FormData(event.target);

    openSubmissionsList(assignmentId, title);
    return false;
}

async function renderExams() {
    const filters = cache.examFilters || (cache.examFilters = {});
    const subjects = cache.subjects || (cache.subjects = await api.get("/api/admin/subjects"));
    const exams = await api.get("/api/teacher/exams");
    cache.exams = exams;

    const subjectFiltered = filters.subject_id ? exams.filter(e => e.subject_id === Number(filters.subject_id)) : exams;
    // chapter sub-tabs derived from this filtered list itself (no separate
    // fetch/management here -- unlike the bank page, chapters aren't created
    // from this screen, only picked at exam-creation time via chapters.js).
    const chapterTabs = [...new Map(
        subjectFiltered.filter(e => e.chapter_id).map(e => [e.chapter_id, { id: e.chapter_id, name: e.chapter_name }])
    ).values()];
    const hasNoChapterItem = subjectFiltered.some(e => !e.chapter_id);
    const visible = filters.subject_id
        ? subjectFiltered.filter(e => {
            if (!filters.chapterKey) return true;
            if (filters.chapterKey === "none") return !e.chapter_id;
            return e.chapter_id === Number(filters.chapterKey);
        })
        : subjectFiltered;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div><div class="page-title">آزمون‌ها</div><div class="page-subtitle">${visible.length} آزمون</div></div>
            <button class="primary-btn" onclick="openExamForm()">+ آزمون جدید</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
            <button class="${!filters.subject_id ? "primary-btn" : "secondary-btn"}" style="padding:6px 12px" onclick="cache.examFilters={}; renderExams()">همه‌ی درس‌ها</button>
            ${subjects.map(s => `
                <button class="${Number(filters.subject_id) === s.id ? "primary-btn" : "secondary-btn"}" style="padding:6px 12px" onclick="cache.examFilters={subject_id:${s.id}}; renderExams()">${escapeHtml(s.name)}</button>
            `).join("")}
        </div>
        ${filters.subject_id && (chapterTabs.length || hasNoChapterItem) ? `
            <div class="module" style="margin-bottom:10px">
                <div class="module-body" style="display:flex;flex-direction:column;gap:6px;max-width:420px">
                    <span class="page-subtitle" style="margin:0 0 2px">فصل:</span>
                    <button class="${!filters.chapterKey ? "primary-btn" : "secondary-btn"}" style="text-align:right;padding:8px 12px" onclick="cache.examFilters.chapterKey=null; renderExams()">همه</button>
                    ${chapterTabs.map(c => `
                        <button class="${filters.chapterKey === String(c.id) ? "primary-btn" : "secondary-btn"}" style="text-align:right;padding:8px 12px" onclick="cache.examFilters.chapterKey='${c.id}'; renderExams()">${escapeHtml(c.name)}</button>
                    `).join("")}
                    ${hasNoChapterItem ? `<button class="${filters.chapterKey === "none" ? "primary-btn" : "secondary-btn"}" style="text-align:right;padding:8px 12px" onclick="cache.examFilters.chapterKey='none'; renderExams()">بدون فصل</button>` : ""}
                </div>
            </div>
        ` : ""}
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>عنوان</th><th>کلاس / درس</th><th>فصل</th><th>وضعیت</th><th></th></tr></thead>
                <tbody>
                    ${visible.map(e => `
                        <tr>
                            <td>${escapeHtml(e.title)}</td>
                            <td>${escapeHtml(e.class_name)} / ${escapeHtml(e.subject_name)}</td>
                            <td>${e.chapter_name ? escapeHtml(e.chapter_name) : `<span style="color:var(--muted)">—</span>`}</td>
                            <td><span class="status ${examStatusColor(e.status)}">${examStatusLabel(e.status)}</span></td>
                            <td style="display:flex;gap:6px;flex-wrap:wrap">
                                <button class="secondary-btn" onclick="openExamQuestions(${e.id})">سؤالات</button>
                                <button class="secondary-btn" onclick="previewExam(${e.id})">👁️ پیش‌نمایش</button>
                                ${e.status === "draft" ? `<button class="secondary-btn" onclick="publishExam(${e.id})">انتشار</button>` : ""}
                                ${e.status === "published" ? `<button class="secondary-btn" onclick="closeExam(${e.id})">بستن</button>` : ""}
                                <button class="secondary-btn" onclick="deleteExam(${e.id})">حذف</button>
                            </td>
                        </tr>
                    `).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--muted)">آزمونی ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

async function openExamForm() {
    const assignments = await loadTeachingAssignments();
    if (assignments.length === 0) {
        toast("هنوز به هیچ کلاس/درسی متصل نیستید — از مدیر بخواهید شما را تخصیص دهد", true);
        return;
    }
    openModal("آزمون جدید", `
        <form id="examForm">
            <div class="form-group"><label>عنوان آزمون</label><input class="form-input" name="title" required></div>
            <div class="form-group"><label>کلاس / درس</label>
                <select class="form-input" name="combo" id="examCombo" onchange="loadChapterOptionsFor('examChapterSelect', this.value.split(':')[1])" required>
                    ${assignments.map(a => `<option value="${a.class_id}:${a.subject_id}">${escapeHtml(a.class_name)} — ${escapeHtml(a.subject_name)}</option>`).join("")}
                </select>
            </div>
            <div class="form-group"><label>فصل اصلی (اختیاری)</label>
                <select class="form-input" name="chapter_id" id="examChapterSelect"><option value="">— بدون فصل —</option></select>
            </div>
            <div class="form-group"><label>توضیحات (اختیاری)</label><textarea class="form-input" name="description" rows="2" style="height:auto;padding:10px 12px"></textarea></div>
            <div class="form-group"><label>شروع</label>${renderJalaliDatePicker("examStart", { withTime: true, defaultTime: "08:00" })}</div>
            <div class="form-group"><label>پایان</label>${renderJalaliDatePicker("examEnd", { withTime: true, defaultTime: "09:00" })}</div>
            <div class="form-group"><label>مدت (دقیقه)</label><input class="form-input" name="duration_minutes" type="number" min="1" required></div>
            <div class="form-group"><label>حداکثر تعداد تلاش</label><input class="form-input" name="max_attempts" type="number" min="1" value="1"></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ساخت (پیش‌نویس)</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);
    loadChapterOptionsFor("examChapterSelect", document.getElementById("examCombo").value.split(":")[1]);

    document.getElementById("examForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        const [classId, subjectId] = body.combo.split(":");
        delete body.combo;
        body.class_id = classId; body.subject_id = subjectId;
        if (!body.chapter_id) delete body.chapter_id;
        const startLocal = readJalaliDatePicker("examStart", { withTime: true });
        const endLocal = readJalaliDatePicker("examEnd", { withTime: true });
        if (!startLocal || !endLocal) { toast("زمان شروع و پایان را کامل مشخص کنید", true); return; }
        body.start_at = new Date(startLocal).toISOString();
        body.end_at = new Date(endLocal).toISOString();
        await withToast(() => api.post("/api/teacher/exams", body), "آزمون ساخته شد");
        closeModal();
        renderExams();
    });
}

// Shared by the exam and assignment "create" forms -- populates a chapter
// <select> (id passed in) with the given subject's chapters, called both on
// open (for the initially-selected subject) and again whenever the class/درس
// combo box changes. Purely additive/optional: leaving it on "— بدون فصل —"
// omits chapter_id from the submitted body entirely.
async function loadChapterOptionsFor(selectId, subjectId) {
    const select = document.getElementById(selectId);
    if (!select) return;
    select.innerHTML = `<option value="">— بدون فصل —</option>`;
    if (!subjectId) return;
    try {
        const chapters = await api.get(`/api/teacher/chapters?subject_id=${subjectId}`);
        select.innerHTML = `<option value="">— بدون فصل —</option>` +
            chapters.filter(c => c.id).map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
    } catch (e) { /* subject with no chapters yet, or fetch failed -- leave as "بدون فصل" */ }
}

async function publishExam(id) {
    if (!confirm("بعد از انتشار، فقط بستن آزمون ممکن است. مطمئنید؟")) return;
    await withToast(() => api.put("/api/teacher/exams", { id, action: "publish" }), "آزمون منتشر شد");
    renderExams();
}
async function closeExam(id) {
    await withToast(() => api.put("/api/teacher/exams", { id, action: "close" }), "آزمون بسته شد");
    renderExams();
}
async function deleteExam(id) {
    if (!confirm("از حذف این آزمون مطمئن هستید؟")) return;
    await withToast(() => api.del("/api/teacher/exams", { id }), "آزمون حذف شد");
    renderExams();
}

async function openExamQuestions(examId) {
    const [bank, exams, attached] = await Promise.all([
        cache.questions || api.get("/api/teacher/questions"),
        cache.exams || api.get("/api/teacher/exams"),
        api.get(`/api/teacher/exam-questions?exam_id=${examId}`),
    ]);
    cache.questions = bank;
    const exam = exams.find(e => e.id === examId);
    const attachedIds = new Set(attached.map(a => a.question_id));
    const available = bank.filter(q => !attachedIds.has(q.id));
    let nextPosition = attached.length;

    openModal(`سؤالات آزمون: ${escapeHtml(exam ? exam.title : "")}`, `
        ${attached.length ? `
            <div class="page-subtitle" style="margin-bottom:6px">سؤال‌های اضافه‌شده به این آزمون (${attached.length} سؤال):</div>
            <ul style="margin:0 0 14px;padding-inline-start:18px;font-size:14px;color:var(--muted)">
                ${attached.map(a => `<li>${escapeHtml(a.text.slice(0, 60))} — ${a.score} نمره</li>`).join("")}
            </ul>
        ` : ""}
        <div class="page-subtitle" style="margin-bottom:10px">هر چند سؤال که می‌خوای از بانک سؤال تیک بزن و یک‌جا اضافه‌شون کن (فقط برای آزمون پیش‌نویس).</div>
        <form id="attachForm">
            <div class="form-group">
                <label>نمره‌ی هر سؤال (به همه‌ی سؤال‌های تیک‌خورده اعمال می‌شه)</label>
                <input class="form-input" name="score" type="number" min="1" value="10">
            </div>
            <div style="max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:14px">
                ${available.length ? available.map(q => `
                    <label style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer">
                        <input type="checkbox" name="qids" value="${q.id}" style="margin-top:3px;flex-shrink:0">
                        <span style="font-size:14px">${escapeHtml(q.text)}<span style="color:var(--muted)"> — ${questionTypeLabel(q.type)}</span></span>
                    </label>
                `).join("") : `<div style="padding:14px;color:var(--muted);font-size:14px">همه‌ی سؤال‌های بانک قبلاً به این آزمون اضافه شده‌اند.</div>`}
            </div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">افزودن سؤال‌های انتخاب‌شده</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">بستن</button>
            </div>
        </form>
    `);

    document.getElementById("attachForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const score = fd.get("score");
        const questionIds = fd.getAll("qids");
        if (questionIds.length === 0) { toast("حداقل یک سؤال را انتخاب کن"); return; }

        let addedCount = 0;
        for (const questionId of questionIds) {
            try {
                await api.post("/api/teacher/exam-questions", {
                    exam_id: examId, question_id: Number(questionId), score, position: nextPosition++,
                });
                addedCount++;
            } catch (err) {
                toast(`یک سؤال اضافه نشد: ${err.message || "خطا"}`);
            }
        }
        toast(`${addedCount} سؤال اضافه شد`);
        openExamQuestions(examId);
    });
}

                </div>
            </div>
        ` : ""}
        <div id="qSelectionBar"></div>
        <div class="module"><div class="module-body" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <input class="form-input" id="qSearch" placeholder="جستجو در متن/فصل/مبحث/برچسب..." value="${escapeHtml(filters.search || "")}" style="flex:1;min-width:180px">

                <option value="">همه‌ی انواع</option>

        </div></div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr>${scope === "mine" ? "<th></th><th></th>" : ""}<th>متن سؤال</th><th>نوع</th>${scope === "mine" ? "<th>تصحیح</th>" : "<th>معلم</th>"}<th></th></tr></thead>

                            <td><button class="secondary-btn" style="padding:2px 8px" title="${q.is_favorite ? "حذف از علاقه‌مندی‌ها" : "افزودن به علاقه‌مندی‌ها"}" onclick="toggleQuestionFavorite(${q.id})">${q.is_favorite ? "⭐" : "☆"}</button></td>
                            <td>${escapeHtml(q.text)}${questionMetaChips(q)}${visibilityBadge(q.visibility)}${q.is_practice ? ` <span class="status green" style="font-size:11px">🧪 تمرین</span>` : ""}</td>
                            <td>${questionTypeLabel(q.type)}</td>
                            <td><span class="status ${q.grading_mode === "auto" ? "green" : "orange"}">${q.grading_mode === "auto" ? "خودکار" : "دستی"}</span></td>
                            <td>
                                <div style="display:flex;gap:4px;flex-wrap:wrap">
                                    <button class="secondary-btn" onclick="openQuestionForm(cache.questions.find(x => x.id === ${q.id}))">ویرایش</button>
                                    <button class="secondary-btn" style="padding:6px 8px" title="${q.is_practice ? "حذف از بخش تمرین دانش‌آموزان" : "نمایش در بخش تمرین دانش‌آموزان (بدون احتساب نمره)"}" onclick="toggleQuestionPractice(${q.id})">${q.is_practice ? "🧪✔️" : "🧪"}</button>
                                    <button class="secondary-btn" style="padding:6px 8px" title="آمار این سؤال" onclick="openQuestionAnalytics(${q.id})">📊</button>
                                    <button class="secondary-btn" style="padding:6px 8px" title="مهارت‌های مرتبط" onclick="openQuestionSkills(${q.id})">🎯</button>
                                    ${["numeric","multiple_choice","true_false"].includes(q.type) ? `<button class="secondary-btn" style="padding:6px 8px" title="ساخت یک نسخه‌ی مشابه با اعداد دیگر" onclick="generateQuestionVariant(${q.id})">🎲</button>` : ""}
                                    ${q.import_html ? `<button class="secondary-btn" style="padding:6px 8px" title="نمایش دقیق فایل اصلی وارد‌شده" onclick="openFullscreenHtmlPreview(cache.questions.find(x => x.id === ${q.id}).import_style, cache.questions.find(x => x.id === ${q.id}).import_html)">👁️</button>` : ""}
                                </div>
                                ${q.used_in_exam ? `<div class="page-subtitle" style="font-size:11px;margin-top:4px" title="ویرایش این سؤال، آزمون‌هایی که قبلاً به آن‌ها اضافه شده را تغییر نمی‌دهد">نسخه ${q.version} · قبلاً استفاده شده</div>` : ""}
                            </td>

                    ` : `
                        <tr>
                            <td>${escapeHtml(q.text)}${questionMetaChips(q)}</td>
                            <td>${questionTypeLabel(q.type)}</td>
                            <td class="page-subtitle">${escapeHtml(q.teacher_name || "—")}</td>
                            <td><button class="secondary-btn" onclick="copyPublicQuestion(${q.id})">کپی به بانک من</button></td>

    `;

    let searchTimer;
    document.getElementById("qSearch").addEventListener("input", (e) => {

        searchTimer = setTimeout(() => {
            cache.questionFilters.search = e.target.value || undefined;
            renderQuestions();

    });
    document.getElementById("qFilterType").addEventListener("change", (e) => {
        cache.questionFilters.type = e.target.value || undefined;
        renderQuestions();
    });
    document.getElementById("qFilterDifficulty").addEventListener("change", (e) => {
        cache.questionFilters.difficulty = e.target.value || undefined;
        renderQuestions();
    });
    document.getElementById("qFilterFavorite").addEventListener("change", (e) => {
        cache.questionFilters.favorite = e.target.checked || undefined;

function updateSelectionBar() {
    const bar = document.getElementById("qSelectionBar");
    if (!bar) return;
    const n = selectedQuestionIds.size;
    bar.innerHTML = n ? `
        <div class="module" style="margin-bottom:10px"><div class="module-body" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span>${n} سؤال انتخاب شده</span>
            <button class="primary-btn" onclick="openSendSelectedToExam()">➕ افزودن به آزمون</button>
            <button class="secondary-btn" onclick="selectedQuestionIds.clear(); renderQuestions()">لغو انتخاب</button>
        </div></div>
    ` : "";
}

function toggleQuestionSelect(id, checked) {
    if (checked) selectedQuestionIds.add(id); else selectedQuestionIds.delete(id);
    updateSelectionBar();
}

async function openSendSelectedToExam() {
    const exams = (cache.exams || (cache.exams = await api.get("/api/teacher/exams"))).filter(e => e.status === "draft");
    if (exams.length === 0) {
        toast("اول یک آزمون پیش‌نویس بساز، بعد سؤال‌ها را بهش اضافه کن");
        return;
    }
    const ids = [...selectedQuestionIds];

    openModal(`افزودن ${ids.length} سؤال به آزمون`, `
        <form id="sendToExamForm">
            <div class="form-group"><label>آزمون (فقط پیش‌نویس‌ها)</label>
                <select class="form-input" name="exam_id" required>
                    ${exams.map(e => `<option value="${e.id}">${escapeHtml(e.title)} (${escapeHtml(e.class_name)} / ${escapeHtml(e.subject_name)})</option>`).join("")}
                </select>
            </div>
            <div class="form-group"><label>نمره‌ی هر سؤال</label><input class="form-input" name="score" type="number" min="1" value="10"></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">افزودن</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);

    document.getElementById("sendToExamForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const examId = Number(fd.get("exam_id"));
        const score = fd.get("score");

        const attached = await api.get(`/api/teacher/exam-questions?exam_id=${examId}`);
        const attachedIds = new Set(attached.map(a => a.question_id));
        let nextPosition = attached.length;

        let addedCount = 0, skippedCount = 0;
        for (const id of ids) {
            if (attachedIds.has(id)) { skippedCount++; continue; }
            try {
                await api.post("/api/teacher/exam-questions", { exam_id: examId, question_id: id, score, position: nextPosition++ });
                addedCount++;
            } catch (err) {
                toast(`یک سؤال اضافه نشد: ${err.message || "خطا"}`);
            }
        }
        closeModal();
        selectedQuestionIds.clear();
        toast(`${addedCount} سؤال اضافه شد` + (skippedCount ? `، ${skippedCount} مورد قبلاً روی این آزمون بود` : ""));
        cache.exams = null;
        renderQuestions();
    });
}

async function toggleQuestionFavorite(id) {

    cache.questions = null;

}

// "تمرین" only reaches a student if the question also has a درس (subject)
// set -- students browse practice by subject tab, same as the bank itself.
async function toggleQuestionPractice(id) {
    const question = cache.questions.find(x => x.id === id);
    if (question && !question.is_practice && !question.subject_id) {
        if (!confirm("این سؤال درس مشخصی نداره، پس توی «تمرین» دانش‌آموز دیده نمی‌شه مگر یک درس براش انتخاب کنی. ادامه بدم؟")) return;
    }
    await withToast(() => api.post("/api/teacher/toggle-question-practice", { id }), "به‌روزرسانی شد");
    cache.questions = null;
    renderQuestions();
}

async function promptNewSubject() {
    const name = await promptModal("درس جدید", "نام درس جدید:");
    if (!name || !name.trim()) return;
    await withToast(() => api.post("/api/admin/subjects", { name: name.trim() }), "درس ساخته شد");
    cache.subjects = null;
    renderQuestions();
}

async function promptRenameSubject(id) {
    const subject = cache.subjects.find(s => s.id === id);
    const name = await promptModal("ویرایش نام درس", "نام جدید درس:", subject ? subject.name : "");
    if (!name || !name.trim() || (subject && name.trim() === subject.name)) return;
    await withToast(() => api.put("/api/admin/subjects", { id, name: name.trim() }), "نام درس بروزرسانی شد");

// A chapter is now a real, manageable row (see functions/api/teacher/chapters.js)
// -- can be created empty (no question needed first), renamed (cascades onto
// every existing question's plain-text chapter field), described, or deleted
// (deleting only removes the managed row/description; any questions already
// using that chapter text keep it and the tab reappears via the legacy
// fallback in chapters.js's GET, so nothing is ever silently lost).
async function openChapterForm(chapter) {
    const isEdit = !!(chapter && chapter.id);
    openModal(isEdit ? "ویرایش فصل" : "فصل جدید", `
        <form id="chapterForm">
            <div class="form-group"><label>نام فصل</label><input class="form-input" name="name" value="${escapeHtml(chapter?.name || "")}" required></div>
            <div class="form-group"><label>توضیحات (اختیاری)</label><textarea class="form-input" name="description" rows="3" style="height:auto;padding:10px 12px">${escapeHtml(chapter?.description || "")}</textarea></div>
            ${!isEdit ? `<div class="page-subtitle" style="margin-bottom:10px">این فصل همین الان به‌صورت یک تب دائمی اضافه می‌شه — لازم نیست حتماً سؤالی داخلش ثبت کنی.</div>` : ""}
            <div class="modal-footer">
                <button type="submit" class="primary-btn">${isEdit ? "ذخیره" : "ساخت فصل"}</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);
    document.getElementById("chapterForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { name: fd.get("name"), description: fd.get("description") || null };
        if (isEdit) {
            body.id = chapter.id;
            await withToast(() => api.put("/api/teacher/chapters", body), "فصل به‌روزرسانی شد");
        } else {
            body.subject_id = cache.questionFilters.subject_id;
            await withToast(() => api.post("/api/teacher/chapters", body), "فصل ساخته شد");
        }
        closeModal();
        renderQuestions();
    });
}

async function deleteChapter(id) {
    if (!confirm("این فصل حذف بشه؟ سؤال‌هایی که قبلاً با این فصل ثبت شده‌اند دست‌نخورده می‌مانند.")) return;
    await withToast(() => api.del("/api/teacher/chapters", { id }), "فصل حذف شد");
    if (cache.questionFilters?.chapter) cache.questionFilters.chapter = null;
    renderQuestions();
}

    overlay.style.cssText = "position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column";
    overlay.innerHTML = `
        <div style="display:flex;justify-content:flex-end;padding:8px;border-bottom:1px solid var(--line);flex-shrink:0">
            <button class="secondary-btn" onclick="document.getElementById('htmlPreviewOverlay').remove()">✕ بستن</button>

async function openQuestionSkills(id) {
    const [linked, allSkills] = await Promise.all([
        api.get(`/api/teacher/question-skills?question_id=${id}`),
        api.get("/api/teacher/skills"),
    ]);
    const linkedIds = new Set(linked.map(s => s.id));
    openModal("مهارت‌های مرتبط با این سؤال", `
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
            ${allSkills.length ? allSkills.map(s => `
                <label style="display:flex;align-items:center;gap:8px">
                    <input type="checkbox" ${linkedIds.has(s.id) ? "checked" : ""} onchange="toggleQuestionSkill(${id}, ${s.id}, this.checked)">
                    ${escapeHtml(s.name)}
                </label>
            `).join("") : `<div class="page-subtitle">هنوز مهارتی نساختی.</div>`}
        </div>
        <form onsubmit="return addSkillInline(event, ${id})" style="display:flex;gap:8px">
            <input class="form-input" name="name" placeholder="مهارت جدید (مثال: جمع دورقمی)" required>
            <button type="submit" class="secondary-btn">افزودن</button>
        </form>
        <div class="modal-footer"><button class="secondary-btn" onclick="closeModal()">بستن</button></div>

async function toggleQuestionSkill(questionId, skillId, checked) {
    if (checked) await api.post("/api/teacher/question-skills", { question_id: questionId, skill_id: skillId });
    else await api.del("/api/teacher/question-skills", { question_id: questionId, skill_id: skillId });
}

async function addSkillInline(e, questionId) {
    e.preventDefault();
    const name = new FormData(e.target).get("name");
    const skill = await withToast(() => api.post("/api/teacher/skills", { name }));
    await api.post("/api/teacher/question-skills", { question_id: questionId, skill_id: skill.id });
    openQuestionSkills(questionId);
    return false;
}

function questionTypeLabel(t) {
    return { multiple_choice: "چندگزینه‌ای", true_false: "درست/غلط", numeric: "عددی", short_answer: "پاسخ کوتاه", long_answer: "تشریحی", fill_blank: "جای‌خالی", custom_html: "HTML تعاملی" }[t] || t;
}

function difficultyLabel(d) {
    return { easy: "آسان", medium: "متوسط", hard: "دشوار" }[d] || d;
}

function visibilityBadge(v) {
    if (v === "public") return ` <span class="status green" style="font-size:11px">🌐 عمومی</span>`;
    if (v === "pending") return ` <span class="status orange" style="font-size:11px">در انتظار تأیید مدیر</span>`;
    return "";
}

// Small secondary line under the question text in the bank table --
// chapter/topic/difficulty/tags, only the ones actually set.
function questionMetaChips(q) {
    const parts = [];
    if (q.chapter) parts.push(escapeHtml(q.chapter));
    if (q.topic) parts.push(escapeHtml(q.topic));
    if (q.difficulty) parts.push(difficultyLabel(q.difficulty));
    if (q.tags) parts.push(q.tags.split(",").map(t => `#${escapeHtml(t)}`).join(" "));
    if (!parts.length) return "";
    return `<div class="page-subtitle" style="margin-top:4px;font-size:12px">${parts.join(" · ")}</div>`;
}

async function openImportHtmlForm() {
    const classes = (cache.classes && cache.classes.length ? cache.classes : await api.get("/api/teacher/classes")) || [];
    cache.classes = classes;

            اگه فایل شامل تکلیف هم باشه، باید کلاس مقصدش رو مشخص کنی (سؤال‌های بانک آزمون به کلاس خاصی نیاز ندارن).
        </div>
        <div class="form-group">
            <label>فایل HTML</label>
            <input type="file" id="importHtmlFile" accept=".html,.htm,text/html" class="form-input">
        </div>
        <div class="form-group">
            <label>کلاس مقصد (فقط برای تکلیف‌های داخل فایل)</label>
            <select id="importHtmlClass" class="form-input">
                <option value="">— انتخاب نشده —</option>
                ${uniqueClasses.map(c => `<option value="${c.class_id}">${escapeHtml(c.class_name)}</option>`).join("")}
            </select>

function submitImportHtml() {
    const fileInput = document.getElementById("importHtmlFile");
    const file = fileInput.files[0];
    if (!file) { toast("یک فایل HTML انتخاب کن", true); return; }

    const reader = new FileReader();
    reader.onload = async () => {
        const class_id = document.getElementById("importHtmlClass").value;
        const resultBox = document.getElementById("importHtmlResult");
        resultBox.innerHTML = `<div class="page-subtitle">در حال بررسی و ثبت...</div>`;
        try {
            const body = { html: reader.result };
            if (class_id) body.class_id = Number(class_id);
            const res = await api.post("/api/teacher/import-html", body);
            let html = `<div class="page-subtitle" style="color:var(--green,#1a9e5c);margin-top:8px">${res.imported} مورد با موفقیت اضافه شد.</div>`;
            if (res.skipped && res.skipped.length) {
                html += `<div class="page-subtitle" style="margin-top:8px">موارد رد شده:</div>
                    <ul style="margin:6px 0 0;padding-inline-start:20px;font-size:13px;color:var(--muted)">
                        ${res.skipped.map(s => `<li>مورد شماره ${s.index + 1}: ${escapeHtml(s.reason)}</li>`).join("")}
                    </ul>`;
            }
            resultBox.innerHTML = html;
            cache.questions = null; cache.assignments = null;
        } catch (e) {
            resultBox.innerHTML = `<div class="page-subtitle" style="color:var(--red)">${escapeHtml(e.message)}</div>`;
        }
    };
    reader.readAsText(file, "UTF-8");
}

/* =========================================================
   "پیش‌نمایش به چشم دانش‌آموز" -- shows the question, live from
   whatever is currently typed in the (still-open, unsaved) form
   above, exactly the way a student would see and answer it in
   تمرین/آزمون/تکلیف. Nothing here ever hits the server or gets
   saved -- grading is simulated locally against the answer key
   values sitting in the form fields. Reuses the same visual
   pattern as the student's renderPracticeQuestion so it's a
   faithful preview, not just a rough approximation.
========================================================= */
let __previewQuestion = null;

function previewCurrentQuestion(isEdit, existing) {
    const form = document.getElementById("questionForm");
    const fd = new FormData(form);
    const type = isEdit ? existing.type : fd.get("type");
    const q = {
        type,
        text: (fd.get("text") || "").trim(),
        chapter: fd.get("chapter") || "",
        explanation: fd.get("explanation") || "",
    };

    if (type === "multiple_choice") {
        const texts = fd.getAll("opt_text");
        const correctIdx = Number(fd.get("correct_idx"));
        q.options = texts.map((t, i) => ({ text: (t || "").trim() || `گزینه ${i + 1}`, is_correct: i === correctIdx }));
        if (q.options.filter(o => o.text).length < 2) { toast("حداقل ۲ گزینه پر کن", true); return; }
    } else if (type === "true_false") {
        q.correct_boolean = fd.get("correct_boolean") === "true";
    } else if (type === "numeric") {
        q.correct_numeric = Number(fd.get("correct_numeric"));
        q.numeric_tolerance = Number(fd.get("numeric_tolerance") || 0);
        if (Number.isNaN(q.correct_numeric)) { toast("پاسخ صحیح عددی رو وارد کن", true); return; }
    } else if (type === "fill_blank") {
        q.correct_text = fd.get("correct_text") || "";
        q.grading_mode = fd.get("grading_mode");
    } else if (type === "short_answer" || type === "long_answer") {
        q.correct_text = fd.get("correct_text") || "";
    } else if (type === "custom_html") {
        q.custom_html = fd.get("custom_html") || "";
        if (!q.custom_html.trim()) { toast("اول کد HTML رو وارد کن", true); return; }
    }

    if (!q.text && type !== "custom_html") { toast("اول متن سؤال رو بنویس", true); return; }

    __previewQuestion = q;
    renderQuestionPreview(q);
}

function renderQuestionPreview(q) {
    const label = practiceTypeLabelTeacher(q.type);
    openPreviewModal("پیش‌نمایش به چشم دانش‌آموز", `
        <div class="page-subtitle" style="margin-bottom:10px;background:var(--surface2);border-radius:8px;padding:8px 10px">
            این دقیقاً همون چیزیه که دانش‌آموز می‌بینه. هر پاسخی که اینجا بدی فقط برای خودته و جایی ذخیره نمی‌شه.
        </div>
        <div class="module" style="padding:14px">
            <div><b>${q.type === "custom_html" ? "(محتوای HTML زیر رو ببین)" : escapeHtml(q.text)}</b><div class="page-subtitle" style="margin-top:2px">${label}${q.chapter ? " · " + escapeHtml(q.chapter) : ""}</div></div>
            <div style="margin-top:10px">${previewQuestionInput(q)}</div>
            <div style="margin-top:10px">
                ${q.type === "custom_html"
                    ? `<button class="primary-btn" id="pvCheckBtn" disabled onclick="checkPreviewAnswer()">ثبت</button>`
                    : `<button class="primary-btn" onclick="checkPreviewAnswer()">بررسی پاسخ</button>`}
            </div>
            <div id="pvResult" style="margin-top:8px"></div>
        </div>
    `);

    if (q.type === "custom_html") {
        const iframe = document.getElementById("pvFrame");
        iframe.srcdoc = q.custom_html || "";
        const listener = (event) => {
            if (event.source !== iframe.contentWindow) return;
            if (!event.data || event.data.type !== "homeworkAnswer") return;
            document.getElementById("pvStatus").textContent = `نتیجه دریافت‌شده از کد: ${event.data.value}`;
            const btn = document.getElementById("pvCheckBtn");
            if (btn) btn.disabled = false;
            __previewQuestion.__htmlResult = event.data.value;
        };
        window.addEventListener("message", listener);
        window.__onPreviewModalClose = () => window.removeEventListener("message", listener);
    }
}

function practiceTypeLabelTeacher(t) {
    return { multiple_choice: "چندگزینه‌ای", true_false: "درست/غلط", numeric: "عددی", short_answer: "پاسخ کوتاه", long_answer: "تشریحی", fill_blank: "جای‌خالی", custom_html: "HTML تعاملی" }[t] || t;
}

function previewQuestionInput(q) {
    if (q.type === "multiple_choice") {
        return q.options.map((o, i) => `
            <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <input type="radio" name="pv_opt" value="${i}"> ${escapeHtml(o.text)}
            </label>
        `).join("");
    }
    if (q.type === "true_false") {
        return `
            <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="radio" name="pv_opt" value="true"> درست</label>
            <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="pv_opt" value="false"> غلط</label>
        `;
    }
    if (q.type === "numeric") return `<input class="form-input" id="pvNumeric" type="number" step="any">`;
    if (q.type === "fill_blank") return `<input class="form-input" id="pvText" type="text">`;
    if (q.type === "custom_html") {
        return `
            <iframe id="pvFrame" sandbox="allow-scripts" style="width:100%;min-height:360px;border:2px solid var(--line);border-radius:14px;background:#fff;display:block"></iframe>
            <div class="page-subtitle" id="pvStatus" style="margin-top:6px">هنوز نتیجه‌ای دریافت نشده — تمرین رو کامل کن.</div>
        `;
    }
    return `<textarea class="form-input" id="pvText" rows="3" style="height:auto;padding:10px 12px"></textarea>`;
}

// Local, client-side grading simulation -- mirrors the same logic the
// real /api/student/practice-submit endpoint applies server-side, just
// run against the answer-key values still sitting in the open form
// (nothing here is the real endpoint, so it never touches the DB).
function checkPreviewAnswer() {
    const q = __previewQuestion;
    if (!q) return;
    const box = document.getElementById("pvResult");
    let isCorrect = null; // null = no auto-grading exists for this type/mode
    let refLine = "";

    if (q.type === "multiple_choice") {
        const picked = document.querySelector('input[name="pv_opt"]:checked');
        if (!picked) { toast("یک گزینه رو انتخاب کن", true); return; }
        const opt = q.options[Number(picked.value)];
        isCorrect = opt.is_correct ? 1 : 0;
        const correctOpt = q.options.find(o => o.is_correct);
        if (correctOpt) refLine = `<div style="margin-top:6px">پاسخ درست: ${escapeHtml(correctOpt.text)}</div>`;
    } else if (q.type === "true_false") {
        const picked = document.querySelector('input[name="pv_opt"]:checked');
        if (!picked) { toast("یکی رو انتخاب کن", true); return; }
        isCorrect = (picked.value === "true") === !!q.correct_boolean ? 1 : 0;
        refLine = `<div style="margin-top:6px">پاسخ درست: ${q.correct_boolean ? "درست" : "غلط"}</div>`;
    } else if (q.type === "numeric") {
        const val = Number(document.getElementById("pvNumeric").value);
        isCorrect = Math.abs(val - q.correct_numeric) <= (q.numeric_tolerance || 0) ? 1 : 0;
        refLine = `<div style="margin-top:6px">پاسخ درست: ${q.correct_numeric}</div>`;
    } else if (q.type === "fill_blank") {
        const val = (document.getElementById("pvText").value || "").trim();
        if (q.grading_mode === "manual") {
            isCorrect = null;
        } else {
            const accepted = (q.correct_text || "").split(",").map(s => s.trim()).filter(Boolean);
            isCorrect = accepted.includes(val) ? 1 : 0;
        }
        if (q.correct_text) refLine = `<div style="margin-top:6px">پاسخ نمونه: ${escapeHtml(q.correct_text.split(",")[0].trim())}</div>`;
    } else if (q.type === "custom_html") {
        refLine = `<div style="margin-top:6px">نتیجه‌ی گزارش‌شده از کد: ${escapeHtml(String(q.__htmlResult ?? ""))}</div>`;
    }
    // short_answer / long_answer: no auto-grading exists at all -- isCorrect stays null

    const badge = isCorrect === 1 ? `<span class="status green">درست 🎉</span>`
        : isCorrect === 0 ? `<span class="status red">نادرست</span>`
        : `<span class="status orange">ثبت شد (تصحیح دستی)</span>`;

    box.innerHTML = `
        ${badge}
        ${refLine}
        ${q.explanation ? `<div style="margin-top:8px;font-size:13px;padding:8px;background:var(--bg-subtle,#f5f5f5);border-radius:8px">${escapeHtml(q.explanation)}</div>` : ""}
    `;
}

/* =========================================================
   FULL EXAM / ASSIGNMENT PREVIEW ("پیش‌نمایش آزمون/تکلیف") --
   same no-server-call, nothing-saved philosophy as the single-question
   preview above, but walking through an entire already-built آزمون یا
   تکلیف end-to-end the way a student actually would, with a
   simulated final score at the end for whatever's auto-gradable.
========================================================= */

// -- shared: interactive (match/drag_drop) sanitize + grade, ported from
// functions/api/_shared/interactive.js so the SAME logic the real
// server uses to grade a student is what scores this preview.
function previewShuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function previewSanitizeInteractive(type, payload) {
    if (type === "match") {
        return {
            left_items: payload.pairs.map(p => ({ id: p.left_id, text: p.left_text })),
            right_items: previewShuffle(payload.pairs.map(p => ({ id: p.right_id, text: p.right_text }))),
        };
    }
    if (type === "drag_drop") {
        return {
            buckets: payload.buckets,
            items: previewShuffle(payload.items.map(it => ({ id: it.item_id, text: it.text }))),
        };
    }
    return null;
}
function previewGradeInteractive(type, payload, maxScore, answer) {
    if (type === "match") {
        const correctByLeft = Object.fromEntries(payload.pairs.map(p => [p.left_id, p.right_id]));
        let correctCount = 0;
        for (const m of answer.matches) if (correctByLeft[m.left_id] && correctByLeft[m.left_id] === m.right_id) correctCount++;
        const total = payload.pairs.length;
        return { score: Math.round((correctCount / total) * maxScore * 100) / 100, maxScore, correctCount, total };
    }
    if (type === "drag_drop") {
        const correctByItem = Object.fromEntries(payload.items.map(it => [it.item_id, it.bucket_index]));
        let correctCount = 0;
        for (const p of answer.placements) if (correctByItem[p.item_id] !== undefined && correctByItem[p.item_id] === Number(p.bucket_index)) correctCount++;
        const total = payload.items.length;
        return { score: Math.round((correctCount / total) * maxScore * 100) / 100, maxScore, correctCount, total };
    }
    return null;
}

// -- shared: match/drag_drop builders for a SINGLE interactive instance
// (single-type assignment preview -- only one on the page at a time) --
function renderPreviewMatchBuilder(interactive) {
    return `
        <div class="page-subtitle" style="margin-bottom:10px">یک مورد از ستون راست را انتخاب کن، بعد جفتش را از ستون چپ بزن.</div>
        <div style="display:flex;gap:16px">

                ${interactive.left_items.map(li => `<button type="button" class="secondary-btn preview-match-left-btn" data-id="${li.id}">${escapeHtml(li.text)}</button>`).join("")}
            </div>
            <div style="flex:1;display:flex;flex-direction:column;gap:6px">
                ${interactive.right_items.map(ri => `<button type="button" class="secondary-btn preview-match-right-btn" data-id="${ri.id}">${escapeHtml(ri.text)}</button>`).join("")}
            </div>
        </div>`;
}
let __previewMatchSelections = {};
function initPreviewMatchBuilder() {
    __previewMatchSelections = {};
    let selectedRight = null;
    const rightBtns = document.querySelectorAll(".preview-match-right-btn");
    const leftBtns = document.querySelectorAll(".preview-match-left-btn");
    rightBtns.forEach(btn => btn.addEventListener("click", () => {
        rightBtns.forEach(b => b.style.outline = "");
        selectedRight = btn.dataset.id;
        btn.style.outline = "2px solid var(--primary)";
    }));
    leftBtns.forEach(btn => btn.addEventListener("click", () => {
        if (!selectedRight) { toast("اول یکی از ستون راست را انتخاب کن", true); return; }
        __previewMatchSelections[btn.dataset.id] = selectedRight;
        btn.style.background = "var(--primary-soft)";
        btn.textContent = btn.textContent.replace(/ ✓$/, "") + " ✓";
        rightBtns.forEach(b => b.style.outline = "");
        selectedRight = null;
    }));
}
function collectPreviewMatchAnswer(interactive) {
    const matches = Object.entries(__previewMatchSelections).map(([left_id, right_id]) => ({ left_id, right_id }));
    if (matches.length < interactive.left_items.length) return null;

}
function renderPreviewDragDropBuilder(interactive) {
    return `
        <div class="page-subtitle" style="margin-bottom:10px">برای هر آیتم، دسته‌ی درست را انتخاب کن.</div>

}
function collectPreviewDragDropAnswer(interactive) {

// -- shared: file/draw/audio widgets, parameterized by element id so both
// the single-type preview and the per-question multi-question preview can
// reuse the same code without colliding with each other's DOM ids --
function previewFileToDataUrl(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
function previewBlobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}
let __previewDrawCtx = {};
function initPreviewDrawCanvas(canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    __previewDrawCtx[canvasId] = ctx;
    ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "#172033";
    let drawing = false;
    const pos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
        const t = e.touches ? e.touches[0] : e;
        return { x: (t.clientX - rect.left) * scaleX, y: (t.clientY - rect.top) * scaleY };
    };
    const start = (e) => { e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const move = (e) => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    const end = () => { drawing = false; };
    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", start);
    canvas.addEventListener("touchmove", move);
    canvas.addEventListener("touchend", end);
}
function clearPreviewDrawCanvas(canvasId) {
    const canvas = document.getElementById(canvasId);
    __previewDrawCtx[canvasId].clearRect(0, 0, canvas.width, canvas.height);
}
let __previewRecorders = {};
async function togglePreviewRecording(key, btnId, previewBoxId) {
    const btn = document.getElementById(btnId);
    const existing = __previewRecorders[key];
    if (existing && existing.state === "recording") { existing.stop(); return; }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const chunks = [];
        const mediaRecorder = new MediaRecorder(stream);
        __previewRecorders[key] = mediaRecorder;
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, { type: "audio/webm" });
            const dataUrl = await previewBlobToDataUrl(blob);
            document.getElementById(previewBoxId).innerHTML = `<audio controls src="${dataUrl}" style="width:100%"></audio>`;
            stream.getTracks().forEach(t => t.stop());
            btn.textContent = "🎙️ ضبط دوباره";
        };
        mediaRecorder.start();
        btn.textContent = "⏹️ توقف ضبط";
        setTimeout(() => { if (mediaRecorder.state === "recording") mediaRecorder.stop(); }, 15000);
    } catch (e) {
        toast("دسترسی به میکروفون ممکن نشد", true);
    }
}

/* ---- exam preview: walk every question in the exam at once ---- */
let __examPreview = null;

async function previewExam(examId) {
    const attached = await api.get(`/api/teacher/exam-questions?exam_id=${examId}`);
    if (!attached.length) { toast("این آزمون هنوز سؤالی ندارد", true); return; }
    const full = await api.get(`/api/teacher/questions?ids=${attached.map(a => a.question_id).join(",")}`);
    const byId = new Map(full.map(q => [q.id, q]));
    const questions = [...attached].sort((a, b) => a.position - b.position)
        .map(a => byId.has(a.question_id) ? { ...byId.get(a.question_id), score: a.score } : null)
        .filter(Boolean);
    if (!questions.length) { toast("سؤالات این آزمون پیدا نشد", true); return; }

    __examPreview = { questions, results: {} };
    const cleanups = [];
    openPreviewModal("پیش‌نمایش آزمون به چشم دانش‌آموز", `
        <div class="page-subtitle" style="margin-bottom:10px;background:var(--surface2);border-radius:8px;padding:8px 10px">
            این دقیقاً همون چیزیه که دانش‌آموز موقع دادن آزمون می‌بینه. پاسخ‌هایی که این‌جا بدی جایی ذخیره نمی‌شن.
        </div>
        ${questions.map((q, i) => `
            <div class="card" style="margin-bottom:14px">
                <div class="page-subtitle" style="margin-bottom:8px">سؤال ${i + 1} از ${questions.length} — ${q.score} نمره</div>
                <div><b>${q.type === "custom_html" ? "(محتوای HTML زیر رو ببین)" : escapeHtml(q.text)}</b></div>
                <div style="margin-top:8px">${examPreviewQuestionInput(q, i)}</div>
                <div style="margin-top:8px">
                    ${q.type === "custom_html"
                        ? `<button class="secondary-btn" id="epCheckBtn_${i}" disabled onclick="checkExamPreviewAnswer(${i})">ثبت</button>`
                        : `<button class="secondary-btn" onclick="checkExamPreviewAnswer(${i})">بررسی پاسخ</button>`}
                </div>
                <div id="epResult_${i}" style="margin-top:6px"></div>
            </div>
        `).join("")}
        <div class="modal-footer">
            <button class="primary-btn" onclick="finishExamPreview()">پایان پیش‌نمایش — دیدن نمره‌ی کل</button>
        </div>
    `);

    questions.forEach((q, i) => {
        if (q.type !== "custom_html") return;
        const iframe = document.getElementById(`epFrame_${i}`);
        iframe.srcdoc = q.custom_html || "";
        const listener = (event) => {
            if (event.source !== iframe.contentWindow) return;
            if (!event.data || event.data.type !== "homeworkAnswer") return;
            document.getElementById(`epStatus_${i}`).textContent = `نتیجه دریافت‌شده از کد: ${event.data.value}`;
            const btn = document.getElementById(`epCheckBtn_${i}`);
            if (btn) btn.disabled = false;
            q.__htmlResult = event.data.value;
        };
        window.addEventListener("message", listener);
        cleanups.push(() => window.removeEventListener("message", listener));
    });
    window.__onPreviewModalClose = () => cleanups.forEach(fn => fn());
}

function examPreviewQuestionInput(q, i) {
    if (q.type === "multiple_choice") {
        return (q.options || []).map((o, oi) => `
            <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <input type="radio" name="ep_opt_${i}" value="${oi}"> ${escapeHtml(o.text)}
            </label>`).join("");
    }
    if (q.type === "true_false") {
        return `
            <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="radio" name="ep_opt_${i}" value="true"> درست</label>
            <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="ep_opt_${i}" value="false"> غلط</label>`;
    }
    if (q.type === "numeric") return `<input class="form-input" id="epNumeric_${i}" type="number" step="any">`;
    if (q.type === "fill_blank") return `<input class="form-input" id="epText_${i}" type="text">`;
    if (q.type === "custom_html") {
        return `
            <iframe id="epFrame_${i}" sandbox="allow-scripts" style="width:100%;min-height:320px;border:2px solid var(--line);border-radius:14px;background:#fff;display:block"></iframe>
            <div class="page-subtitle" id="epStatus_${i}" style="margin-top:6px">هنوز نتیجه‌ای دریافت نشده.</div>`;
    }
    return `<textarea class="form-input" id="epText_${i}" rows="2" style="height:auto;padding:10px 12px"></textarea>`;
}

function checkExamPreviewAnswer(i) {
    const q = __examPreview.questions[i];
    const box = document.getElementById(`epResult_${i}`);
    let isCorrect = null;
    let refLine = "";

    if (q.type === "multiple_choice") {
        const picked = document.querySelector(`input[name="ep_opt_${i}"]:checked`);
        if (!picked) { toast("یک گزینه رو انتخاب کن", true); return; }
        const opt = q.options[Number(picked.value)];
        isCorrect = opt.is_correct ? 1 : 0;
        const correctOpt = q.options.find(o => o.is_correct);
        if (correctOpt) refLine = `<div style="margin-top:4px">پاسخ درست: ${escapeHtml(correctOpt.text)}</div>`;
    } else if (q.type === "true_false") {
        const picked = document.querySelector(`input[name="ep_opt_${i}"]:checked`);
        if (!picked) { toast("یکی رو انتخاب کن", true); return; }
        isCorrect = (picked.value === "true") === !!q.correct_boolean ? 1 : 0;
        refLine = `<div style="margin-top:4px">پاسخ درست: ${q.correct_boolean ? "درست" : "غلط"}</div>`;
    } else if (q.type === "numeric") {
        const val = Number(document.getElementById(`epNumeric_${i}`).value);
        isCorrect = Math.abs(val - q.correct_numeric) <= (q.numeric_tolerance || 0) ? 1 : 0;
        refLine = `<div style="margin-top:4px">پاسخ درست: ${q.correct_numeric}</div>`;
    } else if (q.type === "fill_blank") {
        const val = (document.getElementById(`epText_${i}`).value || "").trim();
        if (q.grading_mode === "manual") { isCorrect = null; }
        else {
            const accepted = (q.correct_text || "").split(",").map(s => s.trim()).filter(Boolean);
            isCorrect = accepted.includes(val) ? 1 : 0;
        }
    } else if (q.type === "custom_html") {
        refLine = `<div style="margin-top:4px">نتیجه‌ی گزارش‌شده از کد: ${escapeHtml(String(q.__htmlResult ?? ""))}</div>`;
    }

    __examPreview.results[i] = isCorrect;
    const badge = isCorrect === 1 ? `<span class="status green">درست</span>` : isCorrect === 0 ? `<span class="status red">نادرست</span>` : `<span class="status orange">ثبت شد (دستی)</span>`;
    box.innerHTML = `${badge}${refLine}`;
}

function finishExamPreview() {
    const { questions, results } = __examPreview;
    let earned = 0, autoMax = 0, manualCount = 0;
    questions.forEach((q, i) => {
        const autoGraded = ["multiple_choice", "true_false", "numeric"].includes(q.type) || (q.type === "fill_blank" && q.grading_mode !== "manual");
        if (!autoGraded) { manualCount++; return; }
        autoMax += q.score;
        if (results[i] === 1) earned += q.score;
    });
    toast(`نمره‌ی خودکارِ شبیه‌سازی‌شده: ${earned} از ${autoMax}${manualCount ? ` (+ ${manualCount} سؤال با تصحیح دستی)` : ""}`);
}

function renderPreviewMqMatchBuilder(qid, interactive) {
