<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>پنل معلم | مدرسه</title>
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div class="app">

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileNav()"></div>
<aside class="sidebar" id="sidebar">
    <div class="logo">
        <div class="logo-icon">م</div>
        <div><strong>مدرسه</strong><span>School Platform</span></div>
    </div>

    <div class="role-box">
        <div class="role-label">محیط فعلی</div>
        <div class="role-name" id="roleName">معلم</div>
    </div>

    <nav class="nav" id="nav"></nav>

</aside>

<main class="main">
    <header class="topbar">
        <div class="top-left">
            <button class="mobile-menu" onclick="toggleMobileNav()">☰</button>
        </div>
        <div class="top-right">
            <div class="profile">
                <div class="avatar" id="avatar">م</div>
                <div>
                    <div class="profile-name" id="profileName">—</div>
                    <div class="profile-role" id="profileRole">—</div>
                </div>
            </div>
        </div>
    </header>

    <section class="content" id="content"></section>
</main>

</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modalBox">
        <div class="modal-head">
            <div class="modal-title" id="modalTitle">عنوان</div>
            <button class="close" onclick="closeModal()">×</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<script src="../assets/js/jalali.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/modal.js"></script>

<script>

/* =========================================================
   NAV CONFIG
   `available:false` = real product feature with no backend API yet.
   Shown-but-disabled so nothing is hidden.
========================================================= */

const NAV_ITEMS = [
    { key: "dashboard",   icon: "🏠", label: "داشبورد" },
    { key: "classes",     icon: "🏫", label: "کلاس‌ها" },
    { key: "assignments", icon: "📚", label: "تکالیف" },
    { key: "exams",       icon: "📝", label: "آزمون‌ها" },
    { key: "questions",   icon: "🗂️", label: "بانک سؤال" },
    { key: "grading",     icon: "✅", label: "تصحیح دستی" },
    { key: "attendance",  icon: "📋", label: "حضور و غیاب" },
    { key: "grades",      icon: "🎯", label: "نمرات" },
    { key: "messages",    icon: "💬", label: "پیام‌ها" },
    { key: "reports",     icon: "📊", label: "گزارش عملکرد", available: false, note: "API گزارش عملکرد هنوز ساخته نشده" },
    { key: "settings",    icon: "⚙️", label: "تنظیمات", available: false, note: "API تنظیمات هنوز ساخته نشده" },
    { key: "help",        icon: "❓", label: "راهنما" },
];

let cache = { classes: null, students: null, exams: null, questions: null, conversations: null, teachingAssignments: null, assignments: null };

function navigate(key) {
    setActiveNav(key);
    render(key);
}

async function render(key) {
    const content = document.getElementById("content");
    content.innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted)">در حال بارگذاری...</div>`;
    try {
        if (key === "dashboard") await renderDashboard();
        else if (key === "classes") await renderClasses();
        else if (key === "assignments") await renderAssignments();
        else if (key === "exams") await renderExams();
        else if (key === "questions") await renderQuestions();
        else if (key === "grading") await renderGrading();
        else if (key === "attendance") await renderAttendance();
        else if (key === "grades") await renderGrades();
        else if (key === "messages") await renderMessages();
        else if (key === "help") renderHelp();
    } catch (e) {
        content.innerHTML = `<div class="card"><div style="color:var(--red)">خطا در بارگذاری: ${escapeHtml(e.message)}</div></div>`;
    }
}

async function loadTeachingAssignments() {
    if (!cache.teachingAssignments) cache.teachingAssignments = await api.get("/api/teacher/classes");
    return cache.teachingAssignments;
}
function uniqueClasses(assignments) {
    const seen = new Map();
    for (const a of assignments) if (!seen.has(a.class_id)) seen.set(a.class_id, { id: a.class_id, name: a.class_name, grade: a.grade });
    return [...seen.values()];
}
async function loadClasses() {
    return uniqueClasses(await loadTeachingAssignments());
}
async function loadStudents() {
    if (!cache.students) cache.students = await api.get("/api/admin/students");
    return cache.students;
}

/* =========================================================
   DASHBOARD
========================================================= */

async function renderDashboard() {
    const exams = await api.get("/api/teacher/exams");
    cache.exams = exams;

    const published = exams.filter(e => e.status === "published").length;
    const drafts = exams.filter(e => e.status === "draft").length;
    const closed = exams.filter(e => e.status === "closed").length;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div>
                <div class="page-title">داشبورد معلم</div>
                <div class="page-subtitle">نمای کلی آزمون‌های شما</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">📝</div></div><div class="stat-value">${exams.length}</div><div class="stat-label">کل آزمون‌ها</div></div>
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">📤</div></div><div class="stat-value">${published}</div><div class="stat-label">منتشرشده</div></div>
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">✏️</div></div><div class="stat-value">${drafts}</div><div class="stat-label">پیش‌نویس</div></div>
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">🔒</div></div><div class="stat-value">${closed}</div><div class="stat-label">بسته‌شده</div></div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-title">آخرین آزمون‌ها</div>
                <button class="card-action" onclick="navigate('exams')">مشاهده همه</button>
            </div>
            ${exams.slice(0, 5).map(e => `
                <div class="activity">
                    <div class="activity-icon">📝</div>
                    <div>
                        <div class="activity-text"><b>${escapeHtml(e.title)}</b> — ${escapeHtml(e.class_name)} / ${escapeHtml(e.subject_name)}</div>
                        <div class="activity-time">${examStatusLabel(e.status)}</div>
                    </div>
                </div>
            `).join("") || `<div class="page-subtitle">آزمونی ثبت نشده</div>`}
        </div>
    `;
}

function examStatusLabel(s) {
    return { draft: "پیش‌نویس", published: "منتشرشده", closed: "بسته‌شده", archived: "بایگانی" }[s] || s;
}
function examStatusColor(s) {
    return { draft: "orange", published: "green", closed: "red", archived: "red" }[s] || "orange";
}

/* =========================================================
   CLASSES (real -- via teaching_assignments, only what this teacher teaches)
========================================================= */

async function renderClasses() {
    const assignments = await loadTeachingAssignments();
    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div>
                <div class="page-title">کلاس‌های من</div>
                <div class="page-subtitle">${assignments.length} تخصیص کلاس/درس</div>
            </div>
        </div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>کلاس</th><th>پایه</th><th>درس</th></tr></thead>
                <tbody>
                    ${assignments.map(a => `<tr><td>${escapeHtml(a.class_name)}</td><td>${escapeHtml(a.grade || "—")}</td><td>${escapeHtml(a.subject_name)}</td></tr>`).join("") || `<tr><td colspan="3" style="text-align:center;color:var(--muted)">هنوز به کلاس/درسی متصل نشده‌اید — از مدیر مدرسه بخواهید شما را تخصیص دهد</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

/* =========================================================
   ASSIGNMENTS
========================================================= */

const SUBMISSION_TYPE_LABELS = { text: "متنی", photo: "عکس", audio: "صوتی", draw: "نقاشی", match: "تطبیق (خودکار)", drag_drop: "دسته‌بندی (خودکار)" };

async function renderAssignments() {
    const assignments = await api.get("/api/teacher/assignments");
    cache.assignments = assignments;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div><div class="page-title">تکالیف</div><div class="page-subtitle">${assignments.length} تکلیف</div></div>
            <button class="primary-btn" onclick="openAssignmentForm()">+ تکلیف جدید</button>
        </div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>عنوان</th><th>کلاس / درس</th><th>نوع پاسخ</th><th>مهلت</th><th>پاسخ‌ها</th><th></th></tr></thead>
                <tbody>
                    ${assignments.map(a => `
                        <tr>
                            <td>${escapeHtml(a.title)}</td>
                            <td>${escapeHtml(a.class_name)} / ${escapeHtml(a.subject_name)}</td>
                            <td>${a.is_multi_question ? `چندسؤالی (${a.question_count} سؤال)` : (SUBMISSION_TYPE_LABELS[a.submission_type] || escapeHtml(a.submission_type))}</td>
                            <td>${formatJalaliDateTime(a.due_at)}</td>
                            <td>${a.submission_count}</td>
                            <td style="display:flex;gap:6px">
                                <button class="secondary-btn" onclick="${a.is_multi_question ? `openMultiSubmissionsList(${a.id}, ${escapeAttr(a.title)})` : `openSubmissionsList(${a.id}, ${escapeAttr(a.title)}, ${escapeAttr(a.submission_type)})`}">مشاهده پاسخ‌ها</button>
                                <button class="secondary-btn" onclick="deleteAssignment(${a.id})">حذف</button>
                            </td>
                        </tr>
                    `).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--muted)">تکلیفی ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

async function openAssignmentForm() {
    const assignments = await loadTeachingAssignments();
    if (assignments.length === 0) {
        toast("هنوز به هیچ کلاس/درسی متصل نیستید — از مدیر بخواهید شما را تخصیص دهد", true);
        return;
    }
    openModal("تکلیف جدید", `
        <form id="assignmentForm">
            <div class="form-group"><label>عنوان</label><input class="form-input" name="title" required></div>
            <div class="form-group"><label>کلاس / درس</label>
                <select class="form-input" name="combo" required>
                    ${assignments.map(a => `<option value="${a.class_id}:${a.subject_id}">${escapeHtml(a.class_name)} — ${escapeHtml(a.subject_name)}</option>`).join("")}
                </select>
            </div>
            <div class="form-group"><label>توضیحات (اختیاری)</label><textarea class="form-input" name="description" rows="2" style="height:auto;padding:10px 12px"></textarea></div>
            <div class="form-group"><label>نوع پاسخ دانش‌آموز</label>
                <select class="form-input" name="submission_type" id="submissionTypeSelect" onchange="onSubmissionTypeChange()">
                    <option value="text">متنی</option>
                    <option value="photo">عکس (مثلاً از دفتر مشق)</option>
                    <option value="audio">صوتی (مثلاً روخوانی)</option>
                    <option value="draw">نقاشی (کشیدن با انگشت/ماوس)</option>
                    <option value="match">تطبیق — خودکار تصحیح می‌شود</option>
                    <option value="drag_drop">دسته‌بندی — خودکار تصحیح می‌شود</option>
                </select>
            </div>
            <div id="interactiveBuilder"></div>
            <div class="form-group"><label>مهلت ارسال</label>${renderJalaliDatePicker("dueAt", { withTime: true, defaultTime: "23:59" })}</div>
            <div class="form-group" style="display:flex;align-items:center;gap:8px">
                <input type="checkbox" name="allow_late" id="allowLate" style="width:auto">
                <label for="allowLate" style="margin:0">ارسال با تأخیر مجاز باشد</label>
            </div>
            <div class="form-group"><label>حداکثر تعداد ارسال</label><input class="form-input" name="max_attempts" type="number" min="1" value="1"></div>
            <div class="form-group"><label>نمره کامل</label><input class="form-input" name="max_score" type="number" min="1" value="20"></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ثبت تکلیف</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);
    onSubmissionTypeChange();

    document.getElementById("assignmentForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        const [classId, subjectId] = body.combo.split(":");
        delete body.combo;
        body.class_id = classId; body.subject_id = subjectId;
        body.allow_late = fd.get("allow_late") ? true : false;
        const dueAtLocal = readJalaliDatePicker("dueAt", { withTime: true });
        if (!dueAtLocal) { toast("مهلت ارسال را کامل مشخص کنید", true); return; }
        body.due_at = new Date(dueAtLocal).toISOString();

        if (body.submission_type === "match" || body.submission_type === "drag_drop") {
            try {
                body.question_payload = collectInteractivePayload(body.submission_type);
            } catch (err) {
                toast(err.message, true);
                return;
            }
        }

        await withToast(() => api.post("/api/teacher/assignments", body), "تکلیف ثبت شد");
        closeModal();
        renderAssignments();
    });
}

// -- interactive assignment payload builder (match / drag_drop) --
// Renders inline inside the assignment form; only shown for those two types.
function onSubmissionTypeChange() {
    const type = document.getElementById("submissionTypeSelect").value;
    const box = document.getElementById("interactiveBuilder");
    if (type === "match") {
        box.innerHTML = `
            <div class="form-group">
                <label>جفت‌های تطبیق (حداقل ۲، حداکثر ۱۰)</label>
                <div id="matchPairs"></div>
                <button type="button" class="secondary-btn" onclick="addMatchPairRow()">+ افزودن جفت</button>
            </div>
        `;
        addMatchPairRow(); addMatchPairRow();
    } else if (type === "drag_drop") {
        box.innerHTML = `
            <div class="form-group">
                <label>نام دسته‌ها (با ویرگول جدا کنید)</label>
                <input class="form-input" id="bucketNames" placeholder="مثلاً: حیوانات، میوه‌ها">
            </div>
            <div class="form-group">
                <label>آیتم‌ها (هر کدام + دسته‌ی درست، حداقل ۲، حداکثر ۱۵)</label>
                <div id="dragItems"></div>
                <button type="button" class="secondary-btn" onclick="addDragItemRow()">+ افزودن آیتم</button>
            </div>
        `;
        addDragItemRow(); addDragItemRow();
    } else {
        box.innerHTML = "";
    }
}

function addMatchPairRow() {
    const container = document.getElementById("matchPairs");
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;margin-bottom:6px";
    row.innerHTML = `
        <input class="form-input match-left" placeholder="سمت چپ (مثلاً: سلام)">
        <input class="form-input match-right" placeholder="سمت راست (مثلاً: Hello)">
        <button type="button" class="secondary-btn" onclick="this.parentElement.remove()">حذف</button>
    `;
    container.appendChild(row);
}

function addDragItemRow() {
    const container = document.getElementById("dragItems");
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;margin-bottom:6px";
    row.innerHTML = `
        <input class="form-input drag-item-text" placeholder="متن آیتم (مثلاً: سیب)">
        <input class="form-input drag-item-bucket" type="number" min="0" placeholder="شماره دسته (۰ برای اولی)" style="max-width:150px">
        <button type="button" class="secondary-btn" onclick="this.parentElement.remove()">حذف</button>
    `;
    container.appendChild(row);
}

function collectInteractivePayload(type) {
    if (type === "match") {
        const pairs = [...document.querySelectorAll("#matchPairs > div")].map(row => ({
            left: row.querySelector(".match-left").value,
            right: row.querySelector(".match-right").value,
        })).filter(p => p.left.trim() && p.right.trim());
        if (pairs.length < 2) throw new Error("حداقل ۲ جفت کامل لازم است");
        return { pairs };
    }
    if (type === "drag_drop") {
        const buckets = document.getElementById("bucketNames").value.split("،").join(",").split(",").map(b => b.trim()).filter(Boolean);
        if (buckets.length < 2) throw new Error("حداقل ۲ دسته لازم است");
        const items = [...document.querySelectorAll("#dragItems > div")].map(row => ({
            text: row.querySelector(".drag-item-text").value,
            bucket_index: Number(row.querySelector(".drag-item-bucket").value),
        })).filter(it => it.text.trim());
        if (items.length < 2) throw new Error("حداقل ۲ آیتم لازم است");
        for (const it of items) {
            if (!Number.isInteger(it.bucket_index) || it.bucket_index < 0 || it.bucket_index >= buckets.length) {
                throw new Error(`شماره دسته برای «${it.text}» نامعتبر است (باید بین ۰ و ${buckets.length - 1} باشد)`);
            }
        }
        return { buckets, items };
    }
}

async function deleteAssignment(id) {
    if (!confirm("از حذف این تکلیف مطمئن هستید؟")) return;
    await withToast(() => api.del("/api/teacher/assignments", { id }), "تکلیف حذف شد");
    renderAssignments();
}

async function openSubmissionsList(assignmentId, title, submissionType) {
    const submissions = await api.get(`/api/teacher/submissions?assignment_id=${assignmentId}`);
    const isAutoGraded = submissionType === "match" || submissionType === "drag_drop";
    openModal(`پاسخ‌های: ${title}`, `
        <div style="max-height:420px;overflow:auto">
            ${submissions.map(s => `
                <div class="card" style="margin-bottom:10px">
                    <div class="card-head"><div class="card-title">${escapeHtml(s.student_name)}</div>
                        <span class="status ${s.status === "graded" ? "green" : s.status === "late" ? "orange" : "orange"}">${submissionStatusLabel(s.status)}</span>
                    </div>
                    ${s.body ? `<div style="font-size:12px;background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:8px">${escapeHtml(s.body)}</div>` : ""}
                    ${!isAutoGraded && s.answer_data ? renderAnswerPreview(s) : ""}
                    ${isAutoGraded
                        ? `<div class="page-subtitle">نمره‌ی خودکار: ${s.score ?? "—"}</div>`
                        : `<form onsubmit="return submitAssignmentGrade(event, ${s.id}, ${assignmentId}, ${escapeAttr(title)}, ${escapeAttr(submissionType)})">
                        <div class="form-group" style="display:flex;gap:8px">
                            <input class="form-input" name="score" type="number" min="0" placeholder="نمره" value="${s.score ?? ""}" required style="max-width:110px">
                            <input class="form-input" name="feedback" placeholder="بازخورد" value="${escapeHtml(s.feedback || "")}">
                            <button type="submit" class="secondary-btn">ثبت</button>
                        </div>
                    </form>`}
                </div>
            `).join("") || `<div class="page-subtitle">هنوز پاسخی ارسال نشده</div>`}
        </div>
        <div class="modal-footer"><button class="secondary-btn" onclick="closeModal()">بستن</button></div>
    `);
}

function submissionStatusLabel(s) { return { submitted: "ارسال‌شده", late: "با تأخیر", graded: "تصحیح‌شده" }[s] || s; }

function renderAnswerPreview(s) {
    // answer_data is a data: URI (image or audio) captured client-side -- see student panel
    if (s.answer_data.startsWith("data:image")) return `<img src="${s.answer_data}" style="max-width:200px;border-radius:8px;margin-bottom:8px">`;
    if (s.answer_data.startsWith("data:audio")) return `<audio controls src="${s.answer_data}" style="width:100%;margin-bottom:8px"></audio>`;
    return "";
}

async function submitAssignmentGrade(event, submissionId, assignmentId, title) {
    event.preventDefault();
    const fd = new FormData(event.target);
    await withToast(() => api.post("/api/teacher/submissions", {
        submission_id: submissionId, score: Number(fd.get("score")), feedback: fd.get("feedback") || null,
    }), "نمره ثبت شد");
    openSubmissionsList(assignmentId, title);
    return false;
}

/* -- multi-question assignments (imported from HTML with several questions) -- */

async function openMultiSubmissionsList(assignmentId, title) {
    const submissions = await api.get(`/api/teacher/submissions?assignment_id=${assignmentId}`);
    openModal(`پاسخ‌های: ${title}`, `
        <div style="max-height:420px;overflow:auto">
            ${submissions.map(s => `
                <div class="card" style="margin-bottom:10px">
                    <div class="card-head"><div class="card-title">${escapeHtml(s.student_name)}</div>
                        <span class="status ${s.status === "graded" ? "green" : "orange"}">${submissionStatusLabel(s.status)}${s.status === "graded" ? ` — ${s.score}` : ""}</span>
                    </div>
                    <button class="secondary-btn" onclick="openMultiSubmissionAnswers(${s.id}, ${escapeAttr(title)})">مشاهده / تصحیح سؤال‌ها</button>
                </div>
            `).join("") || `<div class="page-subtitle">هنوز پاسخی ارسال نشده</div>`}
        </div>
        <div class="modal-footer"><button class="secondary-btn" onclick="closeModal()">بستن</button></div>
    `);
}

async function openMultiSubmissionAnswers(submissionId, assignmentTitle) {
    const data = await api.get(`/api/teacher/submission-answers?submission_id=${submissionId}`);
    const { submission, answers } = data;

    openModal(`سؤال‌های: ${assignmentTitle}`, `
        <div style="max-height:460px;overflow:auto">
            ${answers.map((a, i) => `
                <div class="card" style="margin-bottom:12px">
                    <div class="page-subtitle" style="margin-bottom:6px">سؤال ${i + 1} — ${SUBMISSION_TYPE_LABELS[a.submission_type] || a.submission_type}</div>
                    <div id="tqFrame_${a.answer_id}" style="margin-bottom:8px"></div>
                    ${a.prompt_text ? `<div class="page-subtitle" style="margin-bottom:8px">${escapeHtml(a.prompt_text)}</div>` : ""}
                    ${renderAnswerPreview({ answer_data: a.answer_data || "" })}
                    ${!["match", "drag_drop"].includes(a.submission_type) && a.answer_data && !a.answer_data.startsWith("data:")
                        ? `<div style="font-size:12px;background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:8px">${escapeHtml(a.answer_data)}</div>`
                        : ""}
                    ${["match", "drag_drop"].includes(a.submission_type)
                        ? `<div class="page-subtitle">نمره‌ی خودکار: ${a.score ?? "—"} از ${a.max_score}</div>`
                        : `<form onsubmit="return submitMultiAnswerGrade(event, ${a.answer_id}, ${submissionId}, ${escapeAttr(assignmentTitle)})">
                            <div class="form-group" style="display:flex;gap:8px">
                                <input class="form-input" name="score" type="number" min="0" max="${a.max_score}" step="0.01" placeholder="نمره از ${a.max_score}" value="${a.score ?? ""}" required style="max-width:130px">
                                <input class="form-input" name="feedback" placeholder="بازخورد" value="${escapeHtml(a.feedback || "")}">
                                <button type="submit" class="secondary-btn">ثبت</button>
                            </div>
                        </form>`}
                </div>
            `).join("")}
        </div>
        <div class="page-subtitle" style="margin-top:6px">وضعیت کلی: ${submissionStatusLabel(submission.status)}${submission.status === "graded" ? ` — نمره‌ی نهایی: ${submission.score}` : " (تا تصحیح همه‌ی سؤال‌های دستی، نمره‌ی نهایی محاسبه نمی‌شود)"}</div>
        <div class="modal-footer"><button class="secondary-btn" onclick="closeModal()">بستن</button></div>
    `);

    answers.forEach(a => {
        if (a.prompt_html) mountPromptFrame(document.getElementById(`tqFrame_${a.answer_id}`), submission.assignment_prompt_style, a.prompt_html);
    });
}

async function submitMultiAnswerGrade(event, answerId, submissionId, assignmentTitle) {
    event.preventDefault();
    const fd = new FormData(event.target);
    await withToast(() => api.post("/api/teacher/submission-answers", {
        answer_id: answerId, score: Number(fd.get("score")), feedback: fd.get("feedback") || null,
    }), "نمره ثبت شد");
    openMultiSubmissionAnswers(submissionId, assignmentTitle);
    return false;
}

function previewImportHtml() {
    const fileInput = document.getElementById("importHtmlFile");
    const file = fileInput.files[0];
    if (!file) { toast("یک فایل HTML انتخاب کن", true); return; }

    const reader = new FileReader();
    reader.onload = () => {
        const box = document.getElementById("importHtmlPreview");
        box.innerHTML = `<div class="page-subtitle" style="margin:8px 0">این دقیقاً همون ظاهریه که دانش‌آموز برای هر سؤال می‌بینه:</div><div id="importHtmlPreviewFrame"></div>`;
        const iframe = document.createElement("iframe");
        iframe.setAttribute("sandbox", "");
        iframe.style.cssText = "width:100%;height:360px;border:1px solid var(--line);border-radius:10px;background:#fff;display:block";
        document.getElementById("importHtmlPreviewFrame").appendChild(iframe);
        iframe.srcdoc = reader.result; // raw uploaded file, exactly as-is -- teacher-only, fully sandboxed
    };
    reader.readAsText(file, "UTF-8");
}

function submitImportHtml() {
    const fileInput = document.getElementById("importHtmlFile");
    const file = fileInput.files[0];
    if (!file) { toast("یک فایل HTML انتخاب کن", true); return; }

    const reader = new FileReader();
    reader.onload = async () => {
        const class_id = document.getElementById("importHtmlClass").value;
        const resultBox = document.getElementById("importHtmlResult");
        resultBox.innerHTML = `<div class="page-subtitle">در حال بررسی و ثبت...</div>`;
        try {
            const body = { html: reader.result };
            if (class_id) body.class_id = Number(class_id);
            const res = await api.post("/api/teacher/import-html", body);
            let html = `<div class="page-subtitle" style="color:var(--green,#1a9e5c);margin-top:8px">${res.imported} مورد با موفقیت اضافه شد.</div>`;
            if (res.skipped && res.skipped.length) {
                html += `<div class="page-subtitle" style="margin-top:8px">موارد رد شده:</div>
                    <ul style="margin:6px 0 0;padding-inline-start:20px;font-size:13px;color:var(--muted)">
                        ${res.skipped.map(s => `<li>مورد شماره ${s.index + 1}: ${escapeHtml(s.reason)}</li>`).join("")}
                    </ul>`;
            }
            resultBox.innerHTML = html;
            cache.questions = null; cache.assignments = null;
        } catch (e) {
            resultBox.innerHTML = `<div class="page-subtitle" style="color:var(--red)">${escapeHtml(e.message)}</div>`;
        }
    };
    reader.readAsText(file, "UTF-8");
}

function openQuestionForm(existing) {
    const isEdit = !!existing;
    openModal(isEdit ? "ویرایش سؤال" : "سؤال جدید", `
        <form id="questionForm">
            <div class="form-group"><label>نوع سؤال</label>
                <select class="form-input" name="type" id="qType" onchange="onQuestionTypeChange()" ${isEdit ? "disabled" : ""}>
                    <option value="multiple_choice">چندگزینه‌ای (تصحیح خودکار)</option>
                    <option value="true_false">درست/غلط (تصحیح خودکار)</option>
                    <option value="numeric">عددی (تصحیح خودکار)</option>
                    <option value="short_answer">پاسخ کوتاه (نیازمند بررسی دستی)</option>
                    <option value="long_answer">تشریحی (تصحیح دستی)</option>
                </select>
                ${isEdit ? `<div class="page-subtitle">نوع سؤال بعد از ساخت قابل تغییر نیست.</div>` : ""}
            </div>
            <div class="form-group"><label>متن سؤال</label><textarea class="form-input" name="text" rows="2" style="height:auto;padding:10px 12px" required>${isEdit ? escapeHtml(existing.text) : ""}</textarea></div>
            <div class="form-group"><label>شناسه درس (اختیاری)</label><input class="form-input" name="subject_id" type="number" value="${isEdit && existing.subject_id ? existing.subject_id : ""}"></div>
            <div id="typeFields"></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">${isEdit ? "ذخیره تغییرات" : "ثبت سؤال"}</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);
    if (isEdit) document.getElementById("qType").value = existing.type;
    onQuestionTypeChange(existing);

    document.getElementById("questionForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const type = isEdit ? existing.type : fd.get("type");
        const body = { type, text: fd.get("text"), subject_id: fd.get("subject_id") || null };

        if (type === "true_false") body.correct_boolean = fd.get("correct_boolean") === "true";
        if (type === "numeric") { body.correct_numeric = Number(fd.get("correct_numeric")); body.numeric_tolerance = Number(fd.get("numeric_tolerance") || 0); }
        if (type === "short_answer" || type === "long_answer") body.correct_text = fd.get("correct_text") || null;
        if (type === "multiple_choice") {
            const texts = fd.getAll("opt_text");
            const correctIdx = Number(fd.get("correct_idx"));
            body.options = texts.map((t, i) => ({ text: t, is_correct: i === correctIdx }));
        }

        if (isEdit) {
            body.id = existing.id;
            await withToast(() => api.put("/api/teacher/questions", body), "سؤال بروزرسانی شد");
        } else {
            await withToast(() => api.post("/api/teacher/questions", body), "سؤال ساخته شد");
        }
        closeModal();
        renderQuestions();
    });
}

function onQuestionTypeChange(existing) {
    const type = document.getElementById("qType").value;
    const box = document.getElementById("typeFields");
    if (type === "multiple_choice") {
        const opts = existing?.options || [];
        box.innerHTML = [0, 1, 2, 3].map(i => {
            const opt = opts[i];
            const checked = opt ? !!opt.is_correct : i === 0;
            return `
            <div class="form-group" style="display:flex;gap:8px;align-items:center">
                <input type="radio" name="correct_idx" value="${i}" ${checked ? "checked" : ""}>
                <input class="form-input" name="opt_text" placeholder="گزینه ${i + 1}" value="${opt ? escapeHtml(opt.text) : ""}" ${i < 2 ? "required" : ""}>
            </div>
        `; }).join("") + `<div class="page-subtitle">گزینه‌ی درست را با دکمه‌ی رادیویی مشخص کن. حداقل ۲ گزینه لازم است.</div>`;
    } else if (type === "true_false") {
        const val = existing ? !!existing.correct_boolean : true;
        box.innerHTML = `<div class="form-group"><label>پاسخ صحیح</label>
            <select class="form-input" name="correct_boolean"><option value="true" ${val ? "selected" : ""}>درست</option><option value="false" ${!val ? "selected" : ""}>غلط</option></select></div>`;
    } else if (type === "numeric") {
        box.innerHTML = `
            <div class="form-group"><label>پاسخ صحیح</label><input class="form-input" name="correct_numeric" type="number" step="any" value="${existing ? existing.correct_numeric ?? "" : ""}" required></div>
            <div class="form-group"><label>بازه‌ی مجاز خطا (اختیاری)</label><input class="form-input" name="numeric_tolerance" type="number" step="any" value="${existing ? existing.numeric_tolerance ?? 0 : 0}"></div>
        `;
    } else {
        box.innerHTML = `<div class="form-group"><label>متن مرجع برای تصحیح دستی (اختیاری)</label><textarea class="form-input" name="correct_text" rows="2" style="height:auto;padding:10px 12px">${existing ? escapeHtml(existing.correct_text || "") : ""}</textarea></div>`;
    }
}

async function loadGradingQueue(examId) {
    const box = document.getElementById("gradingQueue");
    if (!examId) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="page-subtitle">در حال بارگذاری...</div>`;

    const [pending, students] = await Promise.all([
        api.get(`/api/teacher/grading?exam_id=${examId}`),
        loadStudents(),
    ]);
    const nameOf = (id) => escapeHtml(students.find(s => s.id === id)?.full_name || `دانش‌آموز #${id}`);

    box.innerHTML = pending.length === 0
        ? `<div class="card"><div class="page-subtitle">پاسخ بی‌نمره‌ای باقی نمانده</div></div>`
        : pending.map(a => `
            <div class="card" style="margin-bottom:12px">
                <div class="card-head"><div class="card-title">${nameOf(a.student_id)}</div></div>
                <div class="page-subtitle" style="margin-bottom:6px">${escapeHtml(a.question_text)}</div>
                <div style="background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px">${escapeHtml(a.text_answer || "(پاسخی ثبت نشده)")}</div>
                <form onsubmit="return submitGrade(event, ${a.answer_id}, ${examId})">
                    <div class="form-group" style="display:flex;gap:10px">
                        <input class="form-input" name="score" type="number" min="0" placeholder="نمره" required style="max-width:120px">
                        <input class="form-input" name="feedback" placeholder="بازخورد (اختیاری)">
                    </div>
                    <button type="submit" class="primary-btn">ثبت نمره</button>
                </form>
            </div>
        `).join("");
}

async function submitGrade(event, answerId, examId) {
    event.preventDefault();
    const fd = new FormData(event.target);
    await withToast(() => api.post("/api/teacher/grading", {
        answer_id: answerId, score: Number(fd.get("score")), feedback: fd.get("feedback") || null,
    }), "نمره ثبت شد");
    loadGradingQueue(examId);
    return false;
}

/* =========================================================
   ATTENDANCE
========================================================= */

async function renderAttendance() {
    const classes = await loadClasses();
    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">حضور و غیاب</div><div class="page-subtitle">انتخاب کلاس</div></div></div>
        <div class="form-group" style="max-width:320px"><label>کلاس</label>
            <select class="form-input" id="attClassSelect" onchange="loadAttendanceSessions(this.value)">
                <option value="">— انتخاب کنید —</option>
                ${classes.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}
            </select>
        </div>
        <div id="attendanceBox"></div>
    `;
}

async function loadAttendanceSessions(classId) {
    const box = document.getElementById("attendanceBox");
    if (!classId) { box.innerHTML = ""; return; }
    const sessions = await api.get(`/api/teacher/attendance?class_id=${classId}`);
    box.innerHTML = `
        <div class="page-head" style="margin-top:20px">
            <div class="page-subtitle">${sessions.length} جلسه ثبت‌شده</div>
            <button class="primary-btn" onclick="createAttendanceSession(${classId})">+ جلسه امروز</button>
        </div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>تاریخ</th><th></th></tr></thead>
                <tbody>
                    ${sessions.map(s => `<tr><td>${formatJalaliDate(s.session_date)}</td><td><button class="secondary-btn" onclick="openAttendanceSession(${s.id})">ثبت/ویرایش</button></td></tr>`).join("") || `<tr><td colspan="2" style="text-align:center;color:var(--muted)">جلسه‌ای ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

async function createAttendanceSession(classId) {
    const today = new Date().toISOString().slice(0, 10);
    const result = await withToast(() => api.post("/api/teacher/attendance", { action: "create_session", class_id: classId, session_date: today }), "جلسه ساخته شد");
    loadAttendanceSessions(classId);
    if (result?.session_id) openAttendanceSession(result.session_id);
}

async function openAttendanceSession(sessionId) {
    const { session, records } = await api.get(`/api/teacher/attendance?session_id=${sessionId}`);
    const STATUS_LABELS = { present: "حاضر", absent: "غایب", late: "تأخیر", excused: "موجه" };

    openModal(`حضور و غیاب — ${formatJalaliDate(session.session_date)}`, `
        <form id="attendanceForm">
            ${records.map(r => `
                <div class="form-group" style="display:flex;justify-content:space-between;align-items:center">
                    <span>${escapeHtml(r.full_name)}</span>
                    <select class="form-input" name="status_${r.student_id}" style="width:140px">
                        ${Object.entries(STATUS_LABELS).map(([v, l]) => `<option value="${v}" ${r.status === v ? "selected" : ""}>${l}</option>`).join("")}
                    </select>
                </div>
            `).join("")}
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ذخیره</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">بستن</button>
            </div>
        </form>
    `);

    document.getElementById("attendanceForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const recordsPayload = records.map(r => ({ student_id: r.student_id, status: fd.get(`status_${r.student_id}`) }));
        await withToast(() => api.post("/api/teacher/attendance", { action: "mark", session_id: sessionId, records: recordsPayload }), "حضور و غیاب ذخیره شد");
        closeModal();
    });
}

/* =========================================================
   GRADES
========================================================= */

async function renderGrades() {
    const assignments = await loadTeachingAssignments();
    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">نمرات</div><div class="page-subtitle">انتخاب کلاس و درس</div></div></div>
        <div style="display:flex;gap:12px;margin-bottom:16px;align-items:flex-end">
            <div class="form-group" style="max-width:280px;margin-bottom:0"><label>کلاس / درس</label>
                <select class="form-input" id="gradesComboSelect">
                    ${assignments.map(a => `<option value="${a.class_id}:${a.subject_id}">${escapeHtml(a.class_name)} — ${escapeHtml(a.subject_name)}</option>`).join("")}
                </select>
            </div>
            <button class="primary-btn" onclick="loadGrades()">نمایش</button>
        </div>
        <div id="gradesBox"></div>
        ${assignments.length === 0 ? `<div class="page-subtitle">هنوز به هیچ کلاس/درسی متصل نیستید — از مدیر بخواهید شما را تخصیص دهد</div>` : ""}
    `;
    if (assignments.length) loadGrades();
}

async function loadGrades() {
    const [classId, subjectId] = document.getElementById("gradesComboSelect").value.split(":");

    const grades = await api.get(`/api/teacher/grades?class_id=${classId}&subject_id=${subjectId}`);
    document.getElementById("gradesBox").innerHTML = `
        <div class="page-head"><div class="page-subtitle">${grades.length} نمره ثبت‌شده</div>
            <button class="primary-btn" onclick="openGradeForm(${classId}, ${subjectId})">+ ثبت نمره</button>
        </div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>دانش‌آموز</th><th>نمره</th><th>منبع</th></tr></thead>
                <tbody>
                    ${grades.map(g => `<tr><td>${escapeHtml(g.student_name)}</td><td>${g.score} / ${g.max_score}</td><td>${escapeHtml(g.source)}</td></tr>`).join("") || `<tr><td colspan="3" style="text-align:center;color:var(--muted)">نمره‌ای ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

async function openGradeForm(classId, subjectId) {
    const students = await api.get(`/api/admin/students?class_id=${classId}`);
    openModal("ثبت نمره جدید", `
        <form id="gradeForm">
            <div class="form-group"><label>دانش‌آموز</label>
                <select class="form-input" name="student_id" required>${students.map(s => `<option value="${s.id}">${escapeHtml(s.full_name)}</option>`).join("") || ""}</select>
                ${students.length === 0 ? `<div class="page-subtitle" style="margin-top:4px">دانش‌آموزی در این کلاس ثبت‌نام نشده</div>` : ""}
            </div>
            <div class="form-group"><label>نمره</label><input class="form-input" name="score" type="number" step="any" required></div>
            <div class="form-group"><label>از (max_score)</label><input class="form-input" name="max_score" type="number" step="any" value="20" required></div>
            <div class="form-group"><label>منبع</label>
                <select class="form-input" name="source"><option value="manual">دستی</option><option value="assignment">تکلیف</option><option value="exam">آزمون</option><option value="final">نهایی</option></select>
            </div>
            <div class="form-group"><label>بازخورد (اختیاری)</label><input class="form-input" name="feedback"></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ثبت</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);

    document.getElementById("gradeForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        body.class_id = classId; body.subject_id = subjectId;
        await withToast(() => api.post("/api/teacher/grades", body), "نمره ثبت شد");
        closeModal();
        loadGrades();
    });
}

/* =========================================================
   MESSAGES (same pattern as admin panel)
========================================================= */

async function renderMessages() {
    const conversations = await api.get("/api/messages/conversations");
    cache.conversations = conversations;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div><div class="page-title">پیام‌ها</div><div class="page-subtitle">${conversations.length} گفتگو</div></div>
            <button class="primary-btn" onclick="openNewConversationForm()">+ گفتگوی جدید</button>
        </div>
        <div class="module"><div class="module-body">
            ${conversations.map(c => `
                <div class="activity" style="cursor:pointer" onclick="openConversation(${c.id}, ${escapeAttr(c.title || "گفتگو")})">
                    <div class="activity-icon">💬</div>
                    <div>
                        <div class="activity-text"><b>${escapeHtml(c.title || (c.type === "direct" ? "گفتگوی مستقیم" : "گروه"))}</b></div>
                        <div class="activity-time">${escapeHtml(c.last_message || "پیامی ارسال نشده")}</div>
                    </div>
                </div>
            `).join("") || `<div class="page-subtitle">گفتگویی وجود ندارد</div>`}
        </div></div>
    `;
}

async function openNewConversationForm() {
    const students = await loadStudents();
    openModal("گفتگوی جدید با یک دانش‌آموز", `
        <form id="newConvForm">
            <div class="form-group"><label>دانش‌آموز</label>
                <select class="form-input" name="student_user_id" required>${students.map(s => `<option value="${s.user_id}">${escapeHtml(s.full_name)}</option>`).join("")}</select>
            </div>
            <div class="form-group"><label>پیام اول</label><textarea class="form-input" name="body" rows="3" style="height:auto;padding:10px 12px" required></textarea></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">شروع گفتگو</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
        <div class="page-subtitle" style="margin-top:10px">فعلاً فقط می‌توانید با دانش‌آموزان گفتگو شروع کنید.</div>
    `);

    document.getElementById("newConvForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const studentUserId = fd.get("student_user_id");
        const firstMessage = fd.get("body");
        await withToast(async () => {
            const conv = await api.post("/api/messages/conversations", { type: "direct", member_user_ids: [Number(studentUserId)] });
            await api.post("/api/messages/messages", { conversation_id: conv.id, body: firstMessage });
        }, "گفتگو ساخته شد");
        closeModal();
        renderMessages();
    });
}

async function openConversation(id, title) {
    const messages = await api.get(`/api/messages/messages?conversation_id=${id}`);
    openModal(title, `
        <div style="max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
            ${messages.map(m => `<div style="background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:12px"><b>${escapeHtml(m.sender_name || "کاربر")}</b><div style="margin-top:4px">${escapeHtml(m.body)}</div></div>`).join("") || `<div class="page-subtitle">پیامی وجود ندارد</div>`}
        </div>
        <form id="replyForm">
            <div class="form-group"><input class="form-input" name="body" placeholder="پیام..." required></div>
            <div class="modal-footer"><button type="submit" class="primary-btn">ارسال</button><button type="button" class="secondary-btn" onclick="closeModal()">بستن</button></div>
        </form>
    `);

    document.getElementById("replyForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        await withToast(() => api.post("/api/messages/messages", { conversation_id: id, body: fd.get("body") }));
        openConversation(id, title);
    });
}
