let __mqPreviewMatchState = {};
function initPreviewMqMatchBuilder(qid) {
    __mqPreviewMatchState[qid] = { selectedRight: null, selections: {} };
    const state = __mqPreviewMatchState[qid];
    const rightBtns = document.querySelectorAll(`.mqp-match-right-btn[data-qid="${qid}"]`);
    const leftBtns = document.querySelectorAll(`.mqp-match-left-btn[data-qid="${qid}"]`);
    rightBtns.forEach(btn => btn.addEventListener("click", () => {
        rightBtns.forEach(b => b.style.outline = "");
        state.selectedRight = btn.dataset.id;
        btn.style.outline = "2px solid var(--primary)";
    }));
    leftBtns.forEach(btn => btn.addEventListener("click", () => {
        if (!state.selectedRight) { toast("اول یکی از ستون راست را انتخاب کن", true); return; }
        state.selections[btn.dataset.id] = state.selectedRight;
        btn.style.background = "var(--primary-soft)";
        btn.textContent = btn.textContent.replace(/ ✓$/, "") + " ✓";
        rightBtns.forEach(b => b.style.outline = "");
        state.selectedRight = null;
    }));
}
function collectPreviewMqMatchAnswer(qid, interactive) {
    const state = __mqPreviewMatchState[qid];
    if (!state) return null;
    const matches = Object.entries(state.selections).map(([left_id, right_id]) => ({ left_id, right_id }));
    if (matches.length < interactive.left_items.length) return null;
    return { matches };
}
function renderPreviewMqDragDropBuilder(qid, interactive) {
    return `
        <div class="page-subtitle" style="margin-bottom:10px">برای هر آیتم، دسته‌ی درست را انتخاب کن.</div>
        <div style="display:flex;flex-direction:column;gap:8px">
            ${interactive.items.map(it => `
                <div style="display:flex;align-items:center;gap:10px">
                    <div style="flex:1">${escapeHtml(it.text)}</div>
                    <select class="form-input mqp-dd-bucket-select" data-qid="${qid}" data-item-id="${it.id}" style="max-width:160px">
                        <option value="">— انتخاب کن —</option>
                        ${interactive.buckets.map((b, i) => `<option value="${i}">${escapeHtml(b)}</option>`).join("")}
                    </select>
                </div>
            `).join("")}
        </div>`;
}
function collectPreviewMqDragDropAnswer(qid) {
    const selects = document.querySelectorAll(`.mqp-dd-bucket-select[data-qid="${qid}"]`);
    const placements = [];
    for (const sel of selects) {
        if (sel.value === "") return null;
        placements.push({ item_id: sel.dataset.itemId, bucket_index: Number(sel.value) });
    }
    return { placements };
}
function checkMqpAnswer(qid) {
    const info = __mqPreview.interactives[qid];
    if (!info) return;
    const answer = info.type === "match" ? collectPreviewMqMatchAnswer(qid, info.interactive) : collectPreviewMqDragDropAnswer(qid);
    if (!answer) { toast(info.type === "match" ? "لطفاً همه‌ی موارد را تطبیق بده" : "لطفاً برای همه‌ی آیتم‌ها یک دسته انتخاب کن", true); return; }
    const result = previewGradeInteractive(info.type, info.payload, 1, answer);
    __mqPreview.answers[qid] = result;
    document.getElementById(`mqpResult_${qid}`).innerHTML = `<span class="status ${result.correctCount === result.total ? "green" : "orange"}">${result.correctCount} از ${result.total} درست</span>`;
}
function finishMqpPreview() {
    const ids = Object.keys(__mqPreview.interactives).map(Number);
    if (!ids.length) { toast("این تکلیف سؤال خودکارتصحیح‌شونده‌ای ندارد — بقیه‌ی سؤال‌ها دستی تصحیح می‌شوند", true); return; }
    let totalRatio = 0, checkedCount = 0;
    ids.forEach(qid => {
        const r = __mqPreview.answers[qid];
        if (r) { totalRatio += r.correctCount / r.total; checkedCount++; }
    });
    if (!checkedCount) { toast("حداقل یکی از سؤال‌های خودکار رو بررسی کن", true); return; }
    // simplified aggregate: an unweighted average across the auto-graded sub-
    // questions that were actually checked -- the real server-side score also
    // factors in each question's `weight` and the manually-graded ones, which
    // this preview intentionally doesn't try to simulate.
    toast(`میانگین درصد سؤال‌های خودکارِ بررسی‌شده: ${Math.round((totalRatio / checkedCount) * 100)}٪`);
}

function onQuestionTypeChange(existing) {
    const type = document.getElementById("qType").value;
    const box = document.getElementById("typeFields");
    document.getElementById("qTextLabel").textContent = type === "custom_html" ? "عنوان کوتاه (فقط برای نمایش در لیست بانک سؤال)" : "متن سؤال";
    if (type === "multiple_choice") {
        const opts = existing?.options || [];
        box.innerHTML = [0, 1, 2, 3].map(i => {
            const opt = opts[i];
            const checked = opt ? !!opt.is_correct : i === 0;
            return `
            <div class="form-group" style="display:flex;gap:8px;align-items:center">
                <input type="radio" name="correct_idx" value="${i}" ${checked ? "checked" : ""}>
                <input class="form-input" name="opt_text" placeholder="گزینه ${i + 1}" value="${opt ? escapeHtml(opt.text) : ""}" ${i < 2 ? "required" : ""}>
            </div>
        `; }).join("") + `<div class="page-subtitle">گزینه‌ی درست را با دکمه‌ی رادیویی مشخص کن. حداقل ۲ گزینه لازم است.</div>`;
    } else if (type === "true_false") {
        const val = existing ? !!existing.correct_boolean : true;
        box.innerHTML = `<div class="form-group"><label>پاسخ صحیح</label>
            <select class="form-input" name="correct_boolean"><option value="true" ${val ? "selected" : ""}>درست</option><option value="false" ${!val ? "selected" : ""}>غلط</option></select></div>`;
    } else if (type === "numeric") {
        box.innerHTML = `
            <div class="form-group"><label>پاسخ صحیح</label><input class="form-input" name="correct_numeric" type="number" step="any" value="${existing ? existing.correct_numeric ?? "" : ""}" required></div>
            <div class="form-group"><label>بازه‌ی مجاز خطا (اختیاری)</label><input class="form-input" name="numeric_tolerance" type="number" step="any" value="${existing ? existing.numeric_tolerance ?? 0 : 0}"></div>
        `;
    } else if (type === "fill_blank") {
        const gm = existing ? (existing.grading_mode || "auto") : "auto";
        box.innerHTML = `
            <div class="form-group"><label>پاسخ‌های قابل‌قبول (اگه چند جواب درسته، با کاما جدا کن)</label>
                <input class="form-input" name="correct_text" placeholder="مثال: تهران, تهرون" value="${existing ? escapeHtml(existing.correct_text || "") : ""}" ${gm === "auto" ? "required" : ""}></div>
            <div class="form-group"><label>نحوه‌ی تصحیح</label>
                <select class="form-input" name="grading_mode" onchange="onFillBlankModeChange(this)">
                    <option value="auto" ${gm === "auto" ? "selected" : ""}>خودکار (مقایسه با پاسخ‌های بالا)</option>
                    <option value="manual" ${gm === "manual" ? "selected" : ""}>دستی (خودم بعداً نمره می‌دم)</option>
                </select>
            </div>
            <div class="page-subtitle">تصحیح خودکار فقط تطبیق دقیق متن رو چک می‌کنه (بدون فهم معنا) — برای جواب‌های کوتاه و مشخص مثل اسم/عدد/تاریخ مناسبه، نه سؤال‌های چندجوابیِ باز.</div>
        `;
    } else if (type === "custom_html") {
        box.innerHTML = `
            <div class="form-group"><label>محتوای HTML (کد کامل، معمولاً از هوش مصنوعی گرفته می‌شه)</label>
                <textarea class="form-input" name="custom_html" rows="8" style="height:auto;padding:10px 12px;font-family:monospace;font-size:12px" required placeholder="<html>...</html>">${existing ? escapeHtml(existing.custom_html || "") : ""}</textarea>
            </div>
            <div class="page-subtitle" style="background:var(--surface2);border-radius:8px;padding:10px 12px">
                ⚠️ این نوع سؤال کد HTML/جاوااسکریپت دلخواه رو واقعاً اجرا می‌کنه (داخل یک محیط ایزوله که به بقیه‌ی سایت دسترسی نداره). چون این کد سمت مرورگر دانش‌آموز اجرا می‌شه، تصحیحش <b>همیشه دستی</b>ه — نمی‌شه به نمره‌ای که خودِ کد گزارش می‌ده به‌طور کامل اعتماد کرد.<br>
                برای این‌که نتیجه به سیستم برسه، فایل باید در پایان کارش این خط رو اجرا کنه:<br>
                <code style="font-size:11px">window.parent.postMessage({type:'homeworkAnswer', value: نمره_یا_نتیجه}, '*')</code>
            </div>
        `;
    } else {
        box.innerHTML = `<div class="form-group"><label>متن مرجع برای تصحیح دستی (اختیاری)</label><textarea class="form-input" name="correct_text" rows="2" style="height:auto;padding:10px 12px">${existing ? escapeHtml(existing.correct_text || "") : ""}</textarea></div>`;
    }
}

async function loadGradingQueue(examId) {
    const box = document.getElementById("gradingQueue");
    if (!examId) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="page-subtitle">در حال بارگذاری...</div>`;

    const [pending, students] = await Promise.all([
        api.get(`/api/teacher/grading?exam_id=${examId}`),
        loadStudents(),
    ]);
    const nameOf = (id) => escapeHtml(students.find(s => s.id === id)?.full_name || `دانش‌آموز #${id}`);

    box.innerHTML = pending.length === 0
        ? `<div class="card"><div class="page-subtitle">پاسخ بی‌نمره‌ای باقی نمانده</div></div>`
        : pending.map(a => `
            <div class="card" style="margin-bottom:12px">
                <div class="card-head"><div class="card-title">${nameOf(a.student_id)}</div></div>
                <div class="page-subtitle" style="margin-bottom:6px">${escapeHtml(a.question_text)}</div>
                <div style="background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px">${escapeHtml(a.text_answer || "(پاسخی ثبت نشده)")}</div>
                <form onsubmit="return submitGrade(event, ${a.answer_id}, ${examId})">
                    <div class="form-group" style="display:flex;gap:10px">
                        <input class="form-input" name="score" type="number" min="0" placeholder="نمره" required style="max-width:120px">
                        <input class="form-input" name="feedback" placeholder="بازخورد (اختیاری)">
                    </div>
                    <button type="submit" class="primary-btn">ثبت نمره</button>
                </form>
            </div>
        `).join("");
}

async function submitGrade(event, answerId, examId) {
    event.preventDefault();
    const fd = new FormData(event.target);
    await withToast(() => api.post("/api/teacher/grading", {
        answer_id: answerId, score: Number(fd.get("score")), feedback: fd.get("feedback") || null,
    }), "نمره ثبت شد");
    loadGradingQueue(examId);
    return false;
}

                <button type="submit" class="primary-btn">ذخیره</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">بستن</button>
            </div>
        </form>
    `);

    document.getElementById("attendanceForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const recordsPayload = records.map(r => ({ student_id: r.student_id, status: fd.get(`status_${r.student_id}`) }));
        await withToast(() => api.post("/api/teacher/attendance", { action: "mark", session_id: sessionId, records: recordsPayload }), "حضور و غیاب ذخیره شد");

        </form>
    `);

    document.getElementById("replyForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        await withToast(() => api.post("/api/messages/messages", { conversation_id: id, body: fd.get("body") }));
        openConversation(id, title);
    });
}
