<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خدمات والد | مدرسه</title><link rel="stylesheet" href="../assets/css/core.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/responsive.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{padding:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><div class="app"><aside class="sidebar"><div class="logo"><div class="logo-icon">م</div><div><strong>مدرسه</strong><span>خدمات والدین</span></div></div><nav class="nav"><button onclick="location.href='/parent/index.html'"><span class="nav-icon">←</span>بازگشت</button></nav><div class="role-box"><div class="role-label">محیط فعلی</div><div class="role-name" id="roleName">والد</div></div></aside><main class="main"><header class="topbar"><div></div><div class="profile"><div class="avatar" id="avatar">و</div><div><div class="profile-name" id="profileName">—</div><div class="profile-role">والد</div></div></div></header><section class="content"><h1>خدمات والدین</h1><p class="page-subtitle">درخواست‌ها، جلسات، شهریه، برنامه امتحان و انضباط.</p><div class="grid"><div class="card"><h3>📨 درخواست جدید</h3><form id="req"><select class="form-input" name="student_id" id="student"></select><select class="form-input" name="type" style="margin-top:8px"><option value="leave">مرخصی</option><option value="certificate">گواهی</option><option value="transfer">انتقال</option><option value="profile_change">اصلاح اطلاعات</option><option value="meeting">ملاقات</option><option value="report_card">کارنامه</option><option value="other">سایر</option></select><input class="form-input" name="title" placeholder="عنوان" required style="margin-top:8px"><textarea class="form-input" name="body" placeholder="توضیحات" style="margin-top:8px"></textarea><button class="primary-btn" style="margin-top:8px">ارسال درخواست</button></form></div><div class="card"><h3>🤝 درخواست جلسه</h3><form id="meeting"><select class="form-input" name="student_id" id="mstudent"></select><select class="form-input" name="teacher_id" id="teacher" required style="margin-top:8px"></select><input class="form-input" name="scheduled_at" type="datetime-local" required style="margin-top:8px"><input class="form-input" name="topic" placeholder="موضوع جلسه" style="margin-top:8px"><button class="primary-btn" style="margin-top:8px">درخواست جلسه</button></form></div><div class="card"><h3>💰 شهریه</h3><div id="finance"></div></div><div class="card"><h3>📝 برنامه امتحان</h3><div id="exams"></div></div><div class="card"><h3>⚖️ انضباط</h3><div id="discipline"></div></div><div class="card full"><h3>📨 درخواست‌های من</h3><div id="requests"></div></div><div class="card full"><h3>👤 حساب کاربری من</h3><div id="accountPanel"></div></div></div></section></main></div><script src="../assets/js/api.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/account-panel.js"></script><script>initShell('parent');mountAccountPanel('accountPanel');const esc=escapeHtml;async function load(){const children=await api.get('/api/parent/children');const [req,meet,fin,ex,disc,teachers]=await Promise.all([api.get('/api/parent/requests'),api.get('/api/parent/meetings'),api.get('/api/parent/finance'),api.get('/api/parent/exam-schedule'),(async()=>{let a=[];for(const x of children){a=a.concat(await api.get('/api/parent/discipline?student_id='+x.student_id).catch(()=>[]))}return a})(),api.get('/api/parent/teachers')]);for(const id of ['student','mstudent'])document.getElementById(id).innerHTML=children.map(c=>`<option value="${c.student_id}">${esc(c.full_name)}</option>`).join('');document.getElementById('teacher').innerHTML=teachers.map(t=>`<option value="${t.id}">${esc(t.full_name)}</option>`).join('');document.getElementById('finance').innerHTML=fin.map(x=>`<div style="padding:7px;border-bottom:1px solid var(--line)">${esc(x.student_name)} — ${esc(x.fee_name)} — ${Number(x.amount-x.discount).toLocaleString('fa-IR')} — پرداخت ${Number(x.paid).toLocaleString('fa-IR')}</div>`).join('')||'<span class="mini">موردی نیست</span>';document.getElementById('exams').innerHTML=ex.map(x=>`<div style="padding:7px;border-bottom:1px solid var(--line)">${esc(x.student_name)} — ${esc(x.subject_name)} — ${esc(x.scheduled_date)} ${esc(x.start_time)} — ${esc(x.room||'')}</div>`).join('')||'<span class="mini">برنامه‌ای نیست</span>';document.getElementById('discipline').innerHTML=disc.map(x=>`<div style="padding:7px;border-bottom:1px solid var(--line)">${esc(x.title)} — ${esc(x.type)} — ${esc(x.occurred_at)}</div>`).join('')||'<span class="mini">سابقه‌ای نیست</span>';document.getElementById('requests').innerHTML=req.map(x=>`<div style="padding:9px;border-bottom:1px solid var(--line)">${esc(x.title)} — ${esc(x.status)} — ${esc(x.created_at)}</div>`).join('')||'<span class="mini">درخواستی نیست</span>';$('req').onsubmit=async e=>{e.preventDefault();await api.post('/api/parent/requests',Object.fromEntries(new FormData(e.target)));toast('درخواست ارسال شد');load()};$('meeting').onsubmit=async e=>{e.preventDefault();await api.post('/api/parent/meetings',Object.fromEntries(new FormData(e.target)));toast('جلسه درخواست شد');load()}}const $=id=>document.getElementById(id);load().catch(e=>toast(e.message,true));</script></body></html>
