<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>پنل والد | مدرسه</title>
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div class="app">

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileNav()"></div>
<aside class="sidebar" id="sidebar">
    <div class="logo">
        <div class="logo-icon">م</div>
        <div><strong>مدرسه</strong><span>School Platform</span></div>
    </div>

    <div class="role-box">
        <div class="role-label">محیط فعلی</div>
        <div class="role-name" id="roleName">والد</div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-bottom">
        <button class="nav button" onclick="logout()">🚪 خروج</button>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <div class="top-left">
            <button class="mobile-menu" onclick="toggleMobileNav()">☰</button>
        </div>
        <div class="top-right">
            <div class="profile">
                <div class="avatar" id="avatar">و</div>
                <div>
                    <div class="profile-name" id="profileName">—</div>
                    <div class="profile-role" id="profileRole">—</div>
                </div>
            </div>
        </div>
    </header>

    <section class="content" id="content"></section>
</main>

</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modalBox">
        <div class="modal-head">
            <div class="modal-title" id="modalTitle">عنوان</div>
            <button class="close" onclick="closeModal()">×</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<script src="../assets/js/jalali.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/modal.js"></script>

<script>

/* =========================================================
   NAV CONFIG
========================================================= */

const NAV_ITEMS = [
    { key: "dashboard",   icon: "🏠", label: "خانه" },
    { key: "children",    icon: "👨‍👩‍👧", label: "فرزندان" },
    { key: "grades",      icon: "🎯", label: "وضعیت تحصیلی" },
    { key: "assignments", icon: "📚", label: "تکالیف" },
    { key: "exams",       icon: "📝", label: "آزمون‌ها" },
    { key: "attendance",  icon: "📋", label: "حضور و غیاب" },
    { key: "schedule",    icon: "🗓️", label: "برنامه هفتگی" },
    { key: "messages",    icon: "💬", label: "پیام مدرسه" },
    { key: "announcements", icon: "📢", label: "اطلاعیه‌ها" },
    { key: "settings",    icon: "⚙️", label: "تنظیمات", available: false, note: "API تنظیمات هنوز ساخته نشده" },
];

let cache = { children: null };
let selectedChild = null; // student_id

function navigate(key) {
    setActiveNav(key);
    render(key);
}

async function loadChildren() {
    if (!cache.children) cache.children = await api.get("/api/parent/children");
    if (!selectedChild && cache.children.length) selectedChild = cache.children[0].student_id;
    return cache.children;
}

function childSelectorHtml(children) {
    if (children.length <= 1) return "";
    return `
        <div class="form-group" style="max-width:260px">
            <label>فرزند</label>
            <select class="form-input" onchange="selectedChild = Number(this.value); render(currentPageKey())">
                ${children.map(c => `<option value="${c.student_id}" ${c.student_id === selectedChild ? "selected" : ""}>${escapeHtml(c.full_name)} (${educationLevelLabel(c.education_level)})</option>`).join("")}
            </select>
        </div>
    `;
}

function educationLevelLabel(l) { return l === "elementary" ? "ابتدایی" : "دبیرستان"; }

let __currentKey = "dashboard";
function currentPageKey() { return __currentKey; }

async function render(key) {
    __currentKey = key;
    const content = document.getElementById("content");
    content.innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted)">در حال بارگذاری...</div>`;
    try {
        const children = await loadChildren();
        if (children.length === 0 && key !== "dashboard" && key !== "messages" && key !== "announcements") {
            content.innerHTML = `<div class="card"><div class="page-subtitle">هنوز فرزندی به حساب شما متصل نشده است.</div></div>`;
            return;
        }
        if (key === "dashboard") await renderDashboard();
        else if (key === "children") await renderChildren();
        else if (key === "grades") await renderGrades();
        else if (key === "assignments") await renderAssignments();
        else if (key === "exams") await renderExams();
        else if (key === "attendance") await renderAttendance();
        else if (key === "schedule") await renderSchedule();
        else if (key === "messages") await renderMessages();
        else if (key === "announcements") await renderAnnouncements();
    } catch (e) {
        content.innerHTML = `<div class="card"><div style="color:var(--red)">خطا در بارگذاری: ${escapeHtml(e.message)}</div></div>`;
    }
}

/* =========================================================
   DASHBOARD
========================================================= */

async function renderDashboard() {
    const [summary, children] = await Promise.all([
        api.get("/api/parent/dashboard"),
        loadChildren(),
    ]);

    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">خانه</div><div class="page-subtitle">نمای کلی وضعیت فرزندان شما</div></div></div>

        <div class="stats">
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">👨‍👩‍👧</div></div><div class="stat-value">${summary.children_count}</div><div class="stat-label">تعداد فرزندان</div></div>
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">📚</div></div><div class="stat-value">${summary.active_assignments ?? 0}</div><div class="stat-label">تکالیف فعال</div></div>
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">📝</div></div><div class="stat-value">${summary.upcoming_exams ?? 0}</div><div class="stat-label">آزمون‌های پیش رو</div></div>
            <div class="stat-card"><div class="stat-top"><div class="stat-icon">⚠️</div></div><div class="stat-value">${summary.recent_absences_14d ?? 0}</div><div class="stat-label">غیبت (۱۴ روز اخیر)</div></div>
        </div>

        <div class="card">
            <div class="card-head"><div class="card-title">فرزندان</div><button class="card-action" onclick="navigate('children')">مشاهده همه</button></div>
            ${children.map(c => `
                <div class="activity">
                    <div class="activity-icon">🎓</div>
                    <div><div class="activity-text"><b>${escapeHtml(c.full_name)}</b></div><div class="activity-time">${escapeHtml(c.class_name || "بدون کلاس")}</div></div>
                </div>
            `).join("") || `<div class="page-subtitle">فرزندی ثبت نشده</div>`}
        </div>
    `;
}

/* =========================================================
   CHILDREN
========================================================= */

async function renderChildren() {
    const children = await loadChildren();
    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">فرزندان</div><div class="page-subtitle">${children.length} فرزند</div></div></div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>نام</th><th>کلاس</th><th>سطح تحصیلی</th></tr></thead>
                <tbody>${children.map(c => `<tr><td>${escapeHtml(c.full_name)}</td><td>${escapeHtml(c.class_name || "—")}</td><td>${educationLevelLabel(c.education_level)}</td></tr>`).join("") || `<tr><td colspan="3" style="text-align:center;color:var(--muted)">فرزندی ثبت نشده</td></tr>`}</tbody>
            </table>
        </div></div>
    `;
}

/* =========================================================
   GRADES (report card)
========================================================= */

async function renderGrades() {
    const children = await loadChildren();
    const report = await api.get(`/api/parent/grades?student_id=${selectedChild}`);

    window.__lastReportCard = report; // used by printReportCard()
    window.__lastReportChildName = (children.find(c => c.student_id === selectedChild) || {}).full_name || "";

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div><div class="page-title">وضعیت تحصیلی</div><div class="page-subtitle">${escapeHtml(report.period ? report.period.name || "دوره‌ی جاری" : "بدون دوره‌ی نمره‌دهی ثبت‌شده")}</div></div>
            <button class="secondary-btn" onclick="printReportCard()">🖨️ چاپ / خروجی PDF</button>
        </div>
        ${childSelectorHtml(children)}
        <div class="stats" style="grid-template-columns:repeat(1,1fr);max-width:260px">
            <div class="stat-card"><div class="stat-value">${report.overall_average ?? "—"}</div><div class="stat-label">میانگین کل</div></div>
        </div>
        ${report.subjects.map(s => `
            <div class="card" style="margin-bottom:14px">
                <div class="card-head"><div class="card-title">${escapeHtml(s.subject_name)}</div><span class="status green">میانگین: ${s.average ?? "—"}</span></div>
                <div class="table-wrap"><table>
                    <thead><tr><th>منبع</th><th>نمره</th><th>بازخورد</th></tr></thead>
                    <tbody>${s.entries.map(e => `<tr><td>${escapeHtml(e.source)}</td><td>${e.score} / ${e.max_score}</td><td>${escapeHtml(e.feedback || "—")}</td></tr>`).join("")}</tbody>
                </table></div>
            </div>
        `).join("") || `<div class="card"><div class="page-subtitle">نمره‌ای ثبت نشده</div></div>`}
    `;
}

// Print-to-PDF via the browser's own print dialog -- same approach as the
// student dashboard, since a JS PDF lib often doesn't shape Persian/RTL text correctly.
function printReportCard() {
    const report = window.__lastReportCard;
    if (!report) return;
    const childName = window.__lastReportChildName || "";
    const win = window.open("", "_blank");
    win.document.write(`
        <html dir="rtl" lang="fa"><head><meta charset="utf-8">
        <title>کارنامه${childName ? " — " + escapeHtml(childName) : ""}</title>
        <style>
            body { font-family: Tahoma, Vazirmatn, sans-serif; padding: 30px; }
            h1 { font-size: 20px; margin-bottom: 4px; }
            h2 { font-size: 13px; color: #555; font-weight: normal; margin-top: 0; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
            th, td { border: 1px solid #ccc; padding: 6px 10px; font-size: 13px; text-align: right; }
            th { background: #f2f2f2; }
            .avg { font-size: 15px; font-weight: bold; margin: 14px 0; }
        </style></head><body>
        <h1>کارنامه${childName ? " — " + escapeHtml(childName) : ""}</h1>
        <h2>${escapeHtml(report.period ? report.period.name || "دوره‌ی جاری" : "بدون دوره‌ی نمره‌دهی")}</h2>
        <div class="avg">میانگین کل: ${report.overall_average ?? "—"}</div>
        ${report.subjects.map(s => `
            <h3>${escapeHtml(s.subject_name)} — میانگین: ${s.average ?? "—"}</h3>
            <table>
                <thead><tr><th>منبع</th><th>نمره</th><th>بازخورد</th></tr></thead>
                <tbody>${s.entries.map(e => `<tr><td>${escapeHtml(e.source)}</td><td>${e.score} / ${e.max_score}</td><td>${escapeHtml(e.feedback || "—")}</td></tr>`).join("")}</tbody>
            </table>
        `).join("")}
        </body></html>
    `);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);
}

/* =========================================================
   ASSIGNMENTS
========================================================= */

async function renderAssignments() {
    const children = await loadChildren();
    const assignments = await api.get(`/api/parent/assignments?student_id=${selectedChild}`);

    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">تکالیف</div><div class="page-subtitle">${assignments.length} تکلیف</div></div></div>
        ${childSelectorHtml(children)}
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>عنوان</th><th>درس</th><th>مهلت</th><th>وضعیت</th><th>نمره</th></tr></thead>
                <tbody>
                    ${assignments.map(a => `
                        <tr>
                            <td>${escapeHtml(a.title)}</td><td>${escapeHtml(a.subject_name)}</td><td>${a.due_at ? formatJalaliDateTime(a.due_at) : "—"}</td>
                            <td>${assignmentStatusLabel(a.submission_status)}</td>
                            <td>${a.score ?? "—"}</td>
                        </tr>
                    `).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--muted)">تکلیفی ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
        <div class="page-subtitle" style="margin-top:10px">سیستم تکالیف هنوز به‌طور کامل فعال نشده — این فهرست وقتی معلمان تکلیف ثبت کنند پر می‌شود.</div>
    `;
}
function assignmentStatusLabel(s) {
    return { submitted: "ارسال‌شده", late: "با تأخیر", graded: "نمره‌داده‌شده" }[s] || "ارسال‌نشده";
}

/* =========================================================
   EXAMS
========================================================= */

async function renderExams() {
    const children = await loadChildren();
    const exams = await api.get(`/api/parent/exams?student_id=${selectedChild}`);

    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">آزمون‌ها</div><div class="page-subtitle">${exams.length} آزمون</div></div></div>
        ${childSelectorHtml(children)}
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>عنوان</th><th>درس</th><th>تاریخ</th><th>نتیجه</th></tr></thead>
                <tbody>
                    ${exams.map(e => `
                        <tr>
                            <td>${escapeHtml(e.title)}</td><td>${escapeHtml(e.subject_name)}</td><td>${formatJalaliDate(e.start_at)}</td>
                            <td>${e.attempt_status ? `${e.total_score ?? "در انتظار تصحیح"} ${e.max_score ? "/ " + e.max_score : ""}` : "شرکت نکرده"}</td>
                        </tr>
                    `).join("") || `<tr><td colspan="4" style="text-align:center;color:var(--muted)">آزمونی ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

/* =========================================================
   ATTENDANCE
========================================================= */

async function renderAttendance() {
    const children = await loadChildren();
    const { records, summary } = await api.get(`/api/parent/attendance?student_id=${selectedChild}`);
    const STATUS_LABELS = { present: "حاضر", absent: "غایب", late: "تأخیر", excused: "موجه" };
    const STATUS_COLORS = { present: "green", absent: "red", late: "orange", excused: "orange" };

    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">حضور و غیاب</div><div class="page-subtitle">سابقه‌ی فرزند</div></div></div>
        ${childSelectorHtml(children)}
        <div class="stats">
            <div class="stat-card"><div class="stat-value">${summary.present || 0}</div><div class="stat-label">حاضر</div></div>
            <div class="stat-card"><div class="stat-value">${summary.absent || 0}</div><div class="stat-label">غایب</div></div>
            <div class="stat-card"><div class="stat-value">${summary.late || 0}</div><div class="stat-label">تأخیر</div></div>
            <div class="stat-card"><div class="stat-value">${summary.excused || 0}</div><div class="stat-label">موجه</div></div>
        </div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>تاریخ</th><th>وضعیت</th></tr></thead>
                <tbody>${records.map(r => `<tr><td>${formatJalaliDate(r.session_date)}</td><td><span class="status ${STATUS_COLORS[r.status]}">${STATUS_LABELS[r.status]}</span></td></tr>`).join("") || `<tr><td colspan="2" style="text-align:center;color:var(--muted)">رکوردی ثبت نشده</td></tr>`}</tbody>
            </table>
        </div></div>
    `;
}

/* =========================================================
   SCHEDULE
========================================================= */

async function renderSchedule() {
    const children = await loadChildren();
    const schedule = await api.get(`/api/parent/schedule?student_id=${selectedChild}`);
    const DAYS = { "0": "شنبه", "1": "یکشنبه", "2": "دوشنبه", "3": "سه‌شنبه", "4": "چهارشنبه", "5": "پنجشنبه", "6": "جمعه" };

    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">برنامه هفتگی</div><div class="page-subtitle">برنامه کلاس فرزند</div></div></div>
        ${childSelectorHtml(children)}
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>روز</th><th>ساعت</th><th>درس</th><th>معلم</th></tr></thead>
                <tbody>
                    ${schedule.map(s => `<tr><td>${DAYS[s.day_of_week] ?? s.day_of_week}</td><td>${s.start_time} - ${s.end_time}</td><td>${escapeHtml(s.subject_name)}</td><td>${escapeHtml(s.teacher_name)}</td></tr>`).join("") || `<tr><td colspan="4" style="text-align:center;color:var(--muted)">برنامه‌ای ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

/* =========================================================
   MESSAGES (reply-only, same reasoning as the student panel:
   parents have no permission to look up other users)
========================================================= */

async function renderMessages() {
    const conversations = await api.get("/api/messages/conversations");
    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">پیام مدرسه</div><div class="page-subtitle">${conversations.length} گفتگو</div></div></div>
        <div class="module"><div class="module-body">
            ${conversations.map(c => `
                <div class="activity" style="cursor:pointer" onclick="openConversation(${c.id}, ${escapeAttr(c.title || "گفتگو")})">
                    <div class="activity-icon">💬</div>
                    <div><div class="activity-text"><b>${escapeHtml(c.title || "گفتگو")}</b></div><div class="activity-time">${escapeHtml(c.last_message || "پیامی ارسال نشده")}</div></div>
                </div>
            `).join("") || `<div class="page-subtitle">گفتگویی وجود ندارد — معلم یا مدیر باید ابتدا گفتگو را شروع کند</div>`}
        </div></div>
    `;
}

async function openConversation(id, title) {
    const messages = await api.get(`/api/messages/messages?conversation_id=${id}`);
    openModal(title, `
        <div style="max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
            ${messages.map(m => `<div style="background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:12px"><b>${escapeHtml(m.sender_name || "کاربر")}</b><div style="margin-top:4px">${escapeHtml(m.body)}</div></div>`).join("") || `<div class="page-subtitle">پیامی وجود ندارد</div>`}
        </div>
        <form id="replyForm">
            <div class="form-group"><input class="form-input" name="body" placeholder="پیام..." required></div>
            <div class="modal-footer"><button type="submit" class="primary-btn">ارسال</button><button type="button" class="secondary-btn" onclick="closeModal()">بستن</button></div>
        </form>
    `);
    document.getElementById("replyForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        await withToast(() => api.post("/api/messages/messages", { conversation_id: id, body: fd.get("body") }));
        openConversation(id, title);
    });
}

/* =========================================================
   ANNOUNCEMENTS
========================================================= */

async function renderAnnouncements() {
    const announcements = await api.get("/api/announcements");
    document.getElementById("content").innerHTML = `
        <div class="page-head"><div><div class="page-title">اطلاعیه‌ها</div><div class="page-subtitle">${announcements.length} اطلاعیه</div></div></div>
        ${announcements.map(a => `
            <div class="card" style="margin-bottom:14px">
                <div class="card-head"><div class="card-title">${escapeHtml(a.title)}</div></div>
                <div class="page-subtitle" style="margin-bottom:8px">${escapeHtml(a.author_name)} — ${formatJalaliDate(a.created_at)}</div>
                <div style="font-size:13px;line-height:1.9">${escapeHtml(a.body)}</div>
            </div>
        `).join("") || `<div class="card"><div class="page-subtitle">اطلاعیه‌ای ثبت نشده</div></div>`}
    `;
}

/* =========================================================
   INIT
========================================================= */

(function () {
    const session = initShell("parent");
    if (!session) return;
    renderNav(NAV_ITEMS, "dashboard");
    render("dashboard");
})();

</script>
</body>
</html>
