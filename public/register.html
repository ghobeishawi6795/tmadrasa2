<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ثبت مدرسه جدید | مدرسه</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
    --bg:#f5f7fb;
    --surface:#fff;
    --surface2:#f8fafc;
    --text:#172033;
    --muted:#7b8497;
    --line:#e8ecf3;
    --primary:#5b5ce2;
    --primary-soft:#eeefff;
    --red:#ef5350;
    --red-soft:#ffeded;
    --green:#20b486;
    --green-soft:#e9faf4;
    --shadow:0 8px 30px rgba(28,35,60,.06);
    --radius:18px;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
    font-family:Vazirmatn,Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 30px;
    width:100%;
    max-width:420px;
}

.logo{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
.logo-icon{ width:42px; height:42px; border-radius:12px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; }
.logo strong{ display:block; font-size:16px; }
.logo span{ display:block; font-size:12px; color:var(--muted); }

h1{ font-size:20px; margin-bottom:6px; }
.subtitle{ color:var(--muted); font-size:13px; margin-bottom:24px; line-height:1.8; }

label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; margin-top:16px; }

input{
    width:100%; padding:11px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-size:14px; font-family:inherit; background:var(--surface2); color:var(--text); outline:none;
    transition:border-color .15s;
}
input:focus{ border-color:var(--primary); }

button{ font-family:inherit; cursor:pointer; }

.submit-btn{
    width:100%; margin-top:24px; padding:12px; border:none; border-radius:12px;
    background:var(--primary); color:#fff; font-size:15px; font-weight:600;
}
.submit-btn:disabled{ opacity:.6; cursor:default; }

.error-box{ display:none; margin-top:16px; padding:11px 14px; background:var(--red-soft); color:var(--red); border-radius:10px; font-size:13px; line-height:1.7; }
.success-box{ display:none; margin-top:16px; padding:14px; background:var(--green-soft); color:var(--green); border-radius:10px; font-size:13px; line-height:2; }
.success-box b{ font-size:15px; }
.success-box a{ color:var(--primary); font-weight:700; }

.hint{ margin-top:18px; font-size:12px; color:var(--muted); line-height:1.8; }
</style>
</head>
<body>

<div class="card">
    <div class="logo">
        <div class="logo-icon">م</div>
        <div><strong>مدرسه</strong><span>School Platform</span></div>
    </div>

    <h1>ثبت مدرسه جدید</h1>
    <div class="subtitle">این صفحه فقط یک‌بار برای ساخت اولین مدرسه و حساب مدیر استفاده می‌شود. بعد از استفاده بهتر است این فایل را از روی گیت‌هاب حذف کنی.</div>

    <form id="registerForm">
        <label for="schoolName">نام مدرسه</label>
        <input type="text" id="schoolName" required autocomplete="off">

        <label for="adminFullName">نام و نام خانوادگی مدیر</label>
        <input type="text" id="adminFullName" required autocomplete="off">

        <label for="username">نام کاربری مدیر</label>
        <input type="text" id="username" required autocomplete="off">

        <label for="password">رمز عبور (حداقل ۸ کاراکتر)</label>
        <input type="password" id="password" minlength="8" required autocomplete="new-password">

        <button type="submit" class="submit-btn" id="submitBtn">ساخت مدرسه</button>

        <div class="error-box" id="errorBox"></div>
        <div class="success-box" id="successBox"></div>
    </form>

    <div class="hint">بعد از ساخت، با همین نام کاربری و رمز عبور و «شناسه مدرسه»ای که نمایش داده می‌شود وارد <a href="/login.html">صفحه ورود</a> شو.</div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");
    errorBox.style.display = "none";
    successBox.style.display = "none";
    btn.disabled = true;
    btn.textContent = "در حال ساخت...";

    try {
        const res = await fetch("/api/auth/register-school", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                school_name: document.getElementById("schoolName").value,
                admin_full_name: document.getElementById("adminFullName").value,
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
            }),
        });
        const json = await res.json();
        if (!res.ok || json.success === false) {
            throw new Error(json?.error?.message || "خطایی رخ داد");
        }
        const escapedSchoolId = String(json.data.school_id).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        successBox.innerHTML = `مدرسه با موفقیت ساخته شد 🎉<br>شناسه مدرسه: <b>${escapedSchoolId}</b><br>این شناسه را جایی یادداشت کن، برای ورود لازمش داری.<br><a href="/login.html">رفتن به صفحه ورود ←</a>`;
        successBox.style.display = "block";
        document.getElementById("registerForm").reset();
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
    } finally {
        btn.disabled = false;
        btn.textContent = "ساخت مدرسه";
    }
});
</script>
</body>
</html>
