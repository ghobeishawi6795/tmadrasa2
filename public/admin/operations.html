<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت مدرسه | مدرسه</title><link rel="stylesheet" href="../assets/css/core.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/responsive.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{padding:20px}.card h3{margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.table-wrap{overflow:auto;max-height:420px}.mini{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:var(--primary-soft);font-size:12px}</style></head><body><div class="app"><aside class="sidebar"><div class="logo"><div class="logo-icon">م</div><div><strong>مدرسه</strong><span>مدیریت مدرسه</span></div></div><nav class="nav"><button onclick="location.href='/admin/index.html'"><span class="nav-icon">←</span>بازگشت به پنل</button></nav><div class="role-box"><div class="role-label">محیط فعلی</div><div class="role-name" id="roleName">مدیر</div></div></aside><main class="main"><header class="topbar"><div></div><div class="profile"><div class="avatar" id="avatar">م</div><div><div class="profile-name" id="name">مدیر</div><div class="profile-role">مدیریت عملیات مدرسه</div></div></div></header><section class="content"><h1>عملیات و امکانات مدرسه</h1><p class="page-subtitle">سال تحصیلی، پرونده، انضباط، امتحانات، درخواست‌ها، جلسات، مالی، کتابخانه و امنیت.</p><div id="app" class="grid"></div></section></main></div><script src="../assets/js/api.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/account-panel.js"></script><script>
initShell('admin');
const $=id=>document.getElementById(id), esc=escapeHtml;
async function load(){
 const calls=[['years','/api/admin/academic-years'],['students','/api/admin/students'],['exams','/api/admin/exams'],['req','/api/admin/parent-requests'],['meet','/api/admin/meetings'],['finance','/api/admin/finance'],['lib','/api/admin/library'],['feeItems','/api/admin/finance?fee_items=1'],['periods','/api/admin/grade-periods']];
 const settled=await Promise.allSettled(calls.map(c=>api.get(c[1])));
 const failed=settled.map((s,i)=>({name:calls[i][0],url:calls[i][1],s})).filter(x=>x.s.status==='rejected');
 if(failed.length){
   $('app').innerHTML=`<div class="card full"><h3>خطا در بارگذاری</h3>`+failed.map(f=>`<p class="mini">❌ ${f.name} (${f.url}): ${esc(f.s.reason&&f.s.reason.message||String(f.s.reason))}</p>`).join('')+`</div>`;
   return;
 }
 const [years,students,exams,req,meet,finance,lib,feeItems,periods]=settled.map(s=>s.value);
 $('app').innerHTML=`
 <div class="card"><h3>📅 سال‌های تحصیلی</h3><form id="yearForm"><div class="row"><input class="form-input" name="name" placeholder="۱۴۰۵-۱۴۰۶" required><input class="form-input" name="start_date" type="date" required></div><div class="row" style="margin-top:8px"><input class="form-input" name="end_date" type="date" required><label><input type="checkbox" name="current"> سال جاری</label></div><button class="primary-btn" style="margin-top:10px">افزودن</button></form><div class="table-wrap" style="margin-top:12px">${years.map(y=>`<div style="padding:8px;border-bottom:1px solid var(--line)">${esc(y.name)} <span class="pill">${y.is_current?'جاری':y.status}</span><span class="mini"> — ${y.class_count} کلاس، ${y.student_count} دانش‌آموز</span></div>`).join('')}</div></div>
 <div class="card"><h3>🗓️ دوره‌های نمره‌دهی</h3><p class="mini">نوبت‌هایی مثل «نوبت اول/دوم» برای فیلتر کارنامه‌ی والد و دانش‌آموز؛ نمرات ثبت‌شده در بازه‌ی هر دوره خودکار به همان دوره برچسب می‌خورند.</p><form id="periodForm"><input class="form-input" name="name" placeholder="نوبت اول" required style="margin-top:8px"><div class="row" style="margin-top:8px"><input class="form-input" name="start_date" type="date" required><input class="form-input" name="end_date" type="date" required></div><button class="primary-btn" style="margin-top:8px">افزودن دوره</button></form><div class="table-wrap" style="margin-top:10px">${periods.map(p=>`<div style="padding:7px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${esc(p.name)} <span class="mini">— ${p.start_at.slice(0,10)} تا ${p.end_at.slice(0,10)}</span></span><button class="secondary-btn" onclick="deletePeriod(${p.id})">حذف</button></div>`).join('')||'<p class="mini">دوره‌ای ثبت نشده</p>'}</div></div>
 <div class="card"><h3>🎓 ارتقای دانش‌آموزان</h3><p class="mini">کلاس‌ها اکنون به سال تحصیلی متصل‌اند و سابقه عضویت در student_enrollments نگه‌داری می‌شود.</p><div class="actions"><button class="secondary-btn" onclick="promoteCurrent()">ارتقای خودکار به سال انتخابی</button></div><div id="promoteMsg" class="mini" style="margin-top:8px"></div></div>
 <div class="card"><h3>👤 پرونده دانش‌آموز</h3><form id="profileForm"><select class="form-input" name="student_id">${students.map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select><div class="row" style="margin-top:8px"><input class="form-input" name="birth_date" type="date" placeholder="تولد"><input class="form-input" name="national_id" placeholder="شناسه ملی"></div><input class="form-input" name="address" placeholder="آدرس" style="margin-top:8px"><div class="row" style="margin-top:8px"><input class="form-input" name="emergency_contact_name" placeholder="تماس اضطراری"><input class="form-input" name="emergency_contact_phone" placeholder="تلفن اضطراری"></div><textarea class="form-input" name="notes" placeholder="یادداشت" style="margin-top:8px"></textarea><input class="form-input" name="new_password" type="password" minlength="8" placeholder="بازنشانی رمز (اختیاری)" style="margin-top:8px"><button class="primary-btn" style="margin-top:8px">ذخیره پرونده</button></form></div><div class="card"><h3>⚖️ انضباط</h3><form id="discForm"><div class="row"><select class="form-input" name="student_id" required>${students.map(s=>`<option value="${s.id}">${esc(s.full_name)}</option>`).join('')}</select><select class="form-input" name="type"><option value="positive">تشویق</option><option value="warning">تذکر</option><option value="late">تأخیر</option><option value="absence">غیبت</option><option value="note">یادداشت</option></select></div><input class="form-input" name="title" placeholder="عنوان" required style="margin-top:8px"><textarea class="form-input" name="description" placeholder="توضیحات" style="margin-top:8px"></textarea><button class="primary-btn" style="margin-top:8px">ثبت</button></form></div>
 <div class="card"><h3>📝 برنامه امتحانات</h3><form id="examForm"><select class="form-input" name="exam_id" required>${exams.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('')}</select><div class="row" style="margin-top:8px"><input class="form-input" name="scheduled_date" type="date" required><input class="form-input" name="room" placeholder="اتاق"></div><div class="row" style="margin-top:8px"><input class="form-input" name="start_time" type="time" required><input class="form-input" name="end_time" type="time" required></div><button class="primary-btn" style="margin-top:8px">ذخیره برنامه</button></form></div>
 <div class="card full"><h3>📨 درخواست‌های والدین</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>والد</th><th>دانش‌آموز</th><th>درخواست</th><th>وضعیت</th><th></th></tr></thead><tbody>${req.map(r=>`<tr><td>${esc(r.parent_name)}</td><td>${esc(r.student_name||'—')}</td><td>${esc(r.title)}</td><td>${esc(r.status)}</td><td><select onchange="requestStatus(${r.id},this.value)"><option value="pending">در انتظار</option><option value="approved">تأیید</option><option value="rejected">رد</option><option value="completed">تکمیل</option></select></td></tr>`).join('')||'<tr><td colspan="5">درخواستی نیست</td></tr>'}</tbody></table></div></div>
 <div class="card full"><h3>🤝 جلسات اولیا و معلمان</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>معلم</th><th>والد</th><th>دانش‌آموز</th><th>زمان</th><th>وضعیت</th><th></th></tr></thead><tbody>${meet.map(m=>`<tr><td>${esc(m.teacher_name)}</td><td>${esc(m.parent_name)}</td><td>${esc(m.student_name)}</td><td>${esc(m.scheduled_at)}</td><td>${esc(m.status)}</td><td><select onchange="meetingStatus(${m.id},this.value)"><option value="requested">درخواست</option><option value="confirmed">تأیید</option><option value="completed">انجام شد</option><option value="cancelled">لغو</option></select></td></tr>`).join('')||'<tr><td colspan="6">جلسه‌ای نیست</td></tr>'}</tbody></table></div></div>
 <div class="card"><h3>💰 امور مالی</h3><div class="stat-card"><div class="stat-value">${Number(finance.billed||0).toLocaleString('fa-IR')}</div><div class="stat-label">مبلغ صورتحساب</div></div><div class="stat-card" style="margin-top:8px"><div class="stat-value">${Number(finance.paid||0).toLocaleString('fa-IR')}</div><div class="stat-label">پرداخت‌شده</div></div><div class="stat-card" style="margin-top:8px"><div class="stat-value">${Number(finance.expenses||0).toLocaleString('fa-IR')}</div><div class="stat-label">هزینه‌های مدرسه</div></div><p class="mini">ثبت ردیف شهریه و پرداخت.</p><form id="feeForm"><input class="form-input" name="name" placeholder="عنوان شهریه" required style="margin-top:8px"><input class="form-input" name="amount" type="number" min="0" placeholder="مبلغ" required style="margin-top:8px"><button class="primary-btn" style="margin-top:8px">ساخت ردیف شهریه</button></form><form id="assignFee" style="margin-top:10px"><select class="form-input" name="student_id">${students.map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select><select class="form-input" name="fee_item_id" required style="margin-top:8px">${feeItems.length?feeItems.map(fi=>`<option value="${fi.id}">${esc(fi.name)} — ${Number(fi.amount).toLocaleString('fa-IR')}</option>`).join(''):'<option value="">ابتدا یک ردیف شهریه بسازید</option>'}</select><input class="form-input" name="amount" type="number" min="0" placeholder="مبلغ این دانش‌آموز" required style="margin-top:8px"><button class="secondary-btn" style="margin-top:8px">اختصاص شهریه</button></form></div>
 <div class="card"><h3>📚 کتابخانه</h3><div class="stat-card"><div class="stat-value">${lib.books.length}</div><div class="stat-label">عنوان کتاب</div></div><p class="mini">امانت فعال: ${lib.loans.filter(x=>x.status==='borrowed').length}</p><form id="bookForm"><input class="form-input" name="title" placeholder="عنوان کتاب" required style="margin-top:8px"><input class="form-input" name="author" placeholder="نویسنده" style="margin-top:8px"><input class="form-input" name="total_copies" type="number" min="1" value="1" style="margin-top:8px"><button class="primary-btn" style="margin-top:8px">افزودن کتاب</button></form><div class="table-wrap" style="margin-top:10px">${lib.books.map(x=>`<div style="padding:7px;border-bottom:1px solid var(--line)">${esc(x.title)} — ${x.available_copies}/${x.total_copies}</div>`).join('')}</div><form id="loanForm" style="margin-top:10px"><select class="form-input" name="book_id" required>${lib.books.filter(b=>b.available_copies>0).map(b=>`<option value="${b.id}">${esc(b.title)} (${b.available_copies} موجود)</option>`).join('')||'<option value="">کتاب موجودی ندارد</option>'}</select><select class="form-input" name="student_id" required style="margin-top:8px">${students.map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select><input class="form-input" name="due_at" type="date" style="margin-top:8px"><button class="secondary-btn" style="margin-top:8px">امانت دادن</button></form><div class="table-wrap" style="margin-top:10px">${lib.loans.filter(x=>x.status==='borrowed').map(x=>`<div style="padding:7px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${esc(x.book_title)} — ${esc(x.student_name)}</span><button class="secondary-btn" onclick="returnLoan(${x.id})">برگشت</button></div>`).join('')||'<p class="mini">امانت فعالی نیست</p>'}</div></div>
 <div class="card full"><h3>👤 حساب کاربری من</h3><div id="accountPanel"></div></div>`;
 mountAccountPanel('accountPanel');
 $('loanForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api.post('/api/admin/library',{action:'loan',...Object.fromEntries(f)});toast('کتاب امانت داده شد');load()};
 $('yearForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api.post('/api/admin/academic-years',{name:f.get('name'),start_date:f.get('start_date'),end_date:f.get('end_date'),is_current:f.has('current')});load()};
 $('periodForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api.post('/api/admin/grade-periods',Object.fromEntries(f));toast('دوره ساخته شد');load()}catch(e){toast(e.message,true)}};
 $('profileForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));Object.keys(b).forEach(k=>{if(!b[k])delete b[k]});await api.patch('/api/admin/student-profile',b);toast('پرونده ذخیره شد')};
 $('discForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api.post('/api/admin/discipline',Object.fromEntries(f));toast('ثبت شد');e.target.reset()};
 $('examForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api.post('/api/admin/exam-schedule',Object.fromEntries(f));toast('برنامه ذخیره شد')};
 $('bookForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api.post('/api/admin/library',{action:'book',...Object.fromEntries(f)});toast('کتاب اضافه شد');load()};
 $('feeForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api.post('/api/admin/finance',{action:'fee',...Object.fromEntries(f)});toast('ردیف شهریه ساخته شد');load()};
 $('assignFee').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api.post('/api/admin/finance',{action:'assign',...Object.fromEntries(f)});toast('شهریه اختصاص یافت')};
}
async function requestStatus(id,status){await api.patch('/api/admin/parent-requests',{id,status});toast('وضعیت بروزرسانی شد')}
async function meetingStatus(id,status){await api.patch('/api/admin/meetings',{id,status});toast('جلسه بروزرسانی شد')}
async function returnLoan(id){try{await api.post('/api/admin/library',{action:'return',loan_id:id});toast('کتاب برگشت داده شد');load()}catch(e){toast(e.message,true)}}
async function deletePeriod(id){if(!confirm('این دوره حذف شود؟ نمرات ثبت‌شده در آن، بدون دوره باقی می‌مانند.'))return;try{await api.del('/api/admin/grade-periods',{id});toast('دوره حذف شد');load()}catch(e){toast(e.message,true)}}
let promotePreviewCache=null;
async function promoteCurrent(){
 const years=await api.get('/api/admin/academic-years');
 if(years.length<2){$('promoteMsg').textContent='ابتدا سال جدید را بسازید.';return}
 const current=years.find(x=>x.is_current);
 if(!current){$('promoteMsg').textContent='سال جاری پیدا نشد.';return}
 // years is sorted start_date DESC; pick the NEAREST future year after the
 // current one (smallest start_date that is still > current's), not just
 // "any" non-current year -- with 3+ years defined ahead, picking the
 // first non-current hit in DESC order would jump straight to the
 // furthest year and skip the intended next one.
 const candidates=years.filter(x=>!x.is_current && x.start_date>current.start_date).sort((a,b)=>a.start_date<b.start_date?-1:1);
 const target=candidates[0];
 if(!target){$('promoteMsg').textContent='سال مقصدی پیدا نشد.';return}
 const p=await api.post('/api/admin/academic-years',{action:'promote_preview',to_year_id:target.id});
 promotePreviewCache={target,preview:p};
 const unmatched=p.source_classes.filter(c=>!c.suggested_to_class_id && c.student_count>0);
 if(!unmatched.length){
   await runPromote(target.id,[]);
   return;
 }
 // Some source classes have no same-name match in the target year (e.g. real
 // grade advancement like «هفتم الف» -> «هشتم الف») -- ask the admin to map
 // those specific classes by hand instead of silently skipping their students.
 $('promoteMsg').innerHTML=`<div class="field"><p class="mini">این کلاس‌ها معادل هم‌نام در سال مقصد ندارند؛ کلاس مقصد هرکدام را انتخاب کنید:</p>`+
   unmatched.map(c=>`<div style="margin-top:6px">${esc(c.name)} (${c.student_count} دانش‌آموز) → <select data-from="${c.id}"><option value="">— انتخاب کنید —</option>${p.target_classes.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>`).join('')+
   `<button class="primary-btn" style="margin-top:8px" onclick="submitPromoteMapping()">تأیید و ارتقا</button></div>`;
}
async function submitPromoteMapping(){
 if(!promotePreviewCache)return;
 const {target,preview}=promotePreviewCache;
 const chosen=[...document.querySelectorAll('#promoteMsg select[data-from]')].filter(s=>s.value).map(s=>({from_class_id:Number(s.dataset.from),to_class_id:Number(s.value)}));
 const autoMatched=preview.source_classes.filter(c=>c.suggested_to_class_id).map(c=>({from_class_id:c.id,to_class_id:c.suggested_to_class_id}));
 await runPromote(target.id,[...chosen,...autoMatched]);
}
async function runPromote(toYearId,mapping){
 try{
   const body={action:'promote_auto',to_year_id:toYearId};
   if(mapping.length)body.mapping=mapping;
   const r=await api.post('/api/admin/academic-years',body);
   $('promoteMsg').textContent=`${r.promoted} دانش‌آموز ارتقا یافت؛ ${r.skipped} مورد از قبل ثبت‌شده بود.`;
 }catch(e){$('promoteMsg').textContent=e.message}
}
load().catch(e=>toast(e.message,true));
</script></body></html>
