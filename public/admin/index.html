<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>پنل مدیر | مدرسه</title>
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div class="app">

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileNav()"></div>
<aside class="sidebar" id="sidebar">
    <div class="logo">
        <div class="logo-icon">م</div>
        <div><strong>مدرسه</strong><span>School Platform</span></div>
    </div>

    <div class="role-box">
        <div class="role-label">محیط فعلی</div>
        <div class="role-name" id="roleName">مدیر مدرسه</div>
    </div>

    <nav class="nav" id="nav"></nav>

</aside>

<main class="main">
    <header class="topbar">
        <div class="top-left">
            <button class="mobile-menu" onclick="toggleMobileNav()">☰</button>
        </div>
        <div class="top-right">
            <button type="button" class="secondary-btn" onclick="openOnboardingWizard()" style="margin-left:12px">🚀 شروع سریع</button>
            <div class="profile">
                <div class="avatar" id="avatar">م</div>
                <div>
                    <div class="profile-name" id="profileName">—</div>
                    <div class="profile-role" id="profileRole">—</div>
                </div>
            </div>
        </div>
    </header>

    <section class="content" id="content"></section>
</main>

</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modalBox">
        <div class="modal-head">
            <div class="modal-title" id="modalTitle">عنوان</div>
            <button class="close" onclick="closeModal()">×</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<script src="../assets/js/jalali.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/modal.js"></script>

<script>

/* =========================================================
   NAV CONFIG
   `available:false` items are real parts of the intended product
   (per the project's roadmap) whose backend API doesn't exist yet.
   They're shown, disabled, rather than hidden -- so the sidebar
   honestly reflects the full intended admin surface.
========================================================= */

const NAV_ITEMS = [
    { key: "dashboard",     icon: "🏠", label: "داشبورد" },
    { key: "students",      icon: "🎓", label: "دانش‌آموزان" },
    { key: "teachers",      icon: "👨‍🏫", label: "معلمان" },
    { key: "parents",       icon: "👪", label: "والدین" },
    { key: "classes",       icon: "🏫", label: "کلاس‌ها" },
    { key: "subjects",      icon: "📚", label: "دروس" },
    { key: "schedule",      icon: "🗓️", label: "برنامه هفتگی" },
    { key: "announcements", icon: "📢", label: "اطلاعیه‌ها" },
    { key: "messages",      icon: "💬", label: "پیام‌ها" },
    { key: "reports",       icon: "📊", label: "گزارش‌ها" },
    { key: "question-review", icon: "📝", label: "تأیید سؤالات عمومی" },
    { key: "settings",      icon: "⚙️", label: "تنظیمات" },
    { key: "help",          icon: "❓", label: "راهنما" },
];

let cache = { students: null, classes: null, announcements: null, conversations: null, teachers: null, subjects: null, parents: null };

async function loadClasses() {
    const classes = (await api.get("/api/admin/classes")) || [];
    cache.classes = classes;
    return classes;
}

async function loadStudents() {
    const students = (await api.get("/api/admin/students")) || [];
    cache.students = students;
    return students;
}

function navigate(key) {
    setActiveNav(key);
    render(key);
}

async function render(key) {
    const content = document.getElementById("content");
    content.innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted)">در حال بارگذاری...</div>`;
    try {
        if (key === "dashboard") await renderDashboard();
        else if (key === "students") await renderStudents();
        else if (key === "classes") await renderClasses();
        else if (key === "announcements") await renderAnnouncements();
        else if (key === "messages") await renderMessages();
        else if (key === "teachers") await renderTeachers();
        else if (key === "subjects") await renderSubjects();
        else if (key === "parents") await renderParents();
        else if (key === "schedule") await renderSchedule();
        else if (key === "reports") await renderReports();
        else if (key === "question-review") await renderQuestionReview();
        else if (key === "settings") await renderSettings();
        else if (key === "help") renderHelp();
    } catch (e) {
        content.innerHTML = `<div class="card"><div style="color:var(--red)">خطا در بارگذاری: ${escapeHtml(e.message)}</div></div>`;
    }
}

/* =========================================================
   DASHBOARD
========================================================= */

async function renderDashboard() {
    let [students, classes, announcements] = await Promise.all([
        api.get("/api/admin/students").catch(() => []),
        api.get("/api/admin/classes").catch(() => []),
        api.get("/api/announcements/announcements").catch(() => []),
    ]);
    // A resolved (non-throwing) call can still come back with data:null --
    // .catch() above only guards against rejections, not that case.
    students = students || []; classes = classes || []; announcements = announcements || [];
    cache.students = students; cache.classes = classes; cache.announcements = announcements;

    const activeStudents = students.filter(s => s.is_active).length;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div>
                <div class="page-title">داشبورد مدیر</div>
                <div class="page-subtitle">نمای کلی مدرسه</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-top"><div class="stat-icon">🎓</div></div>
                <div class="stat-value">${students.length}</div>
                <div class="stat-label">تعداد دانش‌آموزان</div>
            </div>
            <div class="stat-card">
                <div class="stat-top"><div class="stat-icon">✅</div></div>
                <div class="stat-value">${activeStudents}</div>
                <div class="stat-label">دانش‌آموزان فعال</div>
            </div>
            <div class="stat-card">
                <div class="stat-top"><div class="stat-icon">🏫</div></div>
                <div class="stat-value">${classes.length}</div>
                <div class="stat-label">تعداد کلاس‌ها</div>
            </div>
            <div class="stat-card">
                <div class="stat-top"><div class="stat-icon">📢</div></div>
                <div class="stat-value">${announcements.length}</div>
                <div class="stat-label">اطلاعیه‌های اخیر</div>
            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-title">آخرین اطلاعیه‌ها</div>
                <button class="card-action" onclick="navigate('announcements')">مشاهده همه</button>
            </div>
            ${announcements.slice(0, 5).map(a => `
                <div class="activity">
                    <div class="activity-icon">📢</div>
                    <div>
                        <div class="activity-text"><b>${escapeHtml(a.title)}</b> — ${escapeHtml(a.author_name)}</div>
                        <div class="activity-time">${formatJalaliDate(a.created_at)}</div>
                    </div>
                </div>
            `).join("") || `<div class="page-subtitle">اطلاعیه‌ای ثبت نشده</div>`}
        </div>
    `;
}

/* =========================================================
   STUDENTS
========================================================= */

async function renderStudents() {
    const students = (await api.get("/api/admin/students")) || [];
    cache.students = students;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div>
                <div class="page-title">دانش‌آموزان</div>
                <div class="page-subtitle">${students.length} دانش‌آموز</div>
            </div>
            <div style="display:flex;gap:8px">
                <button class="secondary-btn" onclick="openStudentImportForm()">⬆️ ایمپورت گروهی (CSV)</button>
                <button class="primary-btn" onclick="openStudentForm()">+ ثبت دانش‌آموز جدید</button>
            </div>
        </div>

        <div class="module">
            <div class="module-body table-wrap">
                <table>
                    <thead><tr><th>نام</th><th>نام کاربری</th><th>کد دانش‌آموزی</th><th>وضعیت</th></tr></thead>
                    <tbody>
                        ${students.map(s => `
                            <tr>
                                <td>${escapeHtml(s.full_name)}</td>
                                <td>${escapeHtml(s.username)}</td>
                                <td>${escapeHtml(s.student_code || "—")}</td>
                                <td><span class="status ${s.is_active ? "green" : "red"}">${s.is_active ? "فعال" : "غیرفعال"}</span></td>
                            </tr>
                        `).join("") || `<tr><td colspan="4" style="text-align:center;color:var(--muted)">دانش‌آموزی ثبت نشده</td></tr>`}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

async function openStudentImportForm() {
    const classes = (cache.classes || await api.get("/api/admin/classes")) || [];
    cache.classes = classes;

    if (classes.length === 0) {
        toast("ابتدا باید حداقل یک کلاس بسازید", true);
        return;
    }

    openModal("ایمپورت گروهی دانش‌آموز", `
        <p class="page-subtitle" style="margin-bottom:10px">
            محتوای فایل CSV رو اینجا پیست کن. هر خط: <b>نام کامل،نام‌کاربری،رمز عبور</b>
            (با کاما جدا، بدون خط سرستون). حداکثر ۵۰۰ ردیف در هر بار.
        </p>
        <form id="studentImportForm">
            <div class="form-group">
                <label>کلاس مقصد</label>
                <select class="form-input" name="class_id" required>
                    ${classes.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}
                </select>
            </div>
            <div class="form-group">
                <label>محتوای CSV</label>
                <textarea class="form-input" name="csv" rows="8" placeholder="علی رضایی,ali_r,pass12345&#10;سارا احمدی,sara_a,pass67890" required></textarea>
            </div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ایمپورت</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);

    document.getElementById("studentImportForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const classId = Number(fd.get("class_id"));
        const lines = fd.get("csv").split("\n").map(l => l.trim()).filter(Boolean);

        const rows = lines.map(line => {
            const parts = line.split(",").map(p => p.trim());
            return { full_name: parts[0] || "", username: parts[1] || "", password: parts[2] || "" };
        });

        if (rows.length === 0) { toast("هیچ ردیف معتبری پیدا نشد", true); return; }

        try {
            const res = await api.post("/api/admin/students-import", { class_id: classId, students: rows });
            cache.students = null;
            closeModal();
            let msg = `${res.created.length} دانش‌آموز ثبت شد`;
            if (res.failed.length) msg += ` — ${res.failed.length} ردیف ناموفق (ردیف‌های: ${res.failed.map(f => f.row).join("، ")})`;
            toast(msg, res.failed.length > 0);
            renderStudents();
        } catch (err) { toast(err.message, true); }
    });
}

async function openStudentForm() {
    const classes = (cache.classes || await api.get("/api/admin/classes")) || [];
    cache.classes = classes;

    if (classes.length === 0) {
        toast("ابتدا باید حداقل یک کلاس بسازید", true);
        return;
    }

    openModal("ثبت دانش‌آموز جدید", `
        <form id="studentForm">
            <div class="form-group"><label>نام کامل</label><input class="form-input" name="full_name" required></div>
            <div class="form-group"><label>نام کاربری</label><input class="form-input" name="username" required></div>
            <div class="form-group"><label>رمز عبور</label><input class="form-input" name="password" type="password" required></div>
            <div class="form-group"><label>کلاس</label>
                <select class="form-input" name="class_id" required>
                    ${classes.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}
                </select>
            </div>
            <div class="form-group"><label>کد دانش‌آموزی (اختیاری)</label><input class="form-input" name="student_code"></div>
            <div class="form-group"><label>تلفن (اختیاری)</label><input class="form-input" name="phone"></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ثبت</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);

    document.getElementById("studentForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        await withToast(() => api.post("/api/admin/students", body), "دانش‌آموز ثبت شد");
        closeModal();
        renderStudents();
    });
}

/* =========================================================
   CLASSES
========================================================= */

async function renderClasses() {
    const classes = (await api.get("/api/admin/classes")) || [];
    cache.classes = classes;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div>
                <div class="page-title">کلاس‌ها</div>
                <div class="page-subtitle">${classes.length} کلاس</div>
            </div>
            <button class="primary-btn" onclick="openClassForm()">+ کلاس جدید</button>
        </div>

        <div class="module">
            <div class="module-body table-wrap">
                <table>
                    <thead><tr><th>نام کلاس</th><th>پایه</th><th>سطح تحصیلی</th><th></th></tr></thead>
                    <tbody>
                        ${classes.map(c => `
                            <tr>
                                <td>${escapeHtml(c.name)}</td>
                                <td>${escapeHtml(c.grade || "—")}</td>
                                <td><span class="status ${c.education_level === "elementary" ? "green" : "orange"}">${educationLevelLabel(c.education_level)}</span></td>
                                <td><button class="secondary-btn" onclick="deleteClass(${c.id})">حذف</button></td>
                            </tr>
                        `).join("") || `<tr><td colspan="4" style="text-align:center;color:var(--muted)">کلاسی ثبت نشده</td></tr>`}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function educationLevelLabel(l) { return l === "elementary" ? "ابتدایی" : "دبیرستان"; }

function openClassForm() {
    openModal("ساخت کلاس جدید", `
        <form id="classForm">
            <div class="form-group"><label>نام کلاس</label><input class="form-input" name="name" required></div>
            <div class="form-group"><label>پایه (اختیاری)</label><input class="form-input" name="grade"></div>
            <div class="form-group"><label>سطح تحصیلی</label>
                <select class="form-input" name="education_level">
                    <option value="secondary">دبیرستان</option>
                    <option value="elementary">ابتدایی</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ثبت</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);

    document.getElementById("classForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        await withToast(() => api.post("/api/admin/classes", body), "کلاس ساخته شد");
        closeModal();
        renderClasses();
    });
}

async function deleteClass(id) {
    if (!confirm("از حذف این کلاس مطمئن هستید؟")) return;
    await withToast(() => api.del("/api/admin/classes", { id }), "کلاس حذف شد");
    renderClasses();
}

/* =========================================================
   TEACHERS
========================================================= */

async function renderTeachers() {
    const teachers = await api.get("/api/admin/teachers");
    cache.teachers = teachers;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div><div class="page-title">معلمان</div><div class="page-subtitle">${teachers.length} معلم</div></div>
            <button class="primary-btn" onclick="openTeacherForm()">+ ثبت معلم جدید</button>
        </div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>نام</th><th>نام کاربری</th><th>تخصص</th><th>وضعیت</th><th></th></tr></thead>
                <tbody>
                    ${teachers.map(t => `
                        <tr>
                            <td>${escapeHtml(t.full_name)}</td><td>${escapeHtml(t.username)}</td><td>${escapeHtml(t.specialty || "—")}</td>
                            <td><span class="status ${t.is_active ? "green" : "red"}">${t.is_active ? "فعال" : "غیرفعال"}</span></td>
                            <td><button class="secondary-btn" onclick="openAssignForm(${t.id}, ${escapeAttr(t.full_name)})">تخصیص کلاس/درس</button></td>
                        </tr>
                    `).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--muted)">معلمی ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

function openTeacherForm() {
    openModal("ثبت معلم جدید", `
        <form id="teacherForm">
            <div class="form-group"><label>نام کامل</label><input class="form-input" name="full_name" required></div>
            <div class="form-group"><label>نام کاربری</label><input class="form-input" name="username" required></div>
            <div class="form-group"><label>رمز عبور</label><input class="form-input" name="password" type="password" required></div>
            <div class="form-group"><label>تخصص (اختیاری)</label><input class="form-input" name="specialty"></div>
            <div class="form-group"><label>تلفن (اختیاری)</label><input class="form-input" name="phone"></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ثبت</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);

    document.getElementById("teacherForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        await withToast(() => api.post("/api/admin/teachers", body), "معلم ثبت شد");
        closeModal();
        renderTeachers();
    });
}

async function openAssignForm(teacherId, teacherName) {
    const [classes, subjects] = await Promise.all([loadClasses(), api.get("/api/admin/subjects")]);
    cache.subjects = subjects;

    if (classes.length === 0 || subjects.length === 0) {
        toast("ابتدا باید حداقل یک کلاس و یک درس بسازید", true);
        return;
    }

    openModal(`تخصیص کلاس/درس به ${teacherName}`, `
        <form id="assignForm">
            <div class="form-group"><label>کلاس</label>
                <select class="form-input" name="class_id" required>${classes.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}</select>
            </div>
            <div class="form-group"><label>درس</label>
                <select class="form-input" name="subject_id" required>${subjects.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("")}</select>
            </div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ثبت تخصیص</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);

    document.getElementById("assignForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        body.teacher_id = teacherId;
        await withToast(() => api.post("/api/admin/teaching-assignments", body), "تخصیص ثبت شد");
        closeModal();
    });
}

/* =========================================================
   SUBJECTS
========================================================= */

async function renderSubjects() {
    const subjects = await api.get("/api/admin/subjects");
    cache.subjects = subjects;

    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div><div class="page-title">دروس</div><div class="page-subtitle">${subjects.length} درس</div></div>
            <button class="primary-btn" onclick="openSubjectForm()">+ درس جدید</button>
        </div>
        <div class="module"><div class="module-body table-wrap">
            <table>
                <thead><tr><th>نام درس</th><th>پایه</th><th></th></tr></thead>
                <tbody>
                    ${subjects.map(s => `
                        <tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.grade || "—")}</td><td><button class="secondary-btn" onclick="renameSubject(${s.id})">ویرایش نام</button> <button class="secondary-btn" onclick="deleteSubject(${s.id})">حذف</button></td></tr>
                    `).join("") || `<tr><td colspan="3" style="text-align:center;color:var(--muted)">درسی ثبت نشده</td></tr>`}
                </tbody>
            </table>
        </div></div>
    `;
}

function openSubjectForm() {
    openModal("درس جدید", `
        <form id="subjectForm">
            <div class="form-group"><label>نام درس</label><input class="form-input" name="name" required></div>
            <div class="form-group"><label>پایه (اختیاری)</label><input class="form-input" name="grade"></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">ثبت</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">انصراف</button>
            </div>
        </form>
    `);

    document.getElementById("subjectForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        await withToast(() => api.post("/api/admin/subjects", body), "درس ساخته شد");
        closeModal();
        renderSubjects();
    });
}

async function renameSubject(id) {
    const subject = cache.subjects.find(s => s.id === id);
    const name = prompt("نام جدید درس:", subject ? subject.name : "");
    if (!name || !name.trim() || (subject && name.trim() === subject.name)) return;
    await withToast(() => api.put("/api/admin/subjects", { id, name: name.trim() }), "نام درس بروزرسانی شد");
    renderSubjects();
}

async function deleteSubject(id) {
    if (!confirm("از حذف این درس مطمئن هستید؟")) return;

async function saveBranding() {
    const status = document.getElementById("brandStatus");
    const name = document.getElementById("brandName").value;
    const primary_color = document.getElementById("brandColor").value;
    const logoFile = document.getElementById("brandLogo").files[0];

    const body = { name, primary_color };
    if (logoFile) {
        if (logoFile.size > 200_000) {
            status.textContent = "حجم فایل لوگو بیش از حد مجاز است (حداکثر ۲۰۰KB).";
            return;
        }
        body.logo_data = await fileToDataUrl(logoFile);
    }

    try {
        status.textContent = "در حال ذخیره...";
        await api.patch("/api/admin/school", body);
        status.textContent = "ذخیره شد.";
        applyBranding(); // repaint this admin's own header immediately too
    } catch (e) {
        status.textContent = "خطا: " + e.message;
    }
}

function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function addHoliday() {
    const holiday_date = readJalaliDatePicker("holidayDate");
    const title = document.getElementById("holidayTitle").value;
    if (!holiday_date || !title.trim()) { toast("تاریخ و عنوان را وارد کنید", true); return; }
    await withToast(() => api.post("/api/admin/holidays", { holiday_date, title }), "تعطیلی ثبت شد");
    renderSettings();
}

async function deleteHoliday(id) {
    if (!confirm("از حذف این تعطیلی مطمئن هستید؟")) return;
    await withToast(() => api.del("/api/admin/holidays", { id }), "تعطیلی حذف شد");
    renderSettings();
}

async function downloadBackup() {
    const status = document.getElementById("backupStatus");
    status.textContent = "در حال آماده‌سازی...";
    try {
        const dump = await api.get("/api/admin/backup");
        const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `madrese-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        status.textContent = "دانلود شد.";
    } catch (e) {
        status.textContent = "خطا: " + e.message;
    }
}

    const labelOf = (c) => c.title === "__superadmin__"

        <div class="page-subtitle" style="margin-bottom:14px">وقتی یک معلم می‌خواد سؤالی رو با بقیه‌ی معلم‌های مدرسه به اشتراک بذاره، اول اینجا برای تأیید تو میاد — بعد از تأیید، بقیه‌ی معلم‌ها می‌تونن تو «بانک عمومی مدرسه» ببیننش و به بانک خودشون کپی کنن.</div>
        ${pending.length ? pending.map(p => `
            <div class="card" style="margin-bottom:10px">
                <div class="card-head">
                    <div class="card-title">${escapeHtml(p.text)}</div>
                    <span class="status">${ADMIN_QUESTION_TYPE_LABELS[p.type] || p.type}</span>
                </div>
                <div class="page-subtitle">معلم: ${escapeHtml(p.teacher_name)}${p.chapter ? ` · فصل: ${escapeHtml(p.chapter)}` : ""}${p.difficulty ? ` · سختی: ${escapeHtml(p.difficulty)}` : ""}</div>
                <div style="display:flex;gap:8px;margin-top:10px">
                    <button class="primary-btn" onclick="moderateQuestion(${p.id}, 'approve')">✅ تأیید</button>
                    <button class="secondary-btn" onclick="moderateQuestion(${p.id}, 'reject')">رد</button>
                </div>
            </div>
        `).join("") : `<div class="card"><div class="page-subtitle">سؤالی در انتظار تأیید نیست.</div></div>`}
    `;
}

async function moderateQuestion(id, action) {
    await withToast(() => api.post("/api/admin/moderate-question", { question_id: id, action }));
    renderQuestionReview();
}

            <div class="stat-card"><div class="stat-value">${r.counts.teacher_count}</div><div class="stat-label">معلم</div></div>

                <thead><tr><th>کلاس</th><th>سطح</th><th>میانگین</th><th>تعداد نمره ثبت‌شده</th></tr></thead>
                <tbody>${r.class_averages.map(c => `
                    <tr>
                        <td>${escapeHtml(c.class_name)}</td>
                        <td>${c.education_level === "elementary" ? "ابتدایی" : "متوسطه"}</td>

                        <td>${c.grade_count}</td>

            </table></div>

        <div class="card">
            <div class="card-head"><div class="card-title">تکالیف دارای مهلت گذشته</div></div>
            <div class="table-wrap"><table>
                <thead><tr><th>تکلیف</th><th>کلاس</th><th>مهلت</th><th>ارسال‌شده</th></tr></thead>
                <tbody>${r.overdue_assignments.map(a => `
                    <tr>
                        <td>${escapeHtml(a.title)}</td>
                        <td>${escapeHtml(a.class_name)}</td>
                        <td>${formatJalaliDate(a.due_at)}</td>
                        <td>${a.submitted_count} / ${a.class_size}</td>

/* =========================================================
   ONBOARDING WIZARD — fاز ۱: راه‌اندازی سریع مدرسه‌ی تازه
   قدم‌ها: کلاس اول → درس اول → معلم اول (+تخصیص) → دانش‌آموز اول
   از همون endpoint های موجود استفاده می‌کنه، چیز جدیدی به Backend اضافه نمی‌کنه.
========================================================= */

let __wizard = { class_id: null, class_name: "", subject_id: null, subject_name: "", teacher_id: null, teacher_name: "" };

function openOnboardingWizard() {
    __wizard = { class_id: null, class_name: "", subject_id: null, subject_name: "", teacher_id: null, teacher_name: "" };
    renderWizardStep1();
}

function wizardProgress(step) {
    const labels = ["کلاس", "درس", "معلم", "دانش‌آموز"];
    return `<div style="display:flex;gap:6px;margin-bottom:16px">
        ${labels.map((l, i) => `
            <div style="flex:1;text-align:center;font-size:11px;padding:6px 4px;border-radius:8px;
                background:${i < step ? 'var(--brand,#4338CA)' : 'var(--surface2)'};
                color:${i < step ? '#fff' : 'inherit'}">${i + 1}. ${l}</div>
        `).join("")}
    </div>`;
}

function renderWizardStep1() {
    openModal("شروع سریع — قدم ۱ از ۴", `
        ${wizardProgress(1)}
        <p class="page-subtitle" style="margin-bottom:12px">اول یک کلاس بساز — مثلاً «هفتم الف» یا «اول ابتدایی».</p>
        <form id="wizStep1">
            <div class="form-group"><label>نام کلاس</label><input class="form-input" name="name" placeholder="مثلاً هفتم الف" required></div>
            <div class="form-group"><label>پایه (اختیاری)</label><input class="form-input" name="grade" placeholder="مثلاً هفتم"></div>
            <div class="form-group">
                <label>سطح تحصیلی</label>
                <select class="form-input" name="education_level">
                    <option value="secondary">دبیرستان/متوسطه</option>
                    <option value="elementary">ابتدایی</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">بعدی</button>
                <button type="button" class="secondary-btn" onclick="closeModal()">بعداً</button>
            </div>
        </form>
    `);
    document.getElementById("wizStep1").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { name: fd.get("name"), grade: fd.get("grade") || null, education_level: fd.get("education_level") };
        try {
            const res = await api.post("/api/admin/classes", body);
            __wizard.class_id = res.id;
            __wizard.class_name = body.name;
            cache.classes = null; // force refresh later
            renderWizardStep2();
        } catch (err) { toast(err.message, true); }
    });
}

function renderWizardStep2() {
    openModal("شروع سریع — قدم ۲ از ۴", `
        ${wizardProgress(2)}
        <p class="page-subtitle" style="margin-bottom:12px">حالا یک درس بساز — مثلاً «ریاضی».</p>
        <form id="wizStep2">
            <div class="form-group"><label>نام درس</label><input class="form-input" name="name" placeholder="مثلاً ریاضی" required></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">بعدی</button>
                <button type="button" class="secondary-btn" onclick="renderWizardStep1()">قبلی</button>
            </div>
        </form>
    `);
    document.getElementById("wizStep2").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { name: fd.get("name") };
        try {
            const res = await api.post("/api/admin/subjects", body);
            __wizard.subject_id = res.id;
            __wizard.subject_name = body.name;
            cache.subjects = null;
            renderWizardStep3();
        } catch (err) { toast(err.message, true); }
    });
}

function renderWizardStep3() {
    openModal("شروع سریع — قدم ۳ از ۴", `
        ${wizardProgress(3)}
        <p class="page-subtitle" style="margin-bottom:12px">
            یک معلم بساز — خودکار برای تدریس «${escapeHtml(__wizard.subject_name)}» در کلاس «${escapeHtml(__wizard.class_name)}» تخصیص داده می‌شه.
        </p>
        <form id="wizStep3">
            <div class="form-group"><label>نام کامل معلم</label><input class="form-input" name="full_name" required></div>
            <div class="form-group"><label>نام کاربری</label><input class="form-input" name="username" required></div>
            <div class="form-group"><label>رمز عبور (حداقل ۸ کاراکتر)</label><input class="form-input" name="password" type="password" minlength="8" required></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">بعدی</button>
                <button type="button" class="secondary-btn" onclick="renderWizardStep2()">قبلی</button>
            </div>
        </form>
    `);
    document.getElementById("wizStep3").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { full_name: fd.get("full_name"), username: fd.get("username"), password: fd.get("password") };
        try {
            const res = await api.post("/api/admin/teachers", body);
            __wizard.teacher_id = res.id;
            __wizard.teacher_name = body.full_name;
            cache.teachers = null;
            // auto-assign this teacher to the class+subject just created
            await api.post("/api/admin/teaching-assignments", {
                teacher_id: res.id, class_id: __wizard.class_id, subject_id: __wizard.subject_id,
            });
            renderWizardStep4();
        } catch (err) { toast(err.message, true); }
    });
}

function renderWizardStep4() {
    openModal("شروع سریع — قدم ۴ از ۴", `
        ${wizardProgress(4)}
        <p class="page-subtitle" style="margin-bottom:12px">در نهایت اولین دانش‌آموز رو به کلاس «${escapeHtml(__wizard.class_name)}» اضافه کن.</p>
        <form id="wizStep4">
            <div class="form-group"><label>نام کامل دانش‌آموز</label><input class="form-input" name="full_name" required></div>
            <div class="form-group"><label>نام کاربری</label><input class="form-input" name="username" required></div>
            <div class="form-group"><label>رمز عبور (حداقل ۸ کاراکتر)</label><input class="form-input" name="password" type="password" minlength="8" required></div>
            <div class="modal-footer">
                <button type="submit" class="primary-btn">پایان</button>
                <button type="button" class="secondary-btn" onclick="renderWizardStep3()">قبلی</button>
            </div>
        </form>
    `);
    document.getElementById("wizStep4").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { full_name: fd.get("full_name"), username: fd.get("username"), password: fd.get("password"), class_id: __wizard.class_id };
        try {
            await api.post("/api/admin/students", body);
            cache.students = null;
            renderWizardDone();
        } catch (err) { toast(err.message, true); }
    });
}

function renderWizardDone() {
    openModal("آماده شد 🎉", `
        <p class="page-subtitle" style="margin-bottom:14px">مدرسه‌ت آماده‌ی کار شد:</p>
        <ul style="font-size:13px;line-height:2;margin-bottom:16px">
            <li>کلاس: <b>${escapeHtml(__wizard.class_name)}</b></li>
            <li>درس: <b>${escapeHtml(__wizard.subject_name)}</b></li>
            <li>معلم: <b>${escapeHtml(__wizard.teacher_name)}</b> (تخصیص داده شد)</li>
            <li>دانش‌آموز اول ثبت شد</li>
        </ul>
        <div class="modal-footer">
            <button type="button" class="primary-btn" onclick="closeModal(); render('dashboard')">برو به داشبورد</button>
        </div>
    `);
}
